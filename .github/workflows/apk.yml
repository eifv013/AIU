# 안드로이드 APK 자동 빌드
# main 에 올릴 때마다(또는 Actions 탭에서 직접 실행) 게임을 앱으로 감싸 APK 를 만들고,
# 저장소 Releases 의 "AIU 최신 APK" 에 올림 → 휴대폰에서 그 페이지를 열어 바로 받을 수 있음.
# 아이콘과 시작 그림은 assets/icon-*.png, assets/splash*.png 를 그대로 씀 (바꾸려면 그 파일만 바꿔 올리면 됨)
name: APK

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'android-src/**', 'build.js', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: 게임 만들기와 규칙 테스트
        run: |
          node --test src/core.test.js
          node build.js
          mkdir -p www && cp dist/index.html www/index.html

      - name: Capacitor 설치
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/splash-screen@7 @capacitor/assets@3

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#090d1b' --splashBackgroundColor '#090d1b'
          npx cap sync android

      - name: 세로 고정, 전체 화면, 버전 번호
        run: |
          # 전체 화면: 상태 표시줄과 내비게이션 바를 숨기는 MainActivity 로 바꿈
          cp android-src/MainActivity.java android/app/src/main/java/com/loopandlamp/aiu/MainActivity.java
          VER=$(grep -oP "APP_VERSION = '\K[^']+" src/game.html)
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AIU.apk

      # 다른 게임처럼 최신 APK 하나만 남김: 예전 버전 파일을 모두 지우고 새로 올림
      - name: 예전 APK 지우기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            for a in $(gh release view apk-latest --json assets -q '.assets[].name'); do gh release delete-asset apk-latest "$a" -y; done
          fi

      - name: Releases 에 최신 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AIU 최신 APK (${{ env.VER }})
          body: |
            최신 버전 ${{ env.VER }} 이에요. 휴대폰에서 아래 AIU.apk 를 눌러 받은 뒤 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치 허용"을 켜야 해요. 시험용(디버그) 서명이라 스토어 출시용은 아니에요.
          files: AIU.apk
          make_latest: true
