<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 수사 3팀과 같은 누아르, 비 오는 밤의 범죄 액션, 모바일 방치형
   IDEA: 이상현상 전담수사팀 요원들이 비 내리는 도시 구역을 돌아다니며 이상체를 처리
   PICTURE: 상단 전투 캔버스(구역 지도, 요원, 이상체, 근원체)
   COLOUR and TYPE: 깊은 남색 패널 + 금색 테두리 + 진홍 강조 / Black Han Sans 제목, Noto Sans KR 본문
   LAYOUT: 세로 고정. HUD → 전투 → 파티 슬롯 → 탭 패널 → 하단 탭 */
/* 색은 수사 3팀과 같은 값 (--ink 는 여기서 글자색) */
:root{--bg:#12151C;--panel:#1C212B;--panel2:#232937;--line:#2E3542;--gold:#FFD23F;--gold2:#2E3542;--red:#E0503E;--ink:#F3F0E8;--dim:#A3ACBA;--ok:#5BD08A}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;margin:0;height:100%;background:#0b0d12;color:var(--ink);font:15px/1.4 'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.num{font-family:"Black Han Sans",sans-serif;letter-spacing:.01em}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(18,21,28,.96);border-bottom:1px solid var(--line)}
#stageBox{flex:1}
#stageRow{display:flex;align-items:baseline;gap:8px}
#stage{font-family:"Black Han Sans";font-size:24px;color:var(--gold);line-height:1}
#area{font-size:13px;color:var(--dim)}
#prog{position:relative;height:14px;margin-top:5px;border-radius:7px;background:#0b0d12;border:1px solid var(--line);overflow:hidden}
#prog i{position:absolute;inset:0 auto 0 0;background:var(--gold);opacity:.9;transition:width .2s}
#prog i.boss{background:var(--red)}
#prog span{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;background:#0b0d12;border:1px solid var(--line);font-family:"Black Han Sans";font-size:15px;white-space:nowrap}

/* 전투 */
#battle{position:relative;flex:0 0 auto;height:45vh;height:45dvh;min-height:260px;max-height:430px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossBtn{position:absolute;left:10px;top:10px;display:none;padding:8px 14px;border-radius:10px;border:0;background:var(--red);color:#fff;font-family:"Black Han Sans";font-size:15px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#banner{position:absolute;left:0;right:0;top:36%;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(18,21,28,.82) 20%,rgba(18,21,28,.82) 80%,transparent);text-align:center;font-family:"Black Han Sans";font-size:30px;color:#fff;color:var(--gold);text-shadow:0 2px 0 #000;opacity:0;pointer-events:none;transition:opacity .3s}

/* 파티 슬롯 */
#party{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.slot{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--panel);overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%}
.slot .cd{position:absolute;left:0;right:0;top:0;height:calc(var(--cd,0)*100%);background:rgba(5,8,25,.68);border-bottom:2px solid rgba(159,232,255,.8)}
.slot.ready .cd{border-bottom:0}
.slot.ready{border-color:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.5)}
.slot .hp{position:absolute;left:3px;right:3px;bottom:3px;height:5px;border-radius:3px;background:#300}
.slot .hp i{display:block;height:100%;border-radius:3px;background:var(--ok);width:var(--hp,100%)}
.slot.dead img{filter:grayscale(1) brightness(.5)}
.slot.empty{display:grid;place-items:center;color:var(--dim);font-size:22px;border-style:dashed}

/* 패널 */
#panel{flex:1;overflow-y:auto;padding:10px 10px 16px;background:var(--bg)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);background:rgba(18,21,28,.96);border-top:1px solid var(--line)}
#tabs button{height:54px;border:0;background:none;color:var(--dim);font:700 15px 'IBM Plex Sans KR';position:relative}
#tabs button.on{color:var(--gold)}
#tabs button.on::after{content:"";position:absolute;left:25%;right:25%;top:0;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.dot{position:absolute;top:10px;right:calc(50% - 30px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}

.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 14px 'IBM Plex Sans KR'}
.seg button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold)}

.card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.card .pt{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.card.locked .pt{filter:grayscale(1) brightness(.45)}
.nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.nm b{font-size:16px}
.role{font-size:12px;color:var(--dim)}
.gr{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.g-희귀{background:#2B4363;color:#BFD6F2}.g-영웅{background:#43315F;color:#D8C6F5}.g-전설{background:var(--gold);color:#12151C}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.stars s{color:#3a4470;text-decoration:none}
.stat{display:flex;gap:10px;font-size:13px;color:var(--dim);white-space:nowrap}
.stat em{font-style:normal;color:var(--ink);font-weight:700}
.shard{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:#B48CFF}
.st{font-size:12px;color:var(--dim);white-space:nowrap}

.btn{min-width:96px;min-height:48px;padding:4px 10px;border-radius:12px;border:0;background:var(--gold);color:#12151C;font:900 14px 'IBM Plex Sans KR';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.btn:active{transform:translateY(1px);opacity:.85}
.btn .cost i{font-style:normal}
.btn .cost{display:flex;align-items:center;gap:3px;font-family:"Black Han Sans";font-weight:400;font-size:14px}
.btn:disabled{background:var(--panel2);color:#5F6878}
.btn.sm{min-width:64px;min-height:36px;font-size:13px}
.btn.blue{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.blue:disabled{background:transparent;color:#5F6878;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:var(--bg);color:var(--dim);border:1px solid var(--line);box-shadow:none}
.hint{font-size:12px;color:var(--dim)}
h3{margin:14px 2px 8px;font:400 17px "Black Han Sans";color:var(--gold)}

.urow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.uic{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.uic svg{width:28px;height:28px}
.ut{font-weight:700}
.uv{font-size:13px;color:var(--dim)}
.uv em{font-style:normal;color:var(--ok);font-weight:700}

.sbanner{position:relative;height:170px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0d12}
.sbanner canvas{position:absolute;inset:0;width:100%;height:100%}
.sbanner .tt{position:absolute;left:14px;bottom:12px;right:14px}
.sbanner .tt b{display:block;font:400 26px "Black Han Sans";color:#fff;text-shadow:0 2px 0 #000}
.sbanner .tt span{font-size:13px;color:#ffd98a}
.sbanner.small{height:120px}
.sbanner .tag{position:absolute;left:14px;top:12px;padding:2px 8px;border-radius:6px;background:var(--red);color:#fff;font:700 12px 'IBM Plex Sans KR',sans-serif}
.sbanner .left{position:absolute;right:12px;top:12px;padding:2px 8px;border-radius:6px;background:rgba(18,21,28,.75);color:var(--ink);font-size:12px;white-space:nowrap}
.sgap{height:16px}
.rtable{width:100%;margin-top:10px;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rtable th,.rtable td{padding:6px 10px;text-align:right;white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable th{color:var(--dim);font-weight:600;border-bottom:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.srow .btn{min-height:58px;font-size:15px}
.rates{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.rates div{display:flex;justify-content:space-between;padding:2px 0}

/* 모달 */
#modal{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(8,9,12,.78)}
#modal.on{display:grid}
.mbox{width:100%;max-width:360px;padding:20px 18px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;box-shadow:0 10px 40px #000}
.mbox h2{margin:0 0 6px;font:400 22px "Black Han Sans";color:var(--gold)}
.mbox p{margin:4px 0;color:var(--dim)}
.big{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0;font:400 34px "Black Han Sans";color:#fff}
.mbtns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.mbtns .btn{flex:1}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.res.one{grid-template-columns:90px;justify-content:center}
.rc{position:relative;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:3px 3px 5px;opacity:0;transform:scale(.6);animation:pop .35s forwards}
.rc img{width:100%;aspect-ratio:1;display:block;border-radius:7px}
.rc.leg{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,63,.6)}
.rc small{display:block;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rc .new{position:absolute;top:-6px;right:-4px;padding:0 5px;border-radius:6px;background:var(--red);color:#fff;font:400 11px "Black Han Sans"}
@keyframes pop{to{opacity:1;transform:none}}

/* 시작 화면 */
/* 시작 화면: 수사 3팀 로딩 화면과 같은 구성 (부제, 큰 제목, 그림 줄, 불러오기 줄, 건너뛰기 안내) */
#splash{position:absolute;inset:0;z-index:30;background:var(--bg)}
#spbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sp-game{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 20vh) 24px 24px;gap:22px}
/* AIU 로고 */
.aiu{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.aiu-mark{width:min(64vw,236px);height:auto;display:block;overflow:visible}
.aiu .rift{animation:rift 3.2s infinite}
@keyframes rift{0%,100%{opacity:.95}46%{opacity:.95}48%{opacity:.25}50%{opacity:1}52%{opacity:.4}54%{opacity:.95}}
.aiu-stamp{position:absolute;right:-14px;top:-14px;padding:3px 7px;border:2px solid #E0503E;border-radius:4px;color:#E0503E;font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.12em;transform:rotate(12deg);opacity:.88;background:rgba(18,21,28,.6)}
.aiu-en{margin-top:4px;font:600 9px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.42em;margin-right:-.42em;color:var(--dim)}
.aiu-ko{display:flex;align-items:center;gap:10px;font:600 14px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.22em;color:var(--ink)}
.aiu-ko span{margin-right:-.22em}
.aiu-ko i{display:block;width:22px;height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){.aiu .rift{animation:none}}
.sp-sub{font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--dim)}
.sp-title{font-family:'Black Han Sans',sans-serif;font-size:60px;line-height:1;color:var(--gold);text-align:center}
.sp-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;align-items:center;gap:10px}
.sp-load{width:200px;display:flex;flex-direction:column;gap:8px;align-items:center}
.sp-bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sp-bar{position:relative}
/* 로딩 바: 매 프레임 width 를 직접 바꿔 부드럽게 차오름 (transition 없음), 끝에 작은 빛 */
.sp-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(255,210,63,.7)}
.sp-msg{font-size:12px;color:var(--dim);min-height:16px}
.sp-msg.ready{font-weight:600;letter-spacing:.32em;margin-right:-.32em;color:var(--gold)}
.sp-skip{font-size:11px;color:var(--dim);opacity:.6;margin-top:6px}
/* 불러오기가 끝나면: 접속 안내가 또렷하게 깜빡임 */
.sp-skip.ready{font-size:14px;font-weight:600;letter-spacing:.2em;margin-right:-.2em;color:var(--ink);opacity:1;animation:tapBlink 1.4s ease-in-out infinite}
@keyframes tapBlink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sp-skip.ready{animation:none}}
/* 제작사 표기: 수사 3팀 .sp-brand 와 같은 값 (bottom 12px, gap 4px, 8px 글씨, 로고 108px, margin-top -7px) */
#splash .by{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px}
#splash .by small{font-family:'IBM Plex Sans KR',sans-serif;font-size:8px;font-weight:600;letter-spacing:.32em;color:#A3ACBA}
#splash .by .sp-logo{width:min(28vw,108px);height:auto;display:block;margin-top:-7px}
#toast{position:absolute;left:50%;top:70px;z-index:40;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.85);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#bossBtn{animation:none}}
</style>
</head>
<body>
<!-- 재화 아이콘 (글자 도형 대신 항상 이 아이콘을 사용) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gG" cx="35%" cy="30%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#b9780f"/></radialGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff4ff"/><stop offset=".5" stop-color="#46b6ff"/><stop offset="1" stop-color="#2346c9"/></linearGradient>
  </defs>
  <symbol id="i-gold" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="url(#gG)" stroke="#8a5609" stroke-width="1.4"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#a96d0c" stroke-width="1.3"/><path d="M12 8.2l1.1 2.4 2.6.3-1.9 1.8.5 2.6-2.3-1.3-2.3 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="#fff4c2"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="url(#gM)" stroke="#1a2f8f" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 9h20M8 3l-2 6 6 12 6-12-2-6" fill="none" stroke="#e4fbff" stroke-width=".9" opacity=".8"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path d="M19 3l2 2-10 10-2-2z" fill="#dfe6ff" stroke="#6b78b5"/><path d="M6 14l4 4-2 1-1.5-1.5L4 20l-1-1 2.5-2.5L4 15z" fill="#f5c451" stroke="#8a5609"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e04848"/><circle cx="12" cy="12" r="6" fill="#fff"/><circle cx="12" cy="12" r="3" fill="#e04848"/></symbol>
</svg>

<div id="app">
  <div id="hud">
    <div id="stageBox">
      <div id="stageRow"><span id="stage">1-1</span><span id="area">초원 길</span></div>
      <div id="prog"><i></i><span></span></div>
    </div>
    <div class="pill"><svg class="ic"><use href="#i-gold"/></svg><span id="gold">0</span></div>
    <div class="pill"><svg class="ic"><use href="#i-gem"/></svg><span id="gems">0</span></div>
  </div>
  <div id="battle">
    <canvas id="cv"></canvas>
    <button id="bossBtn">근원체 추적</button>
    <div id="banner"></div>
  </div>
  <div id="party"></div>
  <div id="panel"></div>
  <nav id="tabs">
    <button data-tab="hero" class="on">요원<i class="dot" id="dotHero"></i></button>
    <button data-tab="train">훈련소<i class="dot" id="dotTrain"></i></button>
    <button data-tab="summon">호출</button>
  </nav>
  <div id="modal"></div>
  <div id="toast"></div>
  <div id="splash" role="img" aria-label="Loop &amp; Lamp Studio 의 AIU 이상현상 전담수사팀, 불러오는 중">
    <!-- 시작 화면 배경: 요원 다섯 명 그림(가로 폭에 맞춰 아래에 붙임) + 그 위로 내리는 비와 균열 빛 (캔버스) -->
    <canvas id="spbg" aria-hidden="true"></canvas>
    <div class="sp-game" aria-hidden="true">
      <!-- AIU 로고: 스텐실 글자 + 균열(이상현상) + 정식 명칭 + 기밀 도장. 그림은 SVG 로 직접 그림 -->
      <div class="aiu">
        <svg class="aiu-mark" viewBox="-6 -8 262 122" role="img" aria-label="AIU">
          <defs>
            <linearGradient id="aiuFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FFD23F"/><stop offset="1" stop-color="#C99A17"/></linearGradient>
            <filter id="aiuGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <clipPath id="aiuLetters"><path d="M0 100 L35 0 H65 L100 100 H74 L68 80 H32 L26 100 Z M40 58 H60 L50 27 Z M114 0 H144 V100 H114 Z M160 0 H190 V64 Q190 78 205 78 Q220 78 220 64 V0 H250 V68 Q250 101 205 101 Q160 101 160 68 Z" clip-rule="evenodd"/></clipPath>
          </defs>
          <clipPath id="aiuL"><polygon points="-6,-8 131,-8 126,14 134,33 125,52 133,70 127,90 130,114 -6,114"/></clipPath>
          <clipPath id="aiuR"><polygon points="131,-8 126,14 134,33 125,52 133,70 127,90 130,114 256,114 256,-8"/></clipPath>
          <!-- 균열 기준 왼쪽 조각은 위로, 오른쪽 조각은 아래로 살짝 어긋남 -->
          <g clip-path="url(#aiuL)"><g transform="translate(0 -1.6)"><g clip-path="url(#aiuLetters)">
            <rect x="-6" y="-8" width="262" height="122" fill="url(#aiuFill)"/>
            <rect x="-6" y="45" width="262" height="5" fill="#12151C"/>
            <rect x="-6" y="-8" width="262" height="12" fill="#FFF3C2" opacity=".45"/>
          </g></g></g>
          <g clip-path="url(#aiuR)"><g transform="translate(0 1.6)"><g clip-path="url(#aiuLetters)">

<script>
/* ============================================================
 * AIU (이상현상 전담수사팀) — 게임 핵심 규칙 (순수 함수 모음)
 * ------------------------------------------------------------
 * 화면(캔버스, DOM)과 완전히 분리된 계산 전용 모듈.
 *  - 브라우저: window.Core 로 노출
 *  - Node   : module.exports 로 노출 → 단위 테스트에서 사용
 * 여기 있는 함수는 입력이 같으면 결과도 항상 같다(난수는 rng 인자로 주입).
 * ============================================================ */
(function (root) {
  'use strict';

  /* ---------- 1. 정적 데이터 ---------- */

  // 요원 도감. name 은 수사 3팀처럼 코드네임, kind 는 종족(현재 모두 사람). baseAtk/baseHp 는 Lv.1 ★1 기준값.
  const HEROES = [
    { id: 'knight', name: '램파트', kind: '사람',  role: '돌격',   grade: '희귀', baseAtk: 12, baseHp: 160, atkSpd: 1.0, range: 'melee',
      skill: { name: '방패 돌진', cd: 6,  kind: 'single', mult: 5 } },
    { id: 'archer', name: '롱샷',   kind: '사람',  role: '저격',   grade: '희귀', baseAtk: 9,  baseHp: 90,  atkSpd: 1.5, range: 'ranged',
      skill: { name: '연속 저격', cd: 7,  kind: 'multi',  mult: 1.4, hits: 5 } },
    { id: 'mage',   name: '블레이즈', kind: '사람',  role: '폭파',   grade: '영웅', baseAtk: 15, baseHp: 80,  atkSpd: 0.7, range: 'aoe',
      skill: { name: '화염병 투척', cd: 9,  kind: 'aoe',    mult: 4 } },
    { id: 'priest', name: '헤일로', kind: '사람',  role: '의무',   grade: '영웅', baseAtk: 6,  baseHp: 100, atkSpd: 0.9, range: 'ranged',
      skill: { name: '응급 처치', cd: 10, kind: 'buff',   mult: 0.5, dur: 4, heal: 0.3 } },
    { id: 'dark',   name: '나이트폴', kind: '사람',  role: '해결사', grade: '전설', baseAtk: 32, baseHp: 260, atkSpd: 0.9, range: 'melee',
      skill: { name: '그림자 베기', cd: 8,  kind: 'aoe',    mult: 7 } },
  ];
  const STARTER_IDS = ['knight', 'archer', 'mage', 'priest'];

  // 공용 강화(훈련소) 목록
  const UPGRADES = [
    { id: 'atk',  name: '사격 훈련', baseCost: 50,  growth: 1.25, max: 999 },
    { id: 'gold', name: '현상금 협상', baseCost: 80,  growth: 1.30, max: 999 },
    { id: 'crit', name: '급소 노리기', baseCost: 120, growth: 1.35, max: 45 },
  ];

  const CONST = {
    WAVE_KILLS: 10,          // 근원체 등장까지 처치 수
    BOSS_TIME: 30,           // 근원체 제한 시간(초)
    BOSS_GEMS: 10,           // 근원체 처치 보석
    SUMMON_COST_1: 30,
    SUMMON_COST_10: 270,
    LEGEND_RATE: 0.03,       // 요원 호출: 전설(해결사) 확률
    PICKUP_LEGEND_RATE: 0.09, // 특별 채용(기간 한정): 전설 확률 3배
    MAX_STARS: 5,
    OFFLINE_CAP_SEC: 8 * 3600,
    OFFLINE_MIN_SEC: 60,
    OFFLINE_RATE: 0.5,       // 오프라인 효율 50%
    MAX_KILLS_PER_SEC: 2,    // 오프라인 계산 시 처치 속도 상한
    START_GEMS: 300,
    SAVE_VERSION: 1,
  };

  /* ---------- 2. 유틸 ---------- */

  /** 유한한 숫자인지 확인 (NaN, Infinity, 문자열 거부) */
  function isNum(v) { return typeof v === 'number' && Number.isFinite(v); }

  /** 정수로 자르고 범위 안에 고정. 잘못된 값이면 fallback */
  function clampInt(v, min, max, fallback) {
    if (!isNum(v)) return fallback;
    return Math.min(max, Math.max(min, Math.floor(v)));
  }

  /** 큰 숫자 축약: 1234 → 1.23K, 1.5e9 → 1.50B. 음수/비정상 값은 0 처리 */
  function formatNum(n) {
    if (!isNum(n) || n < 0) return '0';
    if (n < 1000) return String(Math.floor(n));
    const units = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
    let i = -1;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    const digits = n >= 100 ? 0 : n >= 10 ? 1 : 2;
    // 반올림으로 1000.0K 같은 표기가 생기지 않도록 자릿수 내림 처리
    const f = Math.floor(n * 10 ** digits) / 10 ** digits;
    return f.toFixed(digits) + units[i];
  }

  /** 초 → "3시간 12분" / "45분" / "30초" */
  function formatDuration(sec) {
    if (!isNum(sec) || sec <= 0) return '0초';
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
    if (m > 0) return `${m}분`;
    return `${s}초`;
  }

  function heroById(id) {
    const h = HEROES.find(x => x.id === id);
    if (!h) throw new Error(`알 수 없는 요원: ${id}`);
    return h;
  }

  /* ---------- 3. 스테이지 / 적 ---------- */

  /** 스테이지 번호(1부터) → "1-3" 형식 */
  function stageLabel(stage) {
    const s = clampInt(stage, 1, 1e9, 1);
    return `${Math.floor((s - 1) / 10) + 1}-${((s - 1) % 10) + 1}`;
  }
  function enemyHp(stage)   { return 20 * Math.pow(1.18, clampInt(stage, 1, 1e6, 1) - 1); }
  function enemyAtk(stage)  { return 3  * Math.pow(1.16, clampInt(stage, 1, 1e6, 1) - 1); }
  function bossHp(stage)    { return enemyHp(stage) * 12; }
  function bossAtk(stage)   { return enemyAtk(stage) * 3; }

  /** 일반 적 1마리 골드. goldLv = 현상금 협상 레벨 */
  function killGold(stage, goldLv) {
    return 3 * Math.pow(1.15, clampInt(stage, 1, 1e6, 1) - 1) * goldMult(goldLv);
  }
  function bossGold(stage, goldLv) { return killGold(stage, goldLv) * 10; }

  /* ---------- 4. 성장 공식 ---------- */

  function atkMult(atkLv)   { return 1 + 0.1 * clampInt(atkLv, 0, 1e6, 0); }
  function goldMult(goldLv) { return 1 + 0.1 * clampInt(goldLv, 0, 1e6, 0); }
  /** 치명타 확률(0~0.5). 기본 5% + 레벨당 1% */
  function critChance(critLv) { return Math.min(0.5, 0.05 + 0.01 * clampInt(critLv, 0, 1e6, 0)); }
  const CRIT_DMG = 2;

  /** 별(★) 배율: ★1=1, ★2=1.5, ★3=2 ... */
  function starMult(stars) { return 1 + 0.5 * (clampInt(stars, 1, CONST.MAX_STARS, 1) - 1); }

  /** 요원 공격력 */
  function heroAtk(id, lv, stars, atkLv) {
    const h = heroById(id);
    return h.baseAtk * Math.pow(1.09, clampInt(lv, 1, 1e6, 1) - 1) * starMult(stars) * atkMult(atkLv);
  }
  /** 요원 최대 체력 */
  function heroHp(id, lv, stars) {
    const h = heroById(id);
    return h.baseHp * Math.pow(1.08, clampInt(lv, 1, 1e6, 1) - 1) * starMult(stars);
  }
  /** 초당 기본 피해(스킬 제외, 치명타 기대값 포함) */
  function heroDps(id, lv, stars, atkLv, critLv) {
    const c = critChance(critLv);
    return heroAtk(id, lv, stars, atkLv) * heroById(id).atkSpd * (1 + c * (CRIT_DMG - 1));
  }

  /** 요원 Lv 강화 비용 (현재 lv → lv+1) */
  function heroLvCost(lv) { return Math.floor(10 * Math.pow(1.13, clampInt(lv, 1, 1e6, 1) - 1)); }

  /** lv 에서 n 단계 올리는 총 비용 */
  function heroLvCostBulk(lv, n) {
    let total = 0;
    const cnt = clampInt(n, 0, 10000, 0);
    for (let i = 0; i < cnt; i++) total += heroLvCost(lv + i);
    return total;
  }

  /** 보유 골드로 최대 몇 단계 올릴 수 있는지 (limit 단계까지만) */
  function heroLvAffordable(lv, gold, limit) {
    let n = 0, spent = 0;
    const cap = clampInt(limit, 0, 10000, 0);
    while (n < cap) {
      const c = heroLvCost(lv + n);
      if (spent + c > gold) break;
      spent += c; n++;
    }
    return { n, cost: spent };
  }

  function upgradeById(id) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u) throw new Error(`알 수 없는 강화: ${id}`);
    return u;
  }
  /** 훈련소 강화 비용. 최대 레벨이면 Infinity */
  function upgradeCost(id, lv) {
    const u = upgradeById(id);
    const l = clampInt(lv, 0, 1e6, 0);
    if (l >= u.max) return Infinity;
    return Math.floor(u.baseCost * Math.pow(u.growth, l));
  }

  /** ★ 승급에 필요한 조각 수 (현재 ★ 기준). 최대 ★이면 Infinity */
  function starNeed(stars) {
    const s = clampInt(stars, 1, CONST.MAX_STARS, 1);
    return s >= CONST.MAX_STARS ? Infinity : s * 2;
  }

  /* ---------- 5. 파티 / 오프라인 ---------- */

  /** 보유 요원 전체 DPS 합 */
  function partyDps(state) {
    let sum = 0;
    for (const id of Object.keys(state.heroes)) {
      const h = state.heroes[id];
      if (!h || !h.owned) continue;
      sum += heroDps(id, h.lv, h.stars, state.up.atk, state.up.crit);
    }
    return sum;
  }

  /**
   * 오프라인 보상 계산.
   * - 1분 미만, 음수(기기 시간 되돌림)는 보상 없음
   * - 최대 8시간까지만 인정
   * - 처치 속도는 (파티 DPS / 적 체력), 상한 2마리/초, 효율 50%
   */
  function offlineReward(state, elapsedSec) {
    if (!isNum(elapsedSec) || elapsedSec < CONST.OFFLINE_MIN_SEC) return { sec: 0, gold: 0, kills: 0 };
    const sec = Math.min(elapsedSec, CONST.OFFLINE_CAP_SEC);
    const hp = enemyHp(state.stage);
    const rate = Math.min(CONST.MAX_KILLS_PER_SEC, partyDps(state) / hp);
    const kills = Math.floor(rate * sec * CONST.OFFLINE_RATE);
    const gold = Math.floor(kills * killGold(state.stage, state.up.gold));
    return { sec, gold, kills };
  }

  /* ---------- 6. 소환 ---------- */

  /**
   * 소환 n회. rng() 는 [0,1) 난수 함수 (테스트에서 고정값 주입).
   * 전설은 legendRate(기본 LEGEND_RATE, 특별 채용은 PICKUP_LEGEND_RATE), 나머지는 시작 요원 4명 균등.
   * @returns {string[]} 뽑힌 요원 id 배열
   */
  function summon(n, rng, legendRate) {
    if (typeof rng !== 'function') throw new TypeError('rng 함수가 필요합니다');
    const lr = legendRate === undefined ? CONST.LEGEND_RATE : legendRate;
    if (!isNum(lr) || lr <= 0 || lr >= 1) throw new RangeError('전설 확률은 0 초과 1 미만이어야 합니다');
    const cnt = clampInt(n, 1, 100, 1);
    const out = [];
    for (let i = 0; i < cnt; i++) {
      const r = rng();
      if (!isNum(r) || r < 0 || r >= 1) throw new RangeError('rng 값은 0 이상 1 미만이어야 합니다');
      if (r < lr) { out.push('dark'); continue; }
      // 남은 구간을 4등분
      const t = (r - lr) / (1 - lr);
      out.push(STARTER_IDS[Math.min(STARTER_IDS.length - 1, Math.floor(t * STARTER_IDS.length))]);
    }
    return out;
  }

  /**
   * 소환 결과를 상태에 반영 (새 상태 반환, 원본 불변).
   * 미보유 요원은 보유로 바꾸고, 보유 요원은 조각 +1.
   */
  function applySummon(state, ids) {
    const next = cloneState(state);
    const isNew = [];
    for (const id of ids) {
      heroById(id); // 잘못된 id 방어
      const h = next.heroes[id];
      if (!h.owned) { h.owned = true; isNew.push(true); }
      else { h.shards += 1; isNew.push(false); }
    }
    return { state: next, isNew };
  }

  /**
   * 특별 채용 남은 시간(초): 매주 월요일 0시(기기 시간)에 새 기간이 시작된다.
   * @param {Date} now 현재 시각
   */
  function pickupRemainSec(now) {
    if (!(now instanceof Date) || !isNum(now.getTime())) return 0;
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate());   // 오늘 0시
    const daysToMon = ((8 - next.getDay()) % 7) || 7;                         // 다음 월요일까지 일수 (월요일이면 7)
    next.setDate(next.getDate() + daysToMon);
    return Math.max(0, Math.floor((next - now) / 1000));
  }
  /** 초 → "6일 23시간" / "5시간 12분" */
  function formatRemain(sec) {
    if (!isNum(sec) || sec <= 0) return '0분';
    const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
    if (d > 0) return `${d}일 ${h}시간`;
    if (h > 0) return `${h}시간 ${m}분`;
    return `${Math.max(1, m)}분`;
  }

  /* ---------- 7. 상태 생성 / 저장 검증 ---------- */

  function newState(now) {
    const heroes = {};
    for (const h of HEROES) {
      heroes[h.id] = { owned: STARTER_IDS.includes(h.id), lv: 1, stars: 1, shards: 0 };
    }
    return {
      v: CONST.SAVE_VERSION,
      gold: 0,
      gems: CONST.START_GEMS,
      stage: 1,
      kills: 0,
      farming: false,     // 근원체에게 진 뒤 반복 사냥 모드
      heroes,
      up: { atk: 0, gold: 0, crit: 0 },
      lastSeen: isNum(now) ? now : 0,
    };
  }

  function cloneState(s) { return JSON.parse(JSON.stringify(s)); }

  /**
   * 저장 데이터 검증/복구. 손상되거나 조작된 값은 기본값으로 되돌린다.
   * 어떤 입력이 와도 예외 없이 유효한 상태를 돌려준다.
   */
  function sanitize(raw, now) {
    const base = newState(now);
    if (!raw || typeof raw !== 'object') return base;
    const s = base;
    s.gold   = isNum(raw.gold) && raw.gold >= 0 ? raw.gold : 0;
    s.gems   = isNum(raw.gems) && raw.gems >= 0 ? Math.floor(raw.gems) : base.gems;
    s.stage  = clampInt(raw.stage, 1, 1e6, 1);
    s.kills  = clampInt(raw.kills, 0, CONST.WAVE_KILLS, 0);
    s.farming = raw.farming === true;
    s.lastSeen = isNum(raw.lastSeen) && raw.lastSeen > 0 ? raw.lastSeen : base.lastSeen;
    if (raw.up && typeof raw.up === 'object') {
      for (const u of UPGRADES) s.up[u.id] = clampInt(raw.up[u.id], 0, u.max, 0);
    }
    if (raw.heroes && typeof raw.heroes === 'object') {
      for (const h of HEROES) {
        const r = raw.heroes[h.id];
        if (!r || typeof r !== 'object') continue;
        s.heroes[h.id] = {
          // 시작 요원은 항상 보유
          owned: STARTER_IDS.includes(h.id) ? true : r.owned === true,
          lv: clampInt(r.lv, 1, 1e6, 1),
          stars: clampInt(r.stars, 1, CONST.MAX_STARS, 1),
          shards: clampInt(r.shards, 0, 1e6, 0),
        };
      }
    }
    return s;
  }

  /** 저장 문자열 파싱. JSON 오류면 새 상태 */
  function loadFromString(str, now) {
    if (typeof str !== 'string' || !str) return { state: newState(now), ok: false };
    try { return { state: sanitize(JSON.parse(str), now), ok: true }; }
    catch (e) { return { state: newState(now), ok: false }; }
  }

  const Core = {
    HEROES, STARTER_IDS, UPGRADES, CONST, CRIT_DMG,
    isNum, clampInt, formatNum, formatDuration, heroById, upgradeById,
    stageLabel, enemyHp, enemyAtk, bossHp, bossAtk, killGold, bossGold,
    atkMult, goldMult, critChance, starMult, heroAtk, heroHp, heroDps,
    heroLvCost, heroLvCostBulk, heroLvAffordable, upgradeCost, starNeed,
    partyDps, offlineReward, summon, applySummon, pickupRemainSec, formatRemain,
    newState, cloneState, sanitize, loadFromString,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Core;
  else root.Core = Core;
})(typeof window !== 'undefined' ? window : globalThis);

const IMG = {};
for (const [k, src] of Object.entries(ART)) { const im = new Image(); im.decoding = 'async'; im.src = src; IMG[k] = im; }
const imgOk = k => { const im = IMG[k]; return !!(im && im.complete && im.naturalWidth > 0); };
/* 어두운 바닥에서도 보이도록 전신 그림 둘레에 얇은 빛 테두리를 붙인 판을 한 번만 만들어 둠
 * (매 프레임 테두리를 그리면 느려서 미리 구움). 요원은 밝은 빛, 이상체와 근원체는 보랏빛 */
const RIM = {};
function makeRim(k) {
  const im = IMG[k], pad = 7, w = im.naturalWidth, h = im.naturalHeight;
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const q = c.getContext('2d'); if (!q) return;
  for (let a = 0; a < 16; a++) q.drawImage(im, pad + Math.cos(a * Math.PI / 8) * pad * 0.7, pad + Math.sin(a * Math.PI / 8) * pad * 0.7);
  q.globalCompositeOperation = 'source-in';
  const hero = /^spr_(knight|archer|mage|priest|dark)$/.test(k);
  q.fillStyle = hero ? 'rgba(215,224,255,.55)' : 'rgba(176,120,255,.8)'; q.fillRect(0, 0, c.width, c.height);
  q.globalCompositeOperation = 'source-over'; q.drawImage(im, pad, pad);
  RIM[k] = { c, pad };
}
/** 모든 그림이 준비될 때까지 기다림 (실패한 그림은 건너뜀, 최대 4초) */
const artReady = Promise.race([
  Promise.all(Object.entries(IMG).map(([k, im]) => (im.decode ? im.decode() : Promise.resolve()).then(() => { if (k.startsWith('spr_')) makeRim(k); }).catch(() => {}))),
  new Promise(r => setTimeout(r, 4000)),
]);

/* ---------- 요원 외형 (그림을 못 불러왔을 때 쓰는 임시 모습: 사람 얼굴 + 역할 장비) ----------
 * 그림 주문서의 외모와 같게: 머리 색과 모양, 피부, 옷 색 */
const LOOK = {
  knight: { coat: '#2f3a52', trim: '#5d6b86', hair: '#2a2620', hairStyle: 'buzz',  skin: '#d9b896' },   // 램파트: 짧은 머리, 진압 조끼
  archer: { coat: '#2f4436', trim: '#55705c', hair: '#b9bcc6', hairStyle: 'bob',   skin: '#ecd3bd' },   // 롱샷: 은회색 단발, 초록 후드
  mage:   { coat: '#4a2c2a', trim: '#8a5a3a', hair: '#c4472f', hairStyle: 'messy', skin: '#e3c2a4' },   // 블레이즈: 붉은 머리, 가죽 재킷
  priest: { coat: '#d4d5da', trim: '#9a3a42', hair: '#1c1a22', hairStyle: 'tail',  skin: '#efd6c2' },   // 헤일로: 검은 묶음 머리, 흰 비옷
  dark:   { coat: '#18171d', trim: '#6b4fa0', hair: '#121116', hairStyle: 'fringe', skin: '#d8bea6' },  // 나이트폴: 한쪽 눈 가린 앞머리, 검은 정장
};
function rr(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + p));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/** 사람 머리 (오른쪽을 보는 옆얼굴 기준, hy = 머리 중심 높이) */
function drawHumanHead(g, id, hy, s) {
  const L = LOOK[id], r = s * 0.17;
  // 목과 얼굴
  g.fillStyle = shade(L.skin, -25); g.fillRect(-s * 0.04, hy + r * 0.6, s * 0.08, s * 0.08);
  g.fillStyle = L.skin; g.beginPath(); g.ellipse(s * 0.01, hy, r * 0.92, r, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(s * 0.12, hy - s * 0.02); g.lineTo(s * 0.19, hy + s * 0.04); g.lineTo(s * 0.12, hy + s * 0.07); g.fill();   // 코
  // 머리카락
  g.fillStyle = L.hair;
  if (L.hairStyle === 'buzz') { g.beginPath(); g.arc(0, hy - s * 0.01, r * 1.0, Math.PI * 1.02, Math.PI * 1.98); g.fill(); }
  else if (L.hairStyle === 'bob') { g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.08, Math.PI * 0.85, Math.PI * 2.02); g.lineTo(s * 0.06, hy - s * 0.04); g.lineTo(-s * 0.16, hy + s * 0.13); g.closePath(); g.fill(); }
  else if (L.hairStyle === 'messy') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.05, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    for (const [x, y] of [[-0.12, -0.17], [-0.02, -0.21], [0.08, -0.18], [0.15, -0.1]]) { g.beginPath(); g.moveTo(x * s, hy + y * s + s * 0.06); g.lineTo(x * s + s * 0.05, hy + y * s); g.lineTo(x * s + s * 0.07, hy + y * s + s * 0.07); g.fill(); }
  } else if (L.hairStyle === 'tail') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.04, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    g.beginPath(); g.ellipse(-s * 0.17, hy + s * 0.04, s * 0.05, s * 0.13, 0.35, 0, 7); g.fill();   // 묶은 머리
  } else { // fringe: 한쪽 눈을 가린 앞머리
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.06, Math.PI * 0.9, Math.PI * 2.0); g.fill();
    g.beginPath(); g.moveTo(s * 0.02, hy - s * 0.16); g.quadraticCurveTo(s * 0.2, hy - s * 0.1, s * 0.15, hy + s * 0.06); g.lineTo(s * 0.06, hy - s * 0.02); g.closePath(); g.fill();
  }
  // 눈 (나이트폴은 빛나는 호박색)
  g.fillStyle = id === 'dark' ? '#ffb31a' : '#1b1b22';
  g.fillRect(s * 0.08, hy - s * 0.015, s * 0.035, s * 0.03);
  if (id === 'knight') { g.strokeStyle = 'rgba(120,60,60,.8)'; g.lineWidth = s * 0.012; g.beginPath(); g.moveTo(s * 0.07, hy + s * 0.08); g.lineTo(s * 0.12, hy + s * 0.12); g.stroke(); }   // 턱 흉터
  // 차가운 테두리 빛 (누아르 림 라이트): 필터 없이 선 하나
  g.strokeStyle = 'rgba(170,195,255,.45)'; g.lineWidth = s * 0.018; g.lineCap = 'round';
  g.beginPath(); g.arc(0, hy, r * 1.05, Math.PI * 1.0, Math.PI * 1.55); g.stroke();
}

/** 전신 그림 한 장 그리기. h = 화면 높이(지도 단위), 발이 (x, y)
 * 숨 쉬듯 살짝 늘었다 줄고, 공격(swing)하면 보는 쪽으로 몸을 기울이며, 맞으면(hurt) 좌우로 떨림.
 * face: 1 이면 그림 그대로, -1 이면 좌우를 뒤집음. sh = 그림자 반지름 */
function drawSprite(g, im, x, y, h, t, swing, hurt, face, sh, rim) {
  const w = h * im.naturalWidth / im.naturalHeight;
  g.save(); g.translate(x, y);
  if (hurt > 0) g.translate(Math.sin(hurt * 40) * hurt * 3, 0);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 0, sh, sh * 0.24, 0, 0, 7); g.fill();
  if (face < 0) g.scale(-1, 1);
  g.rotate(swing * 0.14);                                   // 공격: 앞으로 기울임
  g.scale(1, 1 + Math.sin(t * 3 + x * 0.05) * 0.012);         // 숨쉬기
  drawRimmed(g, im, rim, -w / 2 + swing * h * 0.05, -h, w, h);
  g.restore();
}

/** 그림을 (x, y, w, h) 칸에 그림. 빛 테두리 판(rim)이 있으면 테두리까지 같은 비율로 */
function drawRimmed(g, im, rim, x, y, w, h) {
  if (!rim) { g.drawImage(im, x, y, w, h); return; }
  const k = w / im.naturalWidth;
  g.drawImage(rim.c, x - rim.pad * k, y - rim.pad * k, rim.c.width * k, rim.c.height * k);
}

/** 요원 그리기. s = 키 기준 크기, swing = 공격 동작(0~1), face: 1 오른쪽 / -1 왼쪽 */

/* ---------- 이상체 그리기 (기본 그림은 왼쪽을 봄) ----------
 * shade: 검은 연기로 된 얼굴 없는 사람 형체, 몸에 보랏빛 금
 * crawler: 관절이 너무 많은 네발 검은 타르 덩어리
 * 근원체: 지역마다 다른 큰 이상체 (우산 쓴 남자, 안개 등대지기, 네온 마네킹) */
function drawEnemy(g, e, t) {
  const s = e.size, chap = Math.floor((S.stage - 1) / 10) % 3;

  if (imgOk(key)) {
    // 그림은 왼쪽을 봄 → 위에서 이미 face 로 뒤집었으므로 여기서는 그대로. 걸을 때 살짝 흔들림, 공격하면 앞으로 기울임
    const im = IMG[key], crawl = !e.boss && e.type === 'crawler';
    const h = crawl ? s * 1.1 * im.naturalHeight / im.naturalWidth : s * (e.boss ? 1.12 : 1.05);
    const w = h * im.naturalWidth / im.naturalHeight;
    g.rotate((e.walk ? Math.sin(t * 9 + e.ph) * 0.05 : wob * 0.015) - e.swing * 0.16);
    drawRimmed(g, im, RIM[key], -w / 2 - e.swing * s * 0.06, -h + (crawl ? s * 0.04 : 0), w, h);
  } else if (!e.boss && e.type === 'crawler') {

    }

    g.fillStyle = 'rgba(180,140,255,.9)'; g.fillRect(-s * 0.28, -s * 0.34, s * 0.05, s * 0.03); g.fillRect(-s * 0.2, -s * 0.35, s * 0.04, s * 0.03);

    g.fillStyle = body;
    g.beginPath(); g.moveTo(-s * 0.17, -s * 0.62); g.lineTo(s * 0.17, -s * 0.62); g.lineTo(s * 0.22 + wob * s * 0.02, 0); g.lineTo(-s * 0.22 - wob * s * 0.02, 0); g.closePath(); g.fill();
    // 아랫단이 연기처럼 흩어짐
    g.fillStyle = 'rgba(24,22,30,.6)'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc((-0.15 + i * 0.1) * s, -s * 0.02 + Math.sin(t * 5 + i + e.ph) * s * 0.02, s * 0.06, 0, 7); g.fill(); }
    g.fillStyle = body; g.beginPath(); g.ellipse(0, -s * 0.76, s * 0.15, s * 0.17, 0, 0, 7); g.fill();
    // 몸의 보랏빛 금
    g.strokeStyle = `rgba(180,140,255,${0.55 + wob * 0.2})`; g.lineWidth = s * 0.02; g.beginPath(); g.moveTo(-s * 0.04, -s * 0.9); g.lineTo(s * 0.03, -s * 0.72); g.lineTo(-s * 0.03, -s * 0.55); g.lineTo(s * 0.05, -s * 0.35); g.stroke();
    if (e.boss && chap === 0) { // 우산 쓴 남자: 검은 우산, 얼굴은 그늘

    } else if (e.boss && chap === 1) { // 안개 등대지기: 머리 대신 빛나는 등불
      const lg = g.createRadialGradient(0, -s * 0.78, 0, 0, -s * 0.78, s * 0.3); lg.addColorStop(0, 'rgba(255,240,200,.95)'); lg.addColorStop(1, 'rgba(255,220,150,0)');
      g.fillStyle = lg; g.beginPath(); g.arc(0, -s * 0.78, s * 0.3, 0, 7); g.fill();
    } else if (e.boss && chap === 2) { // 네온 마네킹: 금 대신 분홍, 파랑 네온관
      g.strokeStyle = 'rgba(255,70,170,.9)'; g.lineWidth = s * 0.02; g.beginPath(); g.moveTo(-s * 0.12, -s * 0.6); g.lineTo(s * 0.1, -s * 0.3); g.stroke();
      g.strokeStyle = 'rgba(70,210,255,.9)'; g.beginPath(); g.moveTo(s * 0.12, -s * 0.58); g.lineTo(-s * 0.08, -s * 0.2); g.stroke();
    }
    // 눈: 얼굴 없이 빛나는 점 하나
    if (!(e.boss && chap === 1)) { g.fillStyle = e.boss ? '#ff5d5d' : 'rgba(190,160,255,.95)'; g.fillRect(-s * 0.08, -s * 0.79, s * 0.05, s * 0.03); }
    // 팔: 공격할 때 길게 뻗음
    g.strokeStyle = body; g.lineWidth = s * 0.06; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-s * 0.12, -s * 0.52); g.lineTo(-s * 0.2 - e.swing * s * 0.25, -s * 0.36 - e.swing * s * 0.1); g.stroke();
  }
  g.restore();
  if (!e.boss && e.hp < e.max) {
    const w = s * 0.6, by = e.y - s * (e.type === 'crawler' ? 1.05 : 1.15);
    g.fillStyle = '#300'; g.fillRect(e.x - w / 2, by, w, 4);
    g.fillStyle = '#ff5a4a'; g.fillRect(e.x - w / 2, by, w * Math.max(0, e.hp / e.max), 4);
  }
}

/* ---------- 지도 (위에서 내려다본 끝없는 들판) ----------
 * 좌표는 "지도 단위". 화면에는 u 배율(화면 높이 / 320)로 그린다.
 * 지도는 360단위 조각(청크)으로 나눠, 조각 좌표로 정해지는 난수로 장식을 만든다.
 * → 같은 자리는 언제 봐도 같은 모습이고, 지도는 끝없이 이어진다.
 */
const CH = 360;
const MAPW = 1000, MAPH = 1300, MAX_FIELD = 14;   // 지도 크기(단위), 지도 위 일반 이상체 최대 수
const FIELD = [
  // 1장 빗속 뒷골목: 젖은 돌바닥, 가로등, 상자와 드럼통, 쓰레기통, 세워 둔 차
  { ground: '#252c39', patch: '#2b3342', dark: '#1f252f', tree: '#1c242d', tree2: '#283340', rock: '#4a5365', kinds: ['lamp', 'lamp', 'crate', 'barrel', 'bin', 'car'], night: 0.08, fog: 0, cobble: 1, neon: 0, planks: 0 },
  // 2장 안개 항구: 나무 부두 바닥, 화물 상자, 계류 기둥, 낮게 깔린 안개
  { ground: '#2a2a2e', patch: '#302f34', dark: '#232227', tree: '#24232a', tree2: '#302f37', rock: '#57505f', kinds: ['crate', 'crate', 'barrel', 'lamp', 'bollard'], night: 0.1, fog: 1, cobble: 0, neon: 0, planks: 1 },
  // 3장 네온 유흥가: 젖은 아스팔트에 분홍, 파랑 네온 빛
  { ground: '#1d1f2b', patch: '#24263a', dark: '#18192a', tree: '#1b2533', tree2: '#273446', rock: '#4c5771', kinds: ['lamp', 'lamp', 'bin', 'car', 'crate'], night: 0.14, fog: 0, cobble: 0.35, neon: 1, planks: 0 },
];
/** 가로등 빛 색: 네온 유흥가는 분홍, 파랑 번갈아 */
const lampCol = (F, d) => F.neon ? ((Math.floor(d.x / 7) & 1) ? [255, 70, 170] : [70, 210, 255]) : [255, 190, 90];
const field = () => FIELD[Math.floor((S.stage - 1) / 10) % FIELD.length];

/** 시드 난수 (mulberry32) */
function seeded(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const chunkCache = new Map();
function chunk(cx, cy) {
  const chap = Math.floor((S.stage - 1) / 10) % FIELD.length, key = S.stage + ':' + cx + ',' + cy;
  let c = chunkCache.get(key);
  if (c) return c;
  if (chunkCache.size > 300) chunkCache.clear();   // 메모리 보호
  const r = seeded((cx * 73856093) ^ (cy * 19349663) ^ (S.stage * 83492791)), F = FIELD[chap];
  const ox = cx * CH, oy = cy * CH, flat = [], tall = [];
  // 바닥 얼룩: 항상 납작한 타원 두세 개를 겹친 자연스러운 모양 (동그란 원반처럼 보이지 않게)
  for (let i = 0; i < 5; i++) {
    const x = ox + r() * CH, y = oy + r() * CH, rx = 40 + r() * 50, c = r() < 0.6 ? F.patch : F.dark;
    for (let j = 0; j < 3; j++) flat.push({ k: 'patch', x: x + (r() - 0.5) * rx, y: y + (r() - 0.5) * rx * 0.3, rx: rx * (0.5 + r() * 0.4), ry: rx * (0.22 + r() * 0.12), c });
  }
  for (let i = 0; i < 12; i++) flat.push({ k: r() < 0.6 ? 'tuft' : 'flower', x: ox + r() * CH, y: oy + r() * CH, h: r() });
  // 돌바닥 조각: 마을과 성채는 많이, 협곡은 드문드문
  const nst = Math.round(60 * F.cobble);
  for (let i = 0; i < nst; i++) flat.push({ k: 'stone', x: ox + r() * CH, y: oy + r() * CH, h: r() });
  for (let i = 0; i < 3; i++) flat.push({ k: 'puddle', x: ox + r() * CH, y: oy + r() * CH, rx: 16 + r() * 26, h: r() });
  const n = 2 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) tall.push({ k: F.kinds[Math.floor(r() * F.kinds.length)], x: ox + r() * CH, y: oy + r() * CH, s: 0.8 + r() * 0.5 });
  c = { flat, tall }; chunkCache.set(key, c);
  return c;
}

/* ---------- 전투 상태 (저장 안 함) ---------- */
const R = { enemies: [], proj: [], fx: [], texts: [], heroes: {}, t: 0, buff: 0, wipe: 0, boss: null, bossT: 0,
  cam: { x: 0, y: MAPH / 2 - 220 }, A: { x: 0, y: MAPH / 2 - 220 }, heading: -1.57, spawnT: 0, roam: null, mapStage: 0 };
const cv = $('cv'), g = cv.getContext('2d');
if (!g) toast('이 기기에서는 전투 화면을 그릴 수 없어요');
let W = 360, H = 300, DPR = 1, u = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height); u = H / 320;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
const cvRO = new ResizeObserver(resize); cvRO.observe(cv);

/* ---------- 스테이지 지도: 경계가 있는 넓은 들판 (화면 약 3×4개) ----------
 * 이상체 무리가 지도 곳곳에 흩어져 생기고, 요원 팀은 가장 가까운 무리를 찾아 어디로든 돌아다닌다. */
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

function randPoint(pad) { return { x: (Math.random() - 0.5) * (MAPW - pad * 2), y: (Math.random() - 0.5) * (MAPH - pad * 2) }; }
/** 새 스테이지 지도: 요원 팀은 아래쪽 입구에서 시작, 무리 몇 개를 미리 흩어 둠 */
function newMap() {
  R.mapStage = S.stage; R.enemies = []; R.proj = []; R.boss = null; R.roam = null; R.spawnT = 0;
  R.A = { x: 0, y: MAPH / 2 - 220 }; R.cam = { x: 0, y: MAPH / 2 - 260 }; R.heading = -Math.PI / 2;
  for (const h of owned()) if (R.heroes[h.id]) Object.assign(R.heroes[h.id], formSlot(h.id));
  for (let i = 0; i < 4; i++) spawnCluster();
}
const owned = () => C.HEROES.filter(h => S.heroes[h.id].owned);
const HERO_SIZE = 50;
// 진형: [앞(이동 방향), 옆] 오프셋. 근접은 앞, 원거리는 뒤
const FORM = { knight: [30, -16], dark: [32, 18], archer: [-20, -30], mage: [-40, 4], priest: [-18, 32] };
function formSlot(id) {
  const [f, s] = FORM[id], c = Math.cos(R.heading), n = Math.sin(R.heading);
  return { x: R.A.x + c * f - n * s, y: R.A.y + n * f + c * s };
}
/** 요원 전투 상태를 보유 요원과 맞춤 (새로 얻은 요원 추가, 능력치 갱신) */
function syncHeroes(full) {
  for (const h of owned()) {
    const d = S.heroes[h.id], max = C.heroHp(h.id, d.lv, d.stars);
    const r = R.heroes[h.id];
    if (!r) { const p = formSlot(h.id); R.heroes[h.id] = { hp: max, max, cd: h.skill.cd * 0.5, at: Math.random(), swing: 0, hurt: 0, x: p.x, y: p.y, face: 1 }; }
    else { const ratio = r.max > 0 ? r.hp / r.max : 1; r.max = max; r.hp = full ? max : Math.min(max, max * ratio); }
  }
}
const alive = () => owned().filter(h => R.heroes[h.id] && R.heroes[h.id].hp > 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function mkEnemy(type, x, y, boss) {
  const hp = boss ? C.bossHp(S.stage) : C.enemyHp(S.stage);
  return { type, boss, x, y, hp, max: hp, atk: boss ? C.bossAtk(S.stage) : C.enemyAtk(S.stage), at: Math.random(),
    size: boss ? 110 : type === 'crawler' ? 44 : 48, hit: 0, swing: 0, ph: Math.random() * 6, face: -1, aggro: false };
}
/** 지도 어딘가(요원 팀과 떨어진 곳)에 이상체 무리 하나를 배치 */
function spawnCluster() {
  let p = randPoint(90);
  for (let k = 0; k < 12 && dist(p, R.A) < 260; k++) p = randPoint(90);
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, rr = 15 + Math.random() * 55, e = mkEnemy(Math.random() < 0.5 ? 'shade' : 'crawler', p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr * 0.8, false);
    e.home = { x: e.x, y: e.y }; e.wt = Math.random() * 2; keepIn(e, 40); R.enemies.push(e);
  }
}
/** 근원체: 요원 팀에서 조금 떨어진 지도 안 어딘가에 등장 */
function spawnBoss() {
  const a = Math.random() * Math.PI * 2, p = { x: R.A.x + Math.cos(a) * 280, y: R.A.y + Math.sin(a) * 280 };
  keepIn(p, 120);
  R.boss = mkEnemy('boss', p.x, p.y, true); R.boss.home = { ...p }; R.boss.wt = 0;
  R.enemies.push(R.boss); R.bossT = C.CONST.BOSS_TIME;
  banner(theme().boss + ' 출현');
}

function addText(x, y, txt, col, big) { if (R.texts.length < 60) R.texts.push({ x, y, txt, col, big, life: 0.9 }); }
function addFx(o) { if (R.fx.length < 140) R.fx.push(o); }

/** 피해 적용 (치명타 판정 포함). 처치 시 보상 */
function damage(e, base) {
  if (!e || e.hp <= 0) return;
  const crit = Math.random() < C.critChance(S.up.crit);
  const dmg = base * (R.buff > 0 ? 1.5 : 1) * (crit ? C.CRIT_DMG : 1);
  e.hp -= dmg; e.hit = 0.12; e.aggro = true;
  addText(e.x + (Math.random() - 0.5) * e.size * 0.7, e.y - e.size * (0.75 + Math.random() * 0.35), C.formatNum(dmg), crit ? '#ffd23a' : '#fff', crit);
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  if (e.boss) {
    const gold = C.bossGold(S.stage, S.up.gold);
    S.gold += gold; S.gems += C.CONST.BOSS_GEMS;
    banner('봉쇄 완료');
    S.stage++; S.kills = 0; R.boss = null; S.farming = false;
    addText(e.x, e.y - e.size, '+' + C.formatNum(gold), '#ffd23a', true);
    writeSave(); renderPanel();
  } else {
    S.gold += C.killGold(S.stage, S.up.gold);
    if (!S.farming && S.kills < C.CONST.WAVE_KILLS) S.kills++;
  }
  for (let i = 0; i < (e.boss ? 14 : 4); i++) addFx({ k: 'coin', x: e.x, y: e.y - e.size * 0.4, vx: (Math.random() - 0.5) * 120, vy: -110 - Math.random() * 100, floor: e.y, life: 0.9 });
}
function bossFail(reason) {
  if (!R.boss) return;
  R.enemies = R.enemies.filter(en => en !== R.boss); R.boss = null;
  S.farming = true; S.kills = 0;
  banner(reason); writeSave();
}

/* ---------- 요원 행동 ---------- */
const RANGE = { melee: 34, ranged: 150, aoe: 140 };
const ENGAGE = 210;   // 이 거리 안의 적에게 달려듦
function nearestEnemy(p, within) {
  let best = null, bd = within;
  for (const e of R.enemies) if (e.hp > 0) { const d = dist(p, e); if (d < bd) { bd = d; best = e; } }
  return best;
}
function moveTo(o, tx, ty, sp, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 1) return 0;
  const step = Math.min(d, sp * dt);
  o.x += dx / d * step; o.y += dy / d * step;
  if (Math.abs(dx) > 2) o.face = dx > 0 ? 1 : -1;
  return d;
}
function heroAct(h, r, dt) {
  const d = S.heroes[h.id], atk = C.heroAtk(h.id, d.lv, d.stars, S.up.atk), s = HERO_SIZE;
  r.swing = Math.max(0, r.swing - dt * 4); r.hurt = Math.max(0, r.hurt - dt * 3);
  r.walk = false;
  // 내 근처 적, 없으면 파티가 싸우는 중일 때 파티 기준점에서 가까운 적 (한 명만 앞서 나가 혼자 싸우지 않게)
  const tgt = nearestEnemy(r, ENGAGE) || (R.fighting ? nearestEnemy(R.A, 380) : null);
  if (!tgt) { // 싸울 적이 없으면 진형 자리로 이동
    const p = formSlot(h.id);
    r.walk = moveTo(r, p.x, p.y, 105, dt) > 3;
    return;
  }
  const range = RANGE[h.range] + (h.range === 'melee' ? tgt.size * 0.25 : 0), dd = dist(r, tgt);
  if (dd > range) { moveTo(r, tgt.x, tgt.y, 90, dt); r.walk = true; return; }
  r.face = tgt.x >= r.x ? 1 : -1;
  // 스킬 (쿨타임마다 자동 사용)
  r.cd -= dt;
  if (r.cd <= 0) { r.cd = h.skill.cd; castSkill(h, atk, r, s, tgt); r.swing = 1; return; }
  // 일반 공격
  r.at += dt * h.atkSpd;
  if (r.at < 1) return;
  r.at = 0; r.swing = 1;
  if (h.range === 'melee') { damage(tgt, atk); addFx({ k: 'slash', x: tgt.x, y: tgt.y - tgt.size * 0.5, r: tgt.size * 0.5, face: r.face, life: 0.2, col: h.id === 'dark' ? '#c27bff' : '#fff' }); }
  else R.proj.push({ k: h.id, x: r.x + r.face * s * 0.2, y: r.y - s * 0.5, tgt, dmg: atk, sp: h.id === 'archer' ? 520 : 340, aoe: h.range === 'aoe' });
}
function castSkill(h, atk, r, s, tgt) {
  const sk = h.skill;
  addText(r.x, r.y - s * 1.45, sk.name, '#9fe8ff', false);
  if (sk.kind === 'single') { damage(tgt, atk * sk.mult); addFx({ k: 'burst', x: tgt.x, y: tgt.y - tgt.size * 0.4, r: tgt.size * 0.9, life: 0.35, col: '#9fd0ff' }); }
  else if (sk.kind === 'multi') {
    for (let i = 0; i < sk.hits; i++) setTimeout(() => {
      const live = R.enemies.filter(e => e.hp > 0 && dist(e, r) < ENGAGE * 1.3); if (!live.length) return;
      R.proj.push({ k: 'archer', x: r.x, y: r.y - s * 0.5, tgt: live[Math.floor(Math.random() * live.length)], dmg: atk * sk.mult, sp: 640, gold: true });
    }, i * 90);
  } else if (sk.kind === 'aoe') {
    // 시전자 주변 넓은 범위
    for (const e of R.enemies.slice()) if (e.hp > 0 && dist(e, tgt) < 130) { damage(e, atk * sk.mult); addFx({ k: 'burst', x: e.x, y: e.y - e.size * 0.4, r: e.size * 0.8, life: 0.45, col: h.id === 'dark' ? '#b066ff' : '#ff8a2e' }); }
    addFx({ k: 'ring', x: tgt.x, y: tgt.y, r: 130, life: 0.45, col: h.id === 'dark' ? '#b066ff' : '#ff8a2e' });
  } else if (sk.kind === 'buff') {
    R.buff = sk.dur;
    for (const a of alive()) { const hr = R.heroes[a.id], heal = hr.max * sk.heal; hr.hp = Math.min(hr.max, hr.hp + heal); addText(hr.x + s * 0.3, hr.y - s * 0.6, '+' + C.formatNum(heal), '#6dff9a', false); }
    addFx({ k: 'ring', x: r.x, y: r.y, r: 120, life: 0.6, col: '#ffe98a' });
  }
}

/* ---------- 메인 루프 ---------- */
let last = performance.now(), uiT = 0, saveT = 0, paused = true;
const modalEl = $('modal');
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {
    // 시작 화면이나 팝업이 떠 있는 동안은 전투를 멈춤 (보스 제한 시간 보호)
    if (!paused && !modalEl.classList.contains('on')) update(dt);
    if (g) draw();
    uiT += dt; if (uiT > 0.15) { uiT = 0; updateUI(); }
    saveT += dt; if (saveT > 5) { saveT = 0; writeSave(); }
  } catch (e) { console.error(e); toast('전투 처리 중 오류: ' + e.message); }
  requestAnimationFrame(loop);
}
function update(dt) {
  R.t += dt;
  R.buff = Math.max(0, R.buff - dt);
  if (R.mapStage !== S.stage) newMap();   // 스테이지가 바뀌면 새 지도
  // 전멸: 3초 뒤 그 자리에서 부활, 근처 이상체는 물러남(다시 배치)
  if (R.wipe > 0) {
    R.wipe -= dt;
    if (R.wipe <= 0) { syncHeroes(true); R.enemies = R.enemies.filter(e => dist(e, R.A) > 300 && !e.boss); for (const e of R.enemies) e.aggro = false; for (const h of owned()) Object.assign(R.heroes[h.id], formSlot(h.id)); }
    return;
  }
  R.enemies = R.enemies.filter(e => e.hp > 0);
  const live = R.enemies.length > 0;
  // 이상체 보충: 지도 위 일반 이상체가 줄면 다른 곳에 새 무리. 처치 수가 차면 보스 등장
  R.spawnT -= dt;
  if (R.spawnT <= 0 && R.enemies.filter(e => !e.boss).length < MAX_FIELD - 4) { spawnCluster(); R.spawnT = 1.5; }
  if (!R.boss && !S.farming && S.kills >= C.CONST.WAVE_KILLS) spawnBoss();
  // 파티 기준점: 싸우는 중이면 요원들 가운데, 아니면 지도에서 가장 가까운 무리(보스가 있으면 보스)를 향해 이동
  const hs = alive();
  const fighting = live && hs.length && (R.enemies.some(e => e.aggro) || hs.some(h => nearestEnemy(R.heroes[h.id], ENGAGE)));
  R.fighting = !!fighting;
  if (fighting) {
    let mx = 0, my = 0; for (const h of hs) { mx += R.heroes[h.id].x; my += R.heroes[h.id].y; }
    R.A.x += (mx / hs.length - R.A.x) * Math.min(1, dt * 2); R.A.y += (my / hs.length - R.A.y) * Math.min(1, dt * 2);
  } else {
    let tp = R.boss || nearestEnemy(R.A, Infinity);
    if (!tp) { if (!R.roam || dist(R.A, R.roam) < 20) R.roam = randPoint(120); tp = R.roam; }   // 이상체가 없으면 지도 산책
    const dx = tp.x - R.A.x, dy = tp.y - R.A.y;
    if (Math.hypot(dx, dy) > 4) R.heading += angDiff(Math.atan2(dy, dx), R.heading) * Math.min(1, dt * 3);
    moveTo(R.A, tp.x, tp.y, 95, dt);
  }
  keepIn(R.A, 60);
  if (R.boss) { R.bossT -= dt; if (R.bossT <= 0) bossFail('근원체 도주'); }
  for (const h of hs) heroAct(h, R.heroes[h.id], dt);
  // 투사체
  for (const p of R.proj) {
    const tx = p.tgt.x, ty = p.tgt.y - p.tgt.size * 0.45, dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (p.tgt.hp <= 0 && !p.aoe) { p.done = true; continue; }
    if (d < p.sp * dt + 4) {
      p.done = true;
      if (p.aoe) { for (const e of R.enemies) if (e.hp > 0 && dist(e, p.tgt) < 60) damage(e, p.dmg); addFx({ k: 'burst', x: tx, y: ty, r: 50, life: 0.3, col: '#ff9a2e' }); }
      else damage(p.tgt, p.dmg);
    } else { p.x += dx / d * p.sp * dt; p.y += dy / d * p.sp * dt; p.a = Math.atan2(dy, dx); }
  }
  R.proj = R.proj.filter(p => !p.done);
  // 이상체: 요원이 다가오면(또는 맞으면) 쫓아와서 공격
  for (const e of R.enemies) {
    e.hit = Math.max(0, e.hit - dt); e.swing = Math.max(0, e.swing - dt * 3); e.walk = false;
    let tg = null, bd = Infinity;
    for (const h of hs) { const d = dist(e, R.heroes[h.id]); if (d < bd) { bd = d; tg = h; } }
    if (!tg) continue;
    if (bd < (e.boss ? 240 : 150)) e.aggro = true;
    if (!e.aggro) { // 들키기 전: 제자리 근처를 어슬렁거림
      e.wt -= dt;
      if (e.wt <= 0) { e.wt = 1.5 + Math.random() * 2.5; const a = Math.random() * Math.PI * 2; e.tx = e.home.x + Math.cos(a) * 35; e.ty = e.home.y + Math.sin(a) * 25; }
      if (e.tx !== undefined && moveTo(e, e.tx, e.ty, 22, dt) > 2) e.walk = true;
      continue;
    }
    const hr = R.heroes[tg.id], reach = e.boss ? 58 : 30;
    if (bd > reach) { moveTo(e, hr.x, hr.y, e.boss ? 45 : 60, dt); e.walk = true; continue; }
    e.face = hr.x >= e.x ? 1 : -1;
    e.at += dt * (e.boss ? 0.7 : 0.8);
    if (e.at >= 1) {
      e.at = 0; e.swing = 1;
      hr.hp -= e.atk; hr.hurt = 1;
      addText(hr.x, hr.y - HERO_SIZE, C.formatNum(e.atk), '#ff7a7a', false);
    }
  }
  separate();
  for (const h of hs) keepIn(R.heroes[h.id], 24);
  for (const e of R.enemies) keepIn(e, e.boss ? 50 : 24);
  if (!alive().length) { R.wipe = 3; if (R.boss) bossFail('요원 후퇴'); else banner('요원 후퇴'); }
  // 효과
  for (const f of R.fx) { f.life -= dt; if (f.k === 'coin') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 380 * dt; if (f.y > f.floor) { f.y = f.floor; f.vy *= -0.4; f.vx *= 0.6; } } }
  R.fx = R.fx.filter(f => f.life > 0);
  for (const t of R.texts) { t.life -= dt; t.y -= dt * 40; }
  R.texts = R.texts.filter(t => t.life > 0);
  // 카메라: 파티 기준점을 부드럽게 따라감
  // 카메라 목표: 싸우는 중이면 요원 팀과 적 무리의 중간, 아니면 진행 방향 앞쪽
  let lx = R.A.x + Math.cos(R.heading) * 40, ly = R.A.y + Math.sin(R.heading) * 40;
  const near = R.enemies.filter(e => e.aggro);
  if (near.length) { let ex = 0, ey = 0; for (const e of near) { ex += e.x; ey += e.y - e.size * 0.4; } lx = (R.A.x + ex / near.length) / 2; ly = (R.A.y + ey / near.length) / 2; }
  R.cam.x += (lx - R.cam.x) * Math.min(1, dt * 2.5); R.cam.y += (ly - R.cam.y) * Math.min(1, dt * 2.5);
  R.cam.x = clampN(R.cam.x, -MAPW / 2 + 120, MAPW / 2 - 120); R.cam.y = clampN(R.cam.y, -MAPH / 2 + 110, MAPH / 2 - 110);
}
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
/** 유닛끼리 겹치지 않게 살짝 밀어냄 */
function separate() {
  const us = alive().map(h => ({ o: R.heroes[h.id], r: 16 })).concat(R.enemies.map(e => ({ o: e, r: e.boss ? 40 : 16 })));
  for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
    const a = us[i].o, b = us[j].o, min = us[i].r + us[j].r, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    if (d < min) { const push = (min - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
  }
}

/* ---------- 그리기 ---------- */
function draw() {
  const F = field();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#0b0d12'; g.fillRect(0, 0, W, H);
  // 화면 → 지도 변환
  g.save();
  const cy0 = R.boss ? 0.64 : 0.58;   // 보스전: 위쪽 체력 바만큼 화면을 내림
  g.translate(W / 2, H * cy0); g.scale(u, u); g.translate(-R.cam.x, -R.cam.y);
  const vw = W / u, vh = H / u, x0 = R.cam.x - vw / 2 - 60, x1 = R.cam.x + vw / 2 + 60, y0 = R.cam.y - vh * cy0 - 80, y1 = R.cam.y + vh * (1 - cy0) + 60;
  // 지도 바닥 (경계 안만) + 장식은 경계 안으로 잘라 그림
  g.fillStyle = F.ground; g.fillRect(-MAPW / 2, -MAPH / 2, MAPW, MAPH);
  g.save(); g.beginPath(); g.rect(-MAPW / 2, -MAPH / 2, MAPW, MAPH); g.clip();
  const chunks = [];
  for (let cy = Math.floor(y0 / CH); cy <= Math.floor(y1 / CH); cy++) for (let cx = Math.floor(x0 / CH); cx <= Math.floor(x1 / CH); cx++) chunks.push(chunk(cx, cy));
  // 0) 항구: 나무 부두 널빤지 줄
  if (F.planks) { g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 2; g.beginPath(); for (let yy = Math.floor(y0 / 18) * 18; yy < y1; yy += 18) { g.moveTo(x0, yy); g.lineTo(x1, yy); } g.stroke(); g.strokeStyle = 'rgba(150,170,210,.05)'; g.beginPath(); for (let yy = Math.floor(y0 / 18) * 18 + 2; yy < y1; yy += 18) { g.moveTo(x0, yy); g.lineTo(x1, yy); } g.stroke(); }
  // 1) 바닥 무늬
  for (const c of chunks) for (const d of c.flat) if (d.k === 'patch') { g.fillStyle = d.c; g.beginPath(); g.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, 7); g.fill(); }
  for (const c of chunks) for (const d of c.flat) {
    if (d.k === 'tuft') { g.strokeStyle = F.patch; g.lineWidth = 2; g.beginPath(); g.moveTo(d.x - 4, d.y); g.lineTo(d.x - 6, d.y - 7); g.moveTo(d.x, d.y); g.lineTo(d.x, d.y - 9); g.moveTo(d.x + 4, d.y); g.lineTo(d.x + 6, d.y - 7); g.stroke(); }
    else if (d.k === 'flower') { g.fillStyle = ['#6b6f86', '#8a7a4a', '#6d5a72', '#5b7089'][Math.floor(d.h * 4)]; g.beginPath(); g.arc(d.x, d.y, 2.2, 0, 7); g.fill(); }
    else if (d.k === 'stone') { g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(d.x, d.y + 1, 3.6 + d.h * 1.8, 2.2 + d.h, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(150,170,220,.06)'; g.beginPath(); g.ellipse(d.x - 0.6, d.y - 0.6, 2.4 + d.h, 1.3, 0, 0, 7); g.fill(); }
    else if (d.k === 'puddle') { // 젖은 바닥 웅덩이: 어두운 면 + 차가운 반사 테두리
      g.fillStyle = 'rgba(10,14,24,.22)'; g.beginPath(); g.ellipse(d.x, d.y, d.rx, d.rx * 0.32, 0, 0, 7); g.fill();
      g.strokeStyle = 'rgba(150,175,230,.12)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(d.x, d.y, d.rx, d.rx * 0.32, 0, Math.PI * 1.05, Math.PI * 1.75); g.stroke();

  const list = [];
  for (const c of chunks) for (const d of c.tall) if (Math.abs(d.x) < MAPW / 2 - 30 && Math.abs(d.y) < MAPH / 2 - 30) list.push({ y: d.y, f: () => drawProp(d, F) });

  for (const e of R.enemies) list.push({ y: e.y, f: () => drawEnemy(g, e, R.t) });

  for (const f of R.fx) drawFx(f);

  }
  g.globalCompositeOperation = 'lighter';
  for (const c of chunks) for (const d of c.tall) if (d.k === 'lamp') {
    const fl = 0.9 + Math.sin(R.t * 9 + d.x) * 0.06, gy = d.y - 52 * d.s, rad = 60 * fl, gr = g.createRadialGradient(d.x, gy, 0, d.x, gy, rad);
    const lc = lampCol(F, d); gr.addColorStop(0, `rgba(${lc},${(0.16 + F.night * 0.5 + F.neon * 0.06).toFixed(2)})`); gr.addColorStop(1, `rgba(${lc},0)`);

    const rf = g.createRadialGradient(d.x, d.y + 6, 0, d.x, d.y + 6, 34); rf.addColorStop(0, `rgba(${lc},.24)`); rf.addColorStop(1, `rgba(${lc},0)`);
    g.save(); g.translate(d.x, d.y + 6); g.scale(0.45, 1.3); g.translate(-d.x, -d.y - 6); g.fillStyle = rf; g.beginPath(); g.arc(d.x, d.y + 6, 34, 0, 7); g.fill(); g.restore();

  for (const t of R.texts) {

    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.8)'; g.strokeText(t.txt, t.x, t.y); g.fillStyle = t.col; g.fillText(t.txt, t.x, t.y);

  if (R.wipe > 0) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '18px "Black Han Sans"'; g.fillText(`${Math.ceil(R.wipe)}초 뒤 다시 출발`, W / 2, H * 0.3); }
}
/* 비: 화면 고정 빗줄기 (시간 기준이라 멈춰 있어도 내림) */
const RAIN = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), l: 8 + Math.random() * 12, v: 0.9 + Math.random() * 0.6, a: 0.12 + Math.random() * 0.2 }));

  const t = performance.now() / 1000;

function drawFog() {

}
/** 지도 테두리 돌담 (안쪽 위 모서리에 젖은 빛) */

  g.strokeStyle = shade(F.rock, -45); g.lineWidth = 26; g.strokeRect(x0 - 13, y0 - 13, MAPW + 26, MAPH + 26);
  g.strokeStyle = shade(F.rock, -20); g.lineWidth = 6; g.strokeRect(x0 - 3, y0 - 3, MAPW + 6, MAPH + 6);
  g.strokeStyle = 'rgba(160,180,230,.12)'; g.lineWidth = 1.5; g.strokeRect(x0, y0, MAPW, MAPH);

/** 미니맵: 지도 전체, 이상체(빨강), 근원체(크게), 요원 팀(노랑), 현재 보이는 범위 */

/** 지도 장식: 나무, 덤불, 바위, 등불 가로등 (그림자 + 빛 받는 면) */
function drawProp(d, F) {

    g.fillStyle = '#4a3f33'; g.fillRect(-14 * s, -30 * s, 28 * s, 7 * s);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 2; g.strokeRect(-14 * s, -24 * s, 28 * s, 24 * s); g.beginPath(); g.moveTo(-14 * s, -24 * s); g.lineTo(14 * s, 0); g.stroke();
  } else if (d.k === 'barrel') {
    g.fillStyle = '#3b2f26'; g.fillRect(-10 * s, -26 * s, 20 * s, 26 * s);
    g.fillStyle = '#4b3c30'; g.beginPath(); g.ellipse(0, -26 * s, 10 * s, 4 * s, 0, 0, 7); g.fill();
    g.fillStyle = '#5b5f6b'; g.fillRect(-10 * s, -20 * s, 20 * s, 2.5 * s); g.fillRect(-10 * s, -8 * s, 20 * s, 2.5 * s);
  } else if (d.k === 'bush') {

    g.fillStyle = F.rock; g.beginPath(); g.moveTo(-14 * s, -18 * s); g.lineTo(2 * s, -26 * s); g.lineTo(6 * s, -10 * s); g.lineTo(-10 * s, -6 * s); g.closePath(); g.fill();

    g.beginPath(); rr(g, -18 * s, -32 * s, 36 * s, 14 * s, 6 * s); g.fill();
    g.fillStyle = 'rgba(140,165,220,.22)'; g.fillRect(-14 * s, -29 * s, 13 * s, 9 * s); g.fillRect(2 * s, -29 * s, 13 * s, 9 * s);
    g.fillStyle = '#0d0d10'; g.beginPath(); g.arc(-20 * s, -4 * s, 6 * s, 0, 7); g.arc(20 * s, -4 * s, 6 * s, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,90,70,.7)'; g.fillRect(-34 * s, -17 * s, 3 * s, 4 * s);

    g.fillStyle = '#2c2c30'; g.fillRect(-6 * s, -18 * s, 12 * s, 18 * s); g.beginPath(); g.ellipse(0, -18 * s, 8 * s, 3 * s, 0, 0, 7); g.fill();
    g.strokeStyle = '#6b5a40'; g.lineWidth = 2.5 * s; g.beginPath(); g.ellipse(0, -10 * s, 7 * s, 2.5 * s, 0, 0, 7); g.stroke();

function drawHeroRt(h, r) {
  const bob = r.walk ? Math.abs(Math.sin(R.t * 12 + r.x)) * 3 : 0;

  drawHero(g, h.id, r.x, r.y - bob, HERO_SIZE, R.t, r.swing, r.hurt, r.face);

  if (r.hp < r.max) { g.fillStyle = '#300'; g.fillRect(r.x - 16, r.y + 6, 32, 4); g.fillStyle = '#5be37f'; g.fillRect(r.x - 16, r.y + 6, 32 * Math.max(0, r.hp / r.max), 4); }
}
function drawProj(p) {
  g.save(); g.translate(p.x, p.y); g.rotate(p.a || 0);
  if (p.k === 'archer') { // 저격탄: 노란 예광 줄
    const tg = g.createLinearGradient(-26, 0, 4, 0); tg.addColorStop(0, 'rgba(255,220,140,0)'); tg.addColorStop(1, p.gold ? '#ffd23a' : '#fff1c8');

  } else if (p.k === 'mage') { // 화염병: 빙글 도는 병 + 불꽃

    g.strokeStyle = '#dfe6f2'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-10, 0); g.lineTo(4, 0); g.stroke();
    g.fillStyle = '#c8323c'; g.fillRect(-12, -1.5, 4, 3);

function drawFx(f) {

/* ---------- 초상화 (캔버스로 한 번 그려서 재사용) ---------- */
const portraitCache = {};
function portrait(id) {
  if (ART['card_' + id]) return ART['card_' + id];   // 그림 카드 (얼굴)
  if (portraitCache[id]) return portraitCache[id];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const p = c.getContext('2d'); if (!p) return '';
  const bg = p.createLinearGradient(0, 0, 0, 128); bg.addColorStop(0, shade(LOOK[id].coat, 45)); bg.addColorStop(1, '#1C212B');
  p.fillStyle = bg; p.fillRect(0, 0, 128, 128);
  drawHero(p, id, 56, 190, 200, 0, 0.15, 0);
  return (portraitCache[id] = c.toDataURL());
}

/* ---------- UI: HUD와 파티 ---------- */
let partyKey = '';
function renderParty() {
  const list = owned(), slots = [];
  for (let i = 0; i < 5; i++) {
    const h = list[i];
    slots.push(h ? `<div class="slot" id="sl-${h.id}"><img src="${portrait(h.id)}" alt="${h.name}"><div class="cd"></div><div class="hp"><i></i></div></div>` : `<div class="slot empty" title="호출로 합류">+</div>`);
  }
  $('party').innerHTML = slots.join('');
}
function updateUI() {
  $('stage').textContent = C.stageLabel(S.stage);
  $('area').textContent = theme().name;
  $('gold').textContent = C.formatNum(S.gold);
  $('gems').textContent = C.formatNum(S.gems);
  const bar = $('prog').firstElementChild, lab = $('prog').lastElementChild;
  if (R.boss) { bar.className = 'boss'; bar.style.width = (100 * Math.max(0, R.boss.hp / R.boss.max)) + '%'; lab.textContent = '봉쇄 작전'; }
  else if (S.farming) { bar.className = ''; bar.style.width = '100%'; lab.textContent = '구역 순찰'; }
  else { bar.className = ''; bar.style.width = (100 * S.kills / C.CONST.WAVE_KILLS) + '%'; lab.textContent = `${S.kills} / ${C.CONST.WAVE_KILLS}`; }
  $('bossBtn').style.display = S.farming && !R.boss ? 'block' : 'none';
  const key = owned().map(h => h.id).join();
  if (key !== partyKey) { partyKey = key; renderParty(); }
  for (const h of owned()) {
    const el = $('sl-' + h.id), r = R.heroes[h.id]; if (!el || !r) continue;
    el.style.setProperty('--cd', Math.max(0, r.cd / h.skill.cd).toFixed(3));
    el.style.setProperty('--hp', (100 * Math.max(0, r.hp / r.max)).toFixed(1) + '%');
    el.classList.toggle('ready', r.cd <= 0.15 && r.hp > 0);
    el.classList.toggle('dead', r.hp <= 0);
  }
  updatePanel();
}
