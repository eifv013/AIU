<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 수사 3팀과 같은 누아르, 비 오는 밤의 범죄 액션, 모바일 방치형
   IDEA: 동물 요원들이 비 내리는 도시 구역을 돌아다니며 조직원을 소탕
   PICTURE: 상단 전투 캔버스(구역 지도, 요원, 조직원, 두목)
   COLOUR and TYPE: 깊은 남색 패널 + 금색 테두리 + 진홍 강조 / Black Han Sans 제목, Noto Sans KR 본문
   LAYOUT: 세로 고정. HUD → 전투 → 파티 슬롯 → 탭 패널 → 하단 탭 */
/* 색은 수사 3팀과 같은 값 (--ink 는 여기서 글자색) */
:root{--bg:#12151C;--panel:#1C212B;--panel2:#232937;--line:#2E3542;--gold:#FFD23F;--gold2:#2E3542;--red:#E0503E;--ink:#F3F0E8;--dim:#A3ACBA;--ok:#5BD08A}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;margin:0;height:100%;background:#0b0d12;color:var(--ink);font:15px/1.4 'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.num{font-family:"Black Han Sans",sans-serif;letter-spacing:.01em}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(18,21,28,.96);border-bottom:1px solid var(--line)}
#stageBox{flex:1}
#stageRow{display:flex;align-items:baseline;gap:8px}
#stage{font-family:"Black Han Sans";font-size:24px;color:var(--gold);line-height:1}
#area{font-size:13px;color:var(--dim)}
#prog{position:relative;height:14px;margin-top:5px;border-radius:7px;background:#0b0d12;border:1px solid var(--line);overflow:hidden}
#prog i{position:absolute;inset:0 auto 0 0;background:var(--gold);opacity:.9;transition:width .2s}
#prog i.boss{background:var(--red)}
#prog span{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;background:#0b0d12;border:1px solid var(--line);font-family:"Black Han Sans";font-size:15px;white-space:nowrap}

/* 전투 */
#battle{position:relative;flex:0 0 auto;height:45vh;height:45dvh;min-height:260px;max-height:430px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossBtn{position:absolute;right:10px;top:10px;display:none;padding:8px 14px;border-radius:10px;border:0;background:var(--red);color:#fff;font-family:"Black Han Sans";font-size:15px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#banner{position:absolute;left:0;right:0;top:36%;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(18,21,28,.82) 20%,rgba(18,21,28,.82) 80%,transparent);text-align:center;font-family:"Black Han Sans";font-size:30px;color:#fff;color:var(--gold);text-shadow:0 2px 0 #000;opacity:0;pointer-events:none;transition:opacity .3s}

/* 파티 슬롯 */
#party{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.slot{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--panel);overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%}
.slot .cd{position:absolute;left:0;right:0;top:0;height:calc(var(--cd,0)*100%);background:rgba(5,8,25,.68);border-bottom:2px solid rgba(159,232,255,.8)}
.slot.ready .cd{border-bottom:0}
.slot.ready{border-color:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.5)}
.slot .hp{position:absolute;left:3px;right:3px;bottom:3px;height:5px;border-radius:3px;background:#300}
.slot .hp i{display:block;height:100%;border-radius:3px;background:var(--ok);width:var(--hp,100%)}
.slot.dead img{filter:grayscale(1) brightness(.5)}
.slot.empty{display:grid;place-items:center;color:var(--dim);font-size:22px;border-style:dashed}

/* 패널 */
#panel{flex:1;overflow-y:auto;padding:10px 10px 16px;background:var(--bg)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);background:rgba(18,21,28,.96);border-top:1px solid var(--line)}
#tabs button{height:54px;border:0;background:none;color:var(--dim);font:700 15px 'IBM Plex Sans KR';position:relative}
#tabs button.on{color:var(--gold)}
#tabs button.on::after{content:"";position:absolute;left:25%;right:25%;top:0;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.dot{position:absolute;top:10px;right:calc(50% - 30px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}

.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 14px 'IBM Plex Sans KR'}
.seg button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold)}

.card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.card .pt{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.card.locked .pt{filter:grayscale(1) brightness(.45)}
.nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.nm b{font-size:16px}
.role{font-size:12px;color:var(--dim)}
.gr{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.g-희귀{background:#2B4363;color:#BFD6F2}.g-영웅{background:#43315F;color:#D8C6F5}.g-전설{background:var(--gold);color:#12151C}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.stars s{color:#3a4470;text-decoration:none}
.stat{display:flex;gap:10px;font-size:13px;color:var(--dim);white-space:nowrap}
.stat em{font-style:normal;color:var(--ink);font-weight:700}
.shard{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:#B48CFF}
.st{font-size:12px;color:var(--dim);white-space:nowrap}

.btn{min-width:96px;min-height:48px;padding:4px 10px;border-radius:12px;border:0;background:var(--gold);color:#12151C;font:900 14px 'IBM Plex Sans KR';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.btn:active{transform:translateY(1px);opacity:.85}
.btn .cost i{font-style:normal}
.btn .cost{display:flex;align-items:center;gap:3px;font-family:"Black Han Sans";font-weight:400;font-size:14px}
.btn:disabled{background:var(--panel2);color:#5F6878}
.btn.sm{min-width:64px;min-height:36px;font-size:13px}
.btn.blue{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.blue:disabled{background:transparent;color:#5F6878;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:var(--bg);color:var(--dim);border:1px solid var(--line);box-shadow:none}
.hint{font-size:12px;color:var(--dim)}
h3{margin:14px 2px 8px;font:400 17px "Black Han Sans";color:var(--gold)}

.urow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.uic{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.uic svg{width:28px;height:28px}
.ut{font-weight:700}
.uv{font-size:13px;color:var(--dim)}
.uv em{font-style:normal;color:var(--ok);font-weight:700}

.sbanner{position:relative;height:170px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0d12}
.sbanner canvas{position:absolute;inset:0;width:100%;height:100%}
.sbanner .tt{position:absolute;left:14px;bottom:12px;right:14px}
.sbanner .tt b{display:block;font:400 26px "Black Han Sans";color:#fff;text-shadow:0 2px 0 #000}
.sbanner .tt span{font-size:13px;color:#ffd98a}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.srow .btn{min-height:58px;font-size:15px}
.rates{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.rates div{display:flex;justify-content:space-between;padding:2px 0}

/* 모달 */
#modal{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(8,9,12,.78)}
#modal.on{display:grid}
.mbox{width:100%;max-width:360px;padding:20px 18px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;box-shadow:0 10px 40px #000}
.mbox h2{margin:0 0 6px;font:400 22px "Black Han Sans";color:var(--gold)}
.mbox p{margin:4px 0;color:var(--dim)}
.big{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0;font:400 34px "Black Han Sans";color:#fff}
.mbtns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.mbtns .btn{flex:1}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.res.one{grid-template-columns:90px;justify-content:center}
.rc{position:relative;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:3px 3px 5px;opacity:0;transform:scale(.6);animation:pop .35s forwards}
.rc img{width:100%;aspect-ratio:1;display:block;border-radius:7px}
.rc.leg{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,63,.6)}
.rc small{display:block;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rc .new{position:absolute;top:-6px;right:-4px;padding:0 5px;border-radius:6px;background:var(--red);color:#fff;font:400 11px "Black Han Sans"}
@keyframes pop{to{opacity:1;transform:none}}

/* 시작 화면 */
/* 시작 화면: 수사 3팀 로딩 화면과 같은 구성 (부제, 큰 제목, 그림 줄, 불러오기 줄, 건너뛰기 안내) */
#splash{position:absolute;inset:0;z-index:30;background:var(--bg)}
.sp-game{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
/* AIU 로고 */
.aiu{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.aiu-mark{width:min(64vw,236px);height:auto;display:block;overflow:visible}
.aiu .rift{animation:rift 3.2s infinite}
@keyframes rift{0%,100%{opacity:.95}46%{opacity:.95}48%{opacity:.25}50%{opacity:1}52%{opacity:.4}54%{opacity:.95}}
.aiu-stamp{position:absolute;right:-14px;top:-14px;padding:3px 7px;border:2px solid #E0503E;border-radius:4px;color:#E0503E;font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.12em;transform:rotate(12deg);opacity:.88;background:rgba(18,21,28,.6)}
.aiu-en{margin-top:4px;font:600 9px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.42em;margin-right:-.42em;color:var(--dim)}
.aiu-ko{display:flex;align-items:center;gap:10px;font:600 14px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.22em;color:var(--ink)}
.aiu-ko span{margin-right:-.22em}
.aiu-ko i{display:block;width:22px;height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){.aiu .rift{animation:none}}
.sp-sub{font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--dim)}
.sp-title{font-family:'Black Han Sans',sans-serif;font-size:60px;line-height:1;color:var(--gold);text-align:center}
.lineup{display:flex;gap:10px;margin:10px 0 4px}
.lineup img{width:84px;height:108px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.sp-load{width:200px;display:flex;flex-direction:column;gap:8px;align-items:center}
.sp-bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;transition:width .3s ease}
.sp-msg{font-size:12px;color:var(--dim);min-height:16px}
.sp-skip{font-size:11px;color:var(--dim);opacity:.6;margin-top:6px}
/* 제작사 표기: 수사 3팀 .sp-brand 와 같은 값 (bottom 12px, gap 4px, 8px 글씨, 로고 108px, margin-top -7px) */
#splash .by{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px}
#splash .by small{font-family:'IBM Plex Sans KR',sans-serif;font-size:8px;font-weight:600;letter-spacing:.32em;color:#A3ACBA}
#splash .by .sp-logo{width:min(28vw,108px);height:auto;display:block;margin-top:-7px}
#toast{position:absolute;left:50%;top:70px;z-index:40;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.85);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#bossBtn{animation:none}}
</style>
</head>
<body>
<!-- 재화 아이콘 (글자 도형 대신 항상 이 아이콘을 사용) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gG" cx="35%" cy="30%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#b9780f"/></radialGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff4ff"/><stop offset=".5" stop-color="#46b6ff"/><stop offset="1" stop-color="#2346c9"/></linearGradient>
  </defs>
  <symbol id="i-gold" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="url(#gG)" stroke="#8a5609" stroke-width="1.4"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#a96d0c" stroke-width="1.3"/><path d="M12 8.2l1.1 2.4 2.6.3-1.9 1.8.5 2.6-2.3-1.3-2.3 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="#fff4c2"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="url(#gM)" stroke="#1a2f8f" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 9h20M8 3l-2 6 6 12 6-12-2-6" fill="none" stroke="#e4fbff" stroke-width=".9" opacity=".8"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path d="M19 3l2 2-10 10-2-2z" fill="#dfe6ff" stroke="#6b78b5"/><path d="M6 14l4 4-2 1-1.5-1.5L4 20l-1-1 2.5-2.5L4 15z" fill="#f5c451" stroke="#8a5609"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e04848"/><circle cx="12" cy="12" r="6" fill="#fff"/><circle cx="12" cy="12" r="3" fill="#e04848"/></symbol>
</svg>

<div id="app">
  <div id="hud">
    <div id="stageBox">
      <div id="stageRow"><span id="stage">1-1</span><span id="area">초원 길</span></div>
      <div id="prog"><i></i><span></span></div>
    </div>
    <div class="pill"><svg class="ic"><use href="#i-gold"/></svg><span id="gold">0</span></div>
    <div class="pill"><svg class="ic"><use href="#i-gem"/></svg><span id="gems">0</span></div>
  </div>
  <div id="battle">
    <canvas id="cv"></canvas>
    <button id="bossBtn">두목 추적</button>
    <div id="banner"></div>
  </div>
  <div id="party"></div>
  <div id="panel"></div>
  <nav id="tabs">
    <button data-tab="hero" class="on">요원<i class="dot" id="dotHero"></i></button>
    <button data-tab="train">훈련소<i class="dot" id="dotTrain"></i></button>
    <button data-tab="summon">소환</button>
  </nav>
  <div id="modal"></div>
  <div id="toast"></div>
  <div id="splash" role="img" aria-label="Loop &amp; Lamp Studio 의 AIU 이상현상 전담수사팀, 불러오는 중">
    <div class="sp-game" aria-hidden="true">
      <!-- AIU 로고: 스텐실 글자 + 균열(이상현상) + 정식 명칭 + 기밀 도장. 그림은 SVG 로 직접 그림 -->
      <div class="aiu">
        <svg class="aiu-mark" viewBox="-6 -8 262 122" role="img" aria-label="AIU">
          <defs>
            <linearGradient id="aiuFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FFD23F"/><stop offset="1" stop-color="#C99A17"/></linearGradient>
            <filter id="aiuGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <clipPath id="aiuLetters"><path d="M0 100 L35 0 H65 L100 100 H74 L68 80 H32 L26 100 Z M40 58 H60 L50 27 Z M114 0 H144 V100 H114 Z M160 0 H190 V64 Q190 78 205 78 Q220 78 220 64 V0 H250 V68 Q250 101 205 101 Q160 101 160 68 Z" clip-rule="evenodd"/></clipPath>
          </defs>
          <clipPath id="aiuL"><polygon points="-6,-8 131,-8 126,14 134,33 125,52 133,70 127,90 130,114 -6,114"/></clipPath>
          <clipPath id="aiuR"><polygon points="131,-8 126,14 134,33 125,52 133,70 127,90 130,114 256,114 256,-8"/></clipPath>
          <!-- 균열 기준 왼쪽 조각은 위로, 오른쪽 조각은 아래로 살짝 어긋남 -->
          <g clip-path="url(#aiuL)"><g transform="translate(0 -1.6)"><g clip-path="url(#aiuLetters)">
            <rect x="-6" y="-8" width="262" height="122" fill="url(#aiuFill)"/>
            <rect x="-6" y="45" width="262" height="5" fill="#12151C"/>
            <rect x="-6" y="-8" width="262" height="12" fill="#FFF3C2" opacity=".45"/>
          </g></g></g>
          <g clip-path="url(#aiuR)"><g transform="translate(0 1.6)"><g clip-path="url(#aiuLetters)">
            <rect x="-6" y="-8" width="262" height="122" fill="url(#aiuFill)"/>
            <rect x="-6" y="45" width="262" height="5" fill="#12151C"/>
            <rect x="-6" y="-8" width="262" height="12" fill="#FFF3C2" opacity=".45"/>
          </g></g></g>
          <!-- 갈라진 틈에서 새어 나오는 보랏빛 (I 를 세로로 지나감) -->
          <g class="rift" filter="url(#aiuGlow)">
            <polyline points="131,-8 126,14 134,33 125,52 133,70 127,90 130,114" fill="none" stroke="#B48CFF" stroke-width="2.2" stroke-linejoin="miter"/>
            <polyline points="131,-8 126,14 134,33 125,52 133,70 127,90 130,114" fill="none" stroke="#F2E9FF" stroke-width="1" stroke-linejoin="miter"/>
            <polyline points="134,33 146,29 154,32" fill="none" stroke="#B48CFF" stroke-width="1.4"/>
            <polyline points="125,52 113,58 105,56" fill="none" stroke="#B48CFF" stroke-width="1.4"/>
          </g>
        </svg>
        <div class="aiu-stamp">1급 기밀</div>
        <div class="aiu-en">ANOMALOUS INCIDENT UNIT</div>
        <div class="aiu-ko"><i></i><span>이상현상 전담수사팀</span><i></i></div>
      </div>
      <div class="lineup" id="sp-lineup"></div>
      <div class="sp-load">
        <div class="sp-bar"><i id="sp-fill"></i></div>
        <span class="sp-msg" id="sp-msg">비 내리는 중</span>
      </div>
      <span class="sp-skip">화면을 누르면 건너뛰어요</span>
    </div>
    <!-- 제작사 표기: 수사 3팀 로딩 화면과 똑같이 (같은 SVG 로고, 같은 크기와 간격). 빌드 때 SVG 가 들어감 -->
    <div class="by" aria-label="A game by Loop &amp; Lamp Studio"><small>A GAME BY</small>LOGO_SVG</div>
  </div>
</div>

<script>
{
'use strict';
/* ============================================================
 * AIU (이상현상 전담수사팀) — 화면과 전투 (core.js 의 규칙을 사용)
 *  구조: 저장 상태 S(영구) / 전투 상태 R(일시) / 그리기 / UI 패널
 * ============================================================ */
const C = window.Core;
if (!C) { document.body.textContent = '게임 규칙을 불러오지 못했습니다.'; throw new Error('Core 없음'); }
const $ = id => document.getElementById(id);
const SAVE_KEY = 'lamp-knights-save-v1';

/* ---------- 저장 / 불러오기 (저장소가 막힌 환경에서도 게임은 계속) ---------- */
let storageOk = true;
function readSave() {
  try { return localStorage.getItem(SAVE_KEY); } catch (e) { storageOk = false; return null; }
}
function writeSave() {
  if (!storageOk) return;
  try { S.lastSeen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch (e) { storageOk = false; toast('이 브라우저에서는 저장이 되지 않아요'); }
}
let S = C.loadFromString(readSave(), Date.now()).state;
const firstRun = !readSave();

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }
let bannerT = 0;
function banner(msg) { const b = $('banner'); b.textContent = msg; b.style.opacity = 1; clearTimeout(bannerT); bannerT = setTimeout(() => b.style.opacity = 0, 1400); }
window.addEventListener('error', e => toast('오류가 발생했어요: ' + (e.message || '알 수 없음')));

/* ---------- 지역 테마 (챕터마다 순환) ---------- */
const THEMES = [
  { name: '빗속 뒷골목', boss: '멧돼지 두목' },
  { name: '안개 항구',   boss: '들소 집행관' },
  { name: '네온 유흥가', boss: '도마뱀 회장' },
];
const theme = () => THEMES[Math.floor((S.stage - 1) / 10) % THEMES.length];

/* ---------- 요원 외형 (그림이 오기 전 임시 모습: 동물 머리 + 역할 장비) ---------- */
const LOOK = {
  knight: { coat: '#2f3a52', trim: '#5d6b86', fur: '#8a8f99', muzzle: '#a2a7b0' },   // 코뿔소, 진압복
  archer: { coat: '#2f4436', trim: '#55705c', fur: '#b8925f', muzzle: '#e2cfae' },   // 스라소니, 후드 코트
  mage:   { coat: '#3a2f4f', trim: '#6a5a8a', fur: '#26232c', muzzle: '#3a3640' },   // 검은 염소, 긴 코트
  priest: { coat: '#cfd0d6', trim: '#9a3a42', fur: '#ecebe6', muzzle: '#c9b98a' },   // 두루미, 흰 의무복
  dark:   { coat: '#18171d', trim: '#6b4fa0', fur: '#1b1a20', muzzle: '#2a2830' },   // 흑표범, 검은 정장
};
function rr(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + p));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const tri = (g, a, b, c) => { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.closePath(); g.fill(); };

/** 동물 머리. 오른쪽을 보는 옆얼굴 기준 (hy = 머리 중심 높이) */
function drawAnimalHead(g, kind, hy, s, fur, muzzle) {
  const r = s * 0.19;
  if (kind === 'rhino') {
    g.fillStyle = fur; g.beginPath(); g.ellipse(s * 0.02, hy, r * 1.05, r, 0, 0, 7); g.fill();
    g.fillStyle = muzzle; g.beginPath(); g.ellipse(s * 0.17, hy + s * 0.05, r * 0.75, r * 0.6, 0, 0, 7); g.fill();
    g.fillStyle = '#e4dccb'; tri(g, [s * 0.2, hy - s * 0.02], [s * 0.32, hy - s * 0.2], [s * 0.3, hy + s * 0.01]);
    g.fillStyle = fur; tri(g, [-s * 0.12, hy - s * 0.12], [-s * 0.06, hy - s * 0.27], [-s * 0.01, hy - s * 0.15]);
  } else if (kind === 'lynx') {
    g.fillStyle = fur; g.beginPath(); g.arc(0, hy, r, 0, 7); g.fill();
    tri(g, [-s * 0.14, hy - s * 0.08], [-s * 0.1, hy - s * 0.3], [-s * 0.02, hy - s * 0.14]);
    tri(g, [s * 0.02, hy - s * 0.16], [s * 0.08, hy - s * 0.32], [s * 0.13, hy - s * 0.1]);
    g.strokeStyle = '#1a1612'; g.lineWidth = s * 0.02; g.beginPath(); g.moveTo(-s * 0.1, hy - s * 0.3); g.lineTo(-s * 0.1, hy - s * 0.38); g.moveTo(s * 0.08, hy - s * 0.32); g.lineTo(s * 0.08, hy - s * 0.4); g.stroke();
    g.fillStyle = muzzle; g.beginPath(); g.ellipse(s * 0.12, hy + s * 0.06, r * 0.55, r * 0.42, 0, 0, 7); g.fill();
  } else if (kind === 'goat') {
    g.fillStyle = fur; g.beginPath(); g.ellipse(s * 0.02, hy, r, r * 0.95, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(s * 0.15, hy + s * 0.08, r * 0.55, r * 0.5, 0.4, 0, 7); g.fill();
    g.strokeStyle = '#8c8170'; g.lineWidth = s * 0.055; g.lineCap = 'round';
    g.beginPath(); g.arc(-s * 0.06, hy - s * 0.1, s * 0.12, -0.2, Math.PI * 1.35, true); g.stroke();
    g.fillStyle = muzzle; tri(g, [s * 0.12, hy + s * 0.16], [s * 0.2, hy + s * 0.16], [s * 0.15, hy + s * 0.28]);
  } else if (kind === 'crane') {
    g.fillStyle = '#1d1d22'; g.fillRect(-s * 0.05, hy, s * 0.1, s * 0.22);   // 검은 목
    g.fillStyle = fur; g.beginPath(); g.arc(0, hy, r * 0.9, 0, 7); g.fill();
    g.fillStyle = '#c8323c'; g.beginPath(); g.arc(-s * 0.02, hy - s * 0.12, s * 0.07, Math.PI, Math.PI * 2); g.fill();
    g.fillStyle = muzzle; tri(g, [s * 0.12, hy - s * 0.02], [s * 0.42, hy + s * 0.05], [s * 0.12, hy + s * 0.07]);
  } else { // panther
    g.fillStyle = fur; g.beginPath(); g.arc(0, hy, r, 0, 7); g.fill();
    g.beginPath(); g.arc(-s * 0.1, hy - s * 0.15, s * 0.06, 0, 7); g.fill(); g.beginPath(); g.arc(s * 0.08, hy - s * 0.16, s * 0.06, 0, 7); g.fill();
    g.fillStyle = muzzle; g.beginPath(); g.ellipse(s * 0.12, hy + s * 0.06, r * 0.5, r * 0.4, 0, 0, 7); g.fill();
  }
  // 차가운 테두리 빛 (누아르 림 라이트): 왼쪽 위 가장자리에 선 하나. 필터 없이 가볍게 그림
  g.strokeStyle = 'rgba(170,195,255,.45)'; g.lineWidth = s * 0.018; g.lineCap = 'round';
  g.beginPath(); g.arc(0, hy, r * 1.02, Math.PI * 1.0, Math.PI * 1.55); g.stroke();
  // 눈 (흑표범은 빛나는 호박색)
  g.fillStyle = kind === 'panther' ? '#ffb31a' : kind === 'goat' ? '#d9b84a' : '#15151c';
  g.fillRect(s * 0.07, hy - s * 0.04, s * 0.045, kind === 'goat' ? s * 0.025 : s * 0.045);
}
const HEAD = { knight: 'rhino', archer: 'lynx', mage: 'goat', priest: 'crane', dark: 'panther' };

/** 요원 그리기. s = 키 기준 크기, swing = 공격 동작(0~1), face: 1 오른쪽 / -1 왼쪽 */
function drawHero(g, id, x, y, s, t, swing, hurt, face = 1) {
  const L = LOOK[id], bob = Math.sin(t * 5 + x) * s * 0.02;
  g.save(); g.translate(x, y);
  if (face < 0) g.scale(-1, 1);
  // 캔버스 필터는 매우 느려서(측정: 초당 1.3프레임) 쓰지 않음. 맞으면 몸이 좌우로 떨림
  if (hurt > 0) g.translate(Math.sin(hurt * 40) * hurt * 3, 0);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0, 0, s * 0.3, s * 0.07, 0, 0, 7); g.fill();
  g.translate(0, bob);
  // 다리
  g.fillStyle = '#16161c'; g.fillRect(-s * 0.12, -s * 0.2, s * 0.09, s * 0.2); g.fillRect(s * 0.03, -s * 0.2, s * 0.09, s * 0.2);
  // 몸: 긴 코트(옷자락이 살짝 펄럭임), 빛 받는 왼쪽 면
  const bg = g.createLinearGradient(-s * 0.2, 0, s * 0.2, 0); bg.addColorStop(0, shade(L.coat, 28)); bg.addColorStop(1, shade(L.coat, -18));
  const flap = Math.sin(t * 6) * s * 0.02;
  g.fillStyle = bg; g.beginPath();
  g.moveTo(-s * 0.15, -s * 0.58); g.lineTo(s * 0.15, -s * 0.58); g.lineTo(s * 0.2, -s * 0.14); g.lineTo(-s * 0.22 - flap, -s * 0.12); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(170,195,255,.3)'; g.lineWidth = s * 0.014; g.beginPath(); g.moveTo(-s * 0.15, -s * 0.56); g.lineTo(-s * 0.21 - flap, -s * 0.14); g.stroke();
  g.fillStyle = L.trim; g.fillRect(-s * 0.15, -s * 0.36, s * 0.3, s * 0.035);   // 허리띠
  if (id === 'priest') { g.fillStyle = '#9a3a42'; g.fillRect(-s * 0.03, -s * 0.52, s * 0.06, s * 0.14); g.fillRect(-s * 0.07, -s * 0.48, s * 0.14, s * 0.06); }   // 의무 표시
  if (id === 'dark') { g.fillStyle = '#6b4fa0'; g.fillRect(-s * 0.02, -s * 0.58, s * 0.04, s * 0.2); }   // 보라 넥타이
  // 머리
  drawAnimalHead(g, HEAD[id], -s * 0.74, s, L.fur, L.muzzle);
  // 무기
  g.save(); g.translate(s * 0.12, -s * 0.4);
  if (id === 'knight') { // 진압 방패 (위쪽 작은 창)
    g.translate(s * 0.06 + swing * s * 0.08, 0);
    g.fillStyle = '#20252f'; g.beginPath(); rr(g, -s * 0.02, -s * 0.2, s * 0.12, s * 0.42, s * 0.03); g.fill();
    g.fillStyle = 'rgba(150,180,230,.35)'; g.fillRect(0, -s * 0.16, s * 0.08, s * 0.08);
    g.strokeStyle = '#5d6b86'; g.lineWidth = s * 0.012; g.strokeRect(-s * 0.02, -s * 0.2, s * 0.12, s * 0.42);
  } else if (id === 'archer') { // 저격총
    g.rotate(-0.05 - swing * 0.15);
    g.fillStyle = '#121216'; g.fillRect(-s * 0.08, -s * 0.03, s * 0.55, s * 0.045); g.fillRect(-s * 0.1, -s * 0.03, s * 0.1, s * 0.1);
    g.fillStyle = '#2b2b33'; g.fillRect(s * 0.06, -s * 0.07, s * 0.14, s * 0.04);
    if (swing > 0.7) { g.fillStyle = 'rgba(255,220,140,.9)'; g.beginPath(); g.arc(s * 0.5, -s * 0.01, s * 0.04, 0, 7); g.fill(); }
  } else if (id === 'mage') { // 화염병 (불꽃 심지)
    g.rotate(-0.4 - swing * 1.6);
    g.fillStyle = '#3d5a3a'; g.fillRect(-s * 0.03, -s * 0.16, s * 0.06, s * 0.12);
    const fl = g.createRadialGradient(0, -s * 0.2, 0, 0, -s * 0.2, s * 0.08); fl.addColorStop(0, '#fff2c0'); fl.addColorStop(0.5, '#ff8a2e'); fl.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = fl; g.beginPath(); g.arc(0, -s * 0.2, s * 0.08, 0, 7); g.fill();
  } else if (id === 'priest') { // 손 등불 (루프램프)
    g.rotate(-0.1 + swing * 0.3);
    g.strokeStyle = '#2a2a30'; g.lineWidth = s * 0.015; g.beginPath(); g.moveTo(0, -s * 0.06); g.lineTo(0, s * 0.02); g.stroke();
    const lg = g.createRadialGradient(0, s * 0.08, 0, 0, s * 0.08, s * 0.16); lg.addColorStop(0, 'rgba(255,230,160,.8)'); lg.addColorStop(1, 'rgba(255,200,100,0)');
    g.fillStyle = lg; g.beginPath(); g.arc(0, s * 0.08, s * 0.16, 0, 7); g.fill();
    g.fillStyle = '#ffe08a'; g.fillRect(-s * 0.035, s * 0.03, s * 0.07, s * 0.09);
  } else { // 해결사의 칼 (보라빛 날)
    g.rotate(-0.7 + swing * 2.0);
    g.fillStyle = '#c9b6f0'; g.fillRect(-s * 0.015, -s * 0.58, s * 0.035, s * 0.56);
    g.fillStyle = 'rgba(150,100,255,.35)'; g.fillRect(-s * 0.04, -s * 0.58, s * 0.08, s * 0.56);
    g.fillStyle = '#1a1a1a'; g.fillRect(-s * 0.03, 0, s * 0.06, s * 0.12);
  }
  g.restore();
  g.restore();
}

/** 조직원 그리기: 하이에나, 들개 / 두목은 같은 체형을 크게 (기본 그림은 왼쪽을 봄) */
const BOSS_LOOK = [
  { kind: 'boar',   fur: '#5a4636', coat: '#3a2c24' },   // 멧돼지 두목
  { kind: 'bison',  fur: '#4a3a2e', coat: '#2b2a30' },   // 들소 집행관
  { kind: 'lizard', fur: '#4d5c4a', coat: '#1e1d24' },   // 도마뱀 회장
];
function drawEnemy(g, e, t) {
  const s = e.size, bl = BOSS_LOOK[Math.floor((S.stage - 1) / 10) % 3];
  g.save(); g.translate(e.x, e.y);
  if (e.face > 0) g.scale(-1, 1);
  // 맞으면 몸이 순간 부풀었다 돌아옴 (필터 대신)
  if (e.hit > 0) { const k = 1 + e.hit * (e.boss ? 0.5 : 1.2); g.scale(k, 2 - k); }
  g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0, 0, s * 0.32, s * 0.08, 0, 0, 7); g.fill();
  const kind = e.boss ? bl.kind : e.type, coat = e.boss ? bl.coat : kind === 'hyena' ? '#3b342c' : '#2d3038';
  const fur = e.boss ? bl.fur : kind === 'hyena' ? '#8a7558' : '#6e7078';
  const step = (e.walk ? Math.sin(t * 10 + e.ph) : Math.sin(t * 3 + e.ph) * 0.3) * s * 0.03;
  g.fillStyle = '#141418'; g.fillRect(-s * 0.12, -s * 0.2 + step, s * 0.09, s * 0.2); g.fillRect(s * 0.03, -s * 0.2 - step, s * 0.09, s * 0.2);
  g.fillStyle = coat; g.beginPath(); rr(g, -s * 0.19, -s * 0.58, s * 0.38, s * 0.42, s * 0.08); g.fill();
  if (kind === 'hyena') { g.fillStyle = '#2a2520'; g.beginPath(); g.arc(0, -s * 0.66, s * 0.22, Math.PI * 0.9, Math.PI * 2.1); g.fill(); }   // 후드
  // 머리 (왼쪽을 봄: 좌우를 뒤집어 그림)
  g.save(); g.scale(-1, 1);
  const hy = -s * 0.74, r = s * 0.19;
  g.fillStyle = fur; g.beginPath(); g.arc(0, hy, r, 0, 7); g.fill();
  if (kind === 'hyena') {
    g.beginPath(); g.arc(-s * 0.08, hy - s * 0.16, s * 0.07, 0, 7); g.fill();
    g.fillStyle = '#4a3c2c'; for (const [x, y] of [[-0.08, -0.02], [-0.02, 0.06], [0.02, -0.08]]) { g.beginPath(); g.arc(x * s, hy + y * s, s * 0.025, 0, 7); g.fill(); }
    g.fillStyle = '#3a3028'; g.beginPath(); g.ellipse(s * 0.15, hy + s * 0.05, r * 0.6, r * 0.42, 0, 0, 7); g.fill();
  } else if (kind === 'dog') {
    tri(g, [-s * 0.12, hy - s * 0.1], [-s * 0.08, hy - s * 0.3], [0, hy - s * 0.14]);
    g.fillStyle = '#8c8e96'; g.beginPath(); g.ellipse(s * 0.15, hy + s * 0.05, r * 0.62, r * 0.45, 0, 0, 7); g.fill();
  } else if (kind === 'boar') {
    g.fillStyle = '#6a5442'; g.beginPath(); g.ellipse(s * 0.17, hy + s * 0.05, r * 0.6, r * 0.5, 0, 0, 7); g.fill();
    g.fillStyle = '#e8e0cc'; tri(g, [s * 0.13, hy + s * 0.1], [s * 0.2, hy - s * 0.06], [s * 0.18, hy + s * 0.12]);
    g.fillStyle = fur; tri(g, [-s * 0.12, hy - s * 0.1], [-s * 0.06, hy - s * 0.26], [0, hy - s * 0.14]);
  } else if (kind === 'bison') {
    g.fillStyle = '#2a211b'; g.beginPath(); g.arc(-s * 0.04, hy - s * 0.04, r * 1.15, Math.PI * 0.6, Math.PI * 1.9); g.fill();   // 갈기
    g.strokeStyle = '#d8cfba'; g.lineWidth = s * 0.04; g.lineCap = 'round'; g.beginPath(); g.arc(s * 0.02, hy - s * 0.14, s * 0.1, Math.PI, Math.PI * 1.8); g.stroke();
    g.fillStyle = '#3a2e26'; g.beginPath(); g.ellipse(s * 0.15, hy + s * 0.06, r * 0.6, r * 0.5, 0, 0, 7); g.fill();
  } else { // lizard: 긴 주둥이와 왕관
    g.fillStyle = fur; g.beginPath(); g.ellipse(s * 0.17, hy + s * 0.04, r * 0.85, r * 0.42, 0, 0, 7); g.fill();
    g.fillStyle = '#b89a4a'; g.beginPath(); g.moveTo(-s * 0.12, hy - s * 0.15); g.lineTo(-s * 0.1, hy - s * 0.28); g.lineTo(-s * 0.04, hy - s * 0.2); g.lineTo(0, hy - s * 0.3); g.lineTo(s * 0.04, hy - s * 0.2); g.lineTo(s * 0.1, hy - s * 0.28); g.lineTo(s * 0.1, hy - s * 0.15); g.closePath(); g.fill();
  }
  g.fillStyle = kind === 'lizard' ? '#7dff9a' : e.boss ? '#ff5040' : '#e8d070';
  g.fillRect(s * 0.07, hy - s * 0.04, s * 0.045, s * 0.035);
  g.restore();
  // 무기: 일반은 쇠파이프, 두목은 큰 망치
  g.save(); g.translate(-s * 0.2, -s * 0.42); g.rotate(-0.5 - e.swing * 1.4);
  g.fillStyle = '#5a5d66'; g.fillRect(-s * 0.02, -s * 0.44, s * 0.04, s * 0.52);
  if (e.boss) { g.fillStyle = '#3a3c44'; g.fillRect(-s * 0.1, -s * 0.5, s * 0.2, s * 0.12); g.fillStyle = 'rgba(160,180,230,.25)'; g.fillRect(-s * 0.1, -s * 0.5, s * 0.2, s * 0.025); }
  g.restore();
  g.restore();
  // 체력 바 (두목은 위쪽 큰 바)
  if (!e.boss && e.hp < e.max) {
    const w = s * 0.6; g.fillStyle = '#300'; g.fillRect(e.x - w / 2, e.y - s * 1.0, w, 4);
    g.fillStyle = '#ff5a4a'; g.fillRect(e.x - w / 2, e.y - s * 1.0, w * Math.max(0, e.hp / e.max), 4);
  }
}

/* ---------- 지도 (위에서 내려다본 끝없는 들판) ----------
 * 좌표는 "지도 단위". 화면에는 u 배율(화면 높이 / 320)로 그린다.
 * 지도는 360단위 조각(청크)으로 나눠, 조각 좌표로 정해지는 난수로 장식을 만든다.
 * → 같은 자리는 언제 봐도 같은 모습이고, 지도는 끝없이 이어진다.
 */
const CH = 360;
const MAPW = 1000, MAPH = 1300, MAX_FIELD = 14;   // 지도 크기(단위), 지도 위 일반 조직원 최대 수
const FIELD = [
  // 1장 빗속 뒷골목: 젖은 돌바닥, 가로등, 상자와 드럼통, 쓰레기통, 세워 둔 차
  { ground: '#252c39', patch: '#2b3342', dark: '#1f252f', tree: '#1c242d', tree2: '#283340', rock: '#4a5365', kinds: ['lamp', 'lamp', 'crate', 'barrel', 'bin', 'car'], night: 0.08, fog: 0, cobble: 1, neon: 0, planks: 0 },

/* ---------- 스테이지 지도: 경계가 있는 넓은 들판 (화면 약 3×4개) ----------

/* ---------- 요원 행동 ---------- */

/* ---------- 메인 루프 ---------- */
let last = performance.now(), uiT = 0, saveT = 0, paused = true;
const modalEl = $('modal');
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {
    // 시작 화면이나 팝업이 떠 있는 동안은 전투를 멈춤 (보스 제한 시간 보호)
    if (!paused && !modalEl.classList.contains('on')) update(dt);
    if (g) draw();
    uiT += dt; if (uiT > 0.15) { uiT = 0; updateUI(); }
    saveT += dt; if (saveT > 5) { saveT = 0; writeSave(); }
  } catch (e) { console.error(e); toast('전투 처리 중 오류: ' + e.message); }
  requestAnimationFrame(loop);
}
function update(dt) {
  R.t += dt;
  R.buff = Math.max(0, R.buff - dt);
  if (R.mapStage !== S.stage) newMap();   // 스테이지가 바뀌면 새 지도
  // 전멸: 3초 뒤 그 자리에서 부활, 근처 조직원는 물러남(다시 배치)
  if (R.wipe > 0) {
    R.wipe -= dt;
    if (R.wipe <= 0) { syncHeroes(true); R.enemies = R.enemies.filter(e => dist(e, R.A) > 300 && !e.boss); for (const e of R.enemies) e.aggro = false; for (const h of owned()) Object.assign(R.heroes[h.id], formSlot(h.id)); }
    return;
  }

  const live = R.enemies.length > 0;
  // 조직원 보충: 지도 위 일반 조직원가 줄면 다른 곳에 새 무리. 처치 수가 차면 보스 등장

  if (!R.boss && !S.farming && S.kills >= C.CONST.WAVE_KILLS) spawnBoss();
  // 파티 기준점: 싸우는 중이면 요원들 가운데, 아니면 지도에서 가장 가까운 무리(보스가 있으면 보스)를 향해 이동
  const hs = alive();

  R.fighting = !!fighting;
  if (fighting) {

    R.A.x += (mx / hs.length - R.A.x) * Math.min(1, dt * 2); R.A.y += (my / hs.length - R.A.y) * Math.min(1, dt * 2);
  } else {
    let tp = R.boss || nearestEnemy(R.A, Infinity);
    if (!tp) { if (!R.roam || dist(R.A, R.roam) < 20) R.roam = randPoint(120); tp = R.roam; }   // 조직원가 없으면 지도 산책
    const dx = tp.x - R.A.x, dy = tp.y - R.A.y;

  }

  for (const h of hs) heroAct(h, R.heroes[h.id], dt);

  for (const p of R.proj) {

    g.rotate(performance.now() / 80);
    g.fillStyle = '#3d5a3a'; g.fillRect(-3, -5, 6, 10);
    const fl = g.createRadialGradient(0, -7, 0, 0, -7, 9); fl.addColorStop(0, '#fff2c0'); fl.addColorStop(0.5, '#ff8a2e'); fl.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = fl; g.beginPath(); g.arc(0, -7, 9, 0, 7); g.fill();
  } else { // 진정제 침
    g.strokeStyle = '#dfe6f2'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-10, 0); g.lineTo(4, 0); g.stroke();
    g.fillStyle = '#c8323c'; g.fillRect(-12, -1.5, 4, 3);
  }
  g.restore();
}
function drawFx(f) {
  if (f.k === 'coin') { g.save(); g.translate(f.x, f.y); g.scale(Math.abs(Math.cos(f.life * 12)) + 0.2, 1); g.fillStyle = '#f5c451'; g.strokeStyle = '#8a5609'; g.lineWidth = 1.2; g.beginPath(); g.arc(0, 0, 4.5, 0, 7); g.fill(); g.stroke(); g.restore(); }
  else if (f.k === 'slash') { g.strokeStyle = f.col; g.globalAlpha = f.life * 5; g.lineWidth = 4; g.beginPath(); if (f.face < 0) g.arc(f.x + f.r * 0.4, f.y, f.r, Math.PI - 0.9, Math.PI + 1); else g.arc(f.x - f.r * 0.4, f.y, f.r, -1, 0.9); g.stroke(); g.globalAlpha = 1; }
  else if (f.k === 'burst') { const p = 1 - f.life / 0.45; g.globalAlpha = Math.max(0, f.life * 2.4); const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (0.5 + p)); gr.addColorStop(0, '#fff'); gr.addColorStop(0.35, f.col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, f.r * (0.5 + p), 0, 7); g.fill(); g.globalAlpha = 1; }
  else if (f.k === 'ring') { const p = 1 - f.life / 0.6; g.globalAlpha = Math.max(0, f.life * 1.6); g.strokeStyle = f.col; g.lineWidth = 4; g.beginPath(); g.ellipse(f.x, f.y, f.r * (0.3 + p), f.r * (0.3 + p) * 0.55, 0, 0, 7); g.stroke(); g.globalAlpha = 1; }
}
function drawBossBar() {
  const b = R.boss, x = 12, y = 12, w = W - 24, h = 14;
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x - 2, y - 2, w + 4, h + 22);
  g.fillStyle = '#3a0c0c'; g.fillRect(x, y + 18, w, h);
  g.fillStyle = '#e84a3a'; g.fillRect(x, y + 18, w * Math.max(0, b.hp / b.max), h);
  g.textAlign = 'left'; g.font = '14px "Black Han Sans"'; g.fillStyle = '#fff'; g.fillText(theme().boss, x + 2, y + 13);
  g.textAlign = 'right'; g.fillStyle = R.bossT < 10 ? '#ff6b5b' : '#ffd98a'; g.fillText(`${Math.ceil(R.bossT)}초`, x + w - 2, y + 13);
}

/* ---------- 초상화 (캔버스로 한 번 그려서 재사용) ---------- */
const portraitCache = {};
function portrait(id) {
  if (portraitCache[id]) return portraitCache[id];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const p = c.getContext('2d'); if (!p) return '';
  const bg = p.createLinearGradient(0, 0, 0, 128); bg.addColorStop(0, shade(LOOK[id].coat, 45)); bg.addColorStop(1, '#1C212B');
  p.fillStyle = bg; p.fillRect(0, 0, 128, 128);
  drawHero(p, id, 56, 190, 200, 0, 0.15, 0);
  return (portraitCache[id] = c.toDataURL());
}

/* ---------- UI: HUD와 파티 ---------- */
let partyKey = '';
function renderParty() {
  const list = owned(), slots = [];
  for (let i = 0; i < 5; i++) {
    const h = list[i];
    slots.push(h ? `<div class="slot" id="sl-${h.id}"><img src="${portrait(h.id)}" alt="${h.name}"><div class="cd"></div><div class="hp"><i></i></div></div>` : `<div class="slot empty" title="소환으로 합류">+</div>`);
  }
  $('party').innerHTML = slots.join('');
}
function updateUI() {
  $('stage').textContent = C.stageLabel(S.stage);
  $('area').textContent = theme().name;
  $('gold').textContent = C.formatNum(S.gold);
  $('gems').textContent = C.formatNum(S.gems);
  const bar = $('prog').firstElementChild, lab = $('prog').lastElementChild;
  if (R.boss) { bar.className = 'boss'; bar.style.width = (100 * Math.max(0, R.boss.hp / R.boss.max)) + '%'; lab.textContent = '두목전'; }
  else if (S.farming) { bar.className = ''; bar.style.width = '100%'; lab.textContent = '반복 사냥'; }
  else { bar.className = ''; bar.style.width = (100 * S.kills / C.CONST.WAVE_KILLS) + '%'; lab.textContent = `${S.kills} / ${C.CONST.WAVE_KILLS}`; }
  $('bossBtn').style.display = S.farming && !R.boss ? 'block' : 'none';
  const key = owned().map(h => h.id).join();
  if (key !== partyKey) { partyKey = key; renderParty(); }
  for (const h of owned()) {
    const el = $('sl-' + h.id), r = R.heroes[h.id]; if (!el || !r) continue;
    el.style.setProperty('--cd', Math.max(0, r.cd / h.skill.cd).toFixed(3));
    el.style.setProperty('--hp', (100 * Math.max(0, r.hp / r.max)).toFixed(1) + '%');
    el.classList.toggle('ready', r.cd <= 0.15 && r.hp > 0);
    el.classList.toggle('dead', r.hp <= 0);
  }
  updatePanel();
}

/* ---------- UI: 패널 ---------- */
let tab = 'hero', bulk = 1;
const icon = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const starStr = n => '★'.repeat(n) + `<s>${'★'.repeat(C.CONST.MAX_STARS - n)}</s>`;

function renderPanel() {
  const P = $('panel');
  if (tab === 'hero') {
    P.innerHTML = `<div class="seg">${[[1, '1회'], [10, '10회'], [0, '최대']].map(([v, l]) => `<button data-act="bulk" data-v="${v}" class="${bulk === v ? 'on' : ''}">${l}</button>`).join('')}</div>` +
      C.HEROES.map(h => {
        const d = S.heroes[h.id];
        if (!d.owned) return `<div class="card locked"><img class="pt" src="${portrait(h.id)}" alt=""><div><div class="nm"><b>${h.name}</b><span class="role">${h.role}</span><span class="gr g-${h.grade}">${h.grade}</span></div><div class="hint">소환에서 만날 수 있어요</div></div><div class="st">미보유</div></div>`;
        return `<div class="card" data-h="${h.id}"><img class="pt" src="${portrait(h.id)}" alt="">
          <div><div class="nm"><b>${h.name}</b><span class="role">${h.role}</span><span class="gr g-${h.grade}">${h.grade}</span></div>
          <div class="stars">${starStr(d.stars)}</div>
          <div class="stat"><span>Lv.<em class="lv"></em></span><span>공격력 <em class="atk"></em></span></div></div>
          <button class="btn" data-act="lv" data-h="${h.id}"><span class="bl">강화</span><span class="cost">${icon('gold')}<i></i></span></button>
          <div class="shard"><div class="bar"><i></i></div><span class="st"></span><button class="btn sm blue" data-act="star" data-h="${h.id}">승급</button></div></div>`;
      }).join('');
  } else if (tab === 'train') {
    const ic = { atk: 'sword', gold: 'gold', crit: 'target' };
    P.innerHTML = C.UPGRADES.map(u => `<div class="urow" data-u="${u.id}"><div class="uic"><svg><use href="#i-${ic[u.id]}"/></svg></div>
      <div><div class="ut">${u.name}</div><div class="uv"></div></div>
      <button class="btn" data-act="up" data-u="${u.id}"><span>강화</span><span class="cost">${icon('gold')}<i></i></span></button></div>`).join('') +
      `<h3>시험용 도구</h3>
      <div class="urow"><div class="uic"><svg><use href="#i-gold"/></svg></div><div><div class="ut">자리 비움 보상</div><div class="uv">1시간 비운 것처럼 받아 보기</div></div><button class="btn ghost" data-act="testOff">받아 보기</button></div>
      <div class="urow"><div class="uic"><svg><use href="#i-target"/></svg></div><div><div class="ut">처음부터 다시</div><div class="uv">저장된 진행을 모두 지워요</div></div><button class="btn ghost" data-act="reset">초기화</button></div>`;
  } else {
    P.innerHTML = `<div class="sbanner"><canvas id="sbc"></canvas><div class="tt"><b>AIU 요원 소환</b><span>전설 ${C.heroById('dark').role} ${C.heroById('dark').name} 확률 ${Math.round(C.CONST.LEGEND_RATE * 100)}%</span></div></div>
      <div class="srow"><button class="btn blue" data-act="sum" data-n="1"><span>1회 소환</span><span class="cost">${icon('gem')}${C.CONST.SUMMON_COST_1}</span></button>
      <button class="btn" data-act="sum" data-n="10"><span>10회 소환</span><span class="cost">${icon('gem')}${C.CONST.SUMMON_COST_10}</span></button></div>
      <div class="rates"><div><span>전설 ${C.heroById('dark').name}</span><b>${(C.CONST.LEGEND_RATE * 100).toFixed(1)}%</b></div>${C.STARTER_IDS.map(id => `<div><span>${C.heroById(id).grade} ${C.heroById(id).name}</span><b>${((1 - C.CONST.LEGEND_RATE) / 4 * 100).toFixed(2)}%</b></div>`).join('')}</div>
      <p class="hint" style="margin:10px 2px">이미 있는 요원이 나오면 조각이 되고, 조각을 모아 승급하면 능력치가 크게 올라요. 보석은 두목을 잡으면 ${C.CONST.BOSS_GEMS}개씩 얻어요.</p>`;
    drawSummonBanner();
  }
  updatePanel();
}
function drawSummonBanner() {
  const c = $('sbc'); if (!c) return;
  const w = c.clientWidth || 360, h = c.clientHeight || 170, d = Math.min(3, devicePixelRatio || 1);
  c.width = w * d; c.height = h * d;
  const p = c.getContext('2d'); if (!p) return; p.scale(d, d);
  const bg = p.createRadialGradient(w * 0.72, h * 0.5, 0, w * 0.72, h * 0.5, w * 0.6); bg.addColorStop(0, '#3b2c5c'); bg.addColorStop(1, '#0b0d12');
  p.fillStyle = bg; p.fillRect(0, 0, w, h);
  p.strokeStyle = 'rgba(185,200,240,.18)'; p.lineWidth = 1; for (let i = 0; i < 46; i++) { const x = (i * 97) % w, y = (i * 53) % h; p.beginPath(); p.moveTo(x, y); p.lineTo(x - 3, y + 12); p.stroke(); }
  drawHero(p, 'dark', w * 0.74, h * 1.02, h * 0.95, 1, 0.3, 0);
}
function updatePanel() {
  const P = $('panel');
  if (tab === 'hero') {
    for (const card of P.querySelectorAll('.card[data-h]')) {
      const id = card.dataset.h, d = S.heroes[id];
      card.querySelector('.lv').textContent = d.lv;
      card.querySelector('.atk').textContent = C.formatNum(C.heroAtk(id, d.lv, d.stars, S.up.atk));
      const { n, cost } = lvPlan(d.lv);
      const btn = card.querySelector('[data-act=lv]');
      btn.querySelector('.bl').textContent = bulk === 1 ? '강화' : `강화 +${Math.max(n, bulk === 0 ? 1 : bulk)}`;
      btn.querySelector('.cost i').textContent = C.formatNum(cost);
      btn.disabled = !(n > 0 && cost <= S.gold);
      const need = C.starNeed(d.stars), max = need === Infinity;
      card.querySelector('.bar i').style.width = max ? '100%' : Math.min(100, 100 * d.shards / need) + '%';
      card.querySelector('.st').textContent = max ? '최고 등급' : `조각 ${d.shards} / ${need}`;
      card.querySelector('[data-act=star]').disabled = max || d.shards < need;
    }
  } else if (tab === 'train') {
    for (const row of P.querySelectorAll('.urow[data-u]')) {
      const id = row.dataset.u, lv = S.up[id], cost = C.upgradeCost(id, lv);
      row.querySelector('.uv').innerHTML = id === 'crit' ? `Lv.${lv}  현재 <em>${Math.round(C.critChance(lv) * 100)}%</em>` : `Lv.${lv}  현재 <em>+${lv * 10}%</em>`;
      const btn = row.querySelector('button');
      btn.querySelector('.cost i').textContent = cost === Infinity ? '최대' : C.formatNum(cost);
      btn.disabled = cost === Infinity || cost > S.gold;
    }
  } else {
    for (const b of P.querySelectorAll('[data-act=sum]')) b.disabled = S.gems < (b.dataset.n === '10' ? C.CONST.SUMMON_COST_10 : C.CONST.SUMMON_COST_1);
  }
  // 탭 알림 점: 할 수 있는 강화가 있을 때
  $('dotHero').style.display = owned().some(h => C.heroLvCost(S.heroes[h.id].lv) <= S.gold || S.heroes[h.id].shards >= C.starNeed(S.heroes[h.id].stars)) && tab !== 'hero' ? 'block' : 'none';
  $('dotTrain').style.display = C.UPGRADES.some(u => C.upgradeCost(u.id, S.up[u.id]) <= S.gold) && tab !== 'train' ? 'block' : 'none';
}
/** 일괄 강화 계획: 1회/10회는 정해진 단계, 최대는 살 수 있는 만큼 */
function lvPlan(lv) {
  if (bulk === 0) { const r = C.heroLvAffordable(lv, S.gold, 1000); return r.n > 0 ? r : { n: 1, cost: C.heroLvCost(lv) }; }
  return { n: bulk, cost: C.heroLvCostBulk(lv, bulk) };
}

/* ---------- 입력 ---------- */
$('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  try {
    if (act === 'bulk') { bulk = +b.dataset.v; renderPanel(); }
    else if (act === 'lv') {
      const d = S.heroes[b.dataset.h], { n, cost } = lvPlan(d.lv);
      if (cost > S.gold) return toast('골드가 부족해요');
      S.gold -= cost; d.lv += n; syncHeroes(false);
    } else if (act === 'star') {
      const d = S.heroes[b.dataset.h], need = C.starNeed(d.stars);
      if (d.shards < need) return;
      d.shards -= need; d.stars++; syncHeroes(false); banner(`${C.heroById(b.dataset.h).name} ★${d.stars} 승급`); renderPanel();
    } else if (act === 'up') {
      const id = b.dataset.u, cost = C.upgradeCost(id, S.up[id]);
      if (cost > S.gold) return toast('골드가 부족해요');
      S.gold -= cost; S.up[id]++;
    } else if (act === 'sum') doSummon(+b.dataset.n);
    else if (act === 'testOff') showOffline(C.offlineReward(S, 3600));
    else if (act === 'reset') confirmReset();
    updateUI(); writeSave();
  } catch (err) { console.error(err); toast('처리하지 못했어요: ' + err.message); }
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  for (const x of $('tabs').children) x.classList.toggle('on', x === b);
  renderPanel(); $('panel').scrollTop = 0;
});
$('bossBtn').addEventListener('click', () => { S.farming = false; S.kills = C.CONST.WAVE_KILLS; R.enemies = []; R.boss = null; updateUI(); });

/* ---------- 영입 ---------- */
function doSummon(n) {
  const cost = n === 10 ? C.CONST.SUMMON_COST_10 : C.CONST.SUMMON_COST_1;
  if (S.gems < cost) return toast('보석이 부족해요');
  const ids = C.summon(n, Math.random);
  const res = C.applySummon(S, ids);
  res.state.gems -= cost; S = res.state;
  syncHeroes(false); writeSave();
  openModal(`<h2>소환 결과</h2><div class="res ${n === 1 ? 'one' : ''}">${ids.map((id, i) => {
    const h = C.heroById(id);
    return `<div class="rc ${h.grade === '전설' ? 'leg' : ''}" style="animation-delay:${i * 0.07}s"><img src="${portrait(id)}" alt=""><small>${h.name}</small>${res.isNew[i] ? '<span class="new">NEW</span>' : ''}</div>`;
  }).join('')}</div><p>${res.isNew.some(Boolean) ? '새 요원이 AIU에 합류했어요' : '조각은 요원 탭에서 승급에 써요'}</p><div class="mbtns"><button class="btn" data-close>확인</button></div>`);
  renderPanel();
}

/* ---------- 모달 ---------- */
function openModal(html, onClose) {
  const m = $('modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.add('on');
  m.onclick = e => { const b = e.target.closest('[data-close]'); if (!b) return; m.classList.remove('on'); if (onClose) onClose(b.dataset.close); };
}
function showOffline(r) {
  if (!r || r.gold <= 0) { if (r) toast('받을 보상이 없어요'); return; }
  openModal(`<h2>자리를 비운 동안</h2><p>요원들이 ${C.formatDuration(r.sec)} 동안 조직원 ${C.formatNum(r.kills)}명을 검거했어요</p>
    <div class="big">${icon('gold')}<span>${C.formatNum(r.gold)}</span></div><p class="hint">최대 8시간까지 쌓여요</p>
    <div class="mbtns"><button class="btn" data-close="ok">받기</button></div>`, () => { S.gold += r.gold; writeSave(); updateUI(); banner('보상 획득'); });
}
function confirmReset() {
  openModal(`<h2>처음부터 다시</h2><p>골드, 요원, 스테이지가 모두 지워져요</p><div class="mbtns"><button class="btn ghost" data-close="no">취소</button><button class="btn" data-close="yes" style="background:linear-gradient(#ff7a6b,#c7332a);color:#fff;box-shadow:0 3px 0 #6d1510">초기화</button></div>`, v => {
    if (v !== 'yes') return;
    S = C.newState(Date.now()); R.heroes = {}; R.enemies = []; R.proj = []; R.boss = null; R.mapStage = 0; syncHeroes(true); writeSave(); renderPanel(); toast('새 게임을 시작했어요');
  });
}

/* ---------- 앱 생명주기: 숨김 → 복귀 시 오프라인 보상 ---------- */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); writeSave(); }
  else if (hiddenAt) { const r = C.offlineReward(S, (Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); if (r.gold > 0) showOffline(r); }
});
window.addEventListener('pagehide', writeSave);

/* ---------- 시작 ---------- */
const pending = firstRun ? null : C.offlineReward(S, (Date.now() - S.lastSeen) / 1000);
syncHeroes(true); renderPanel(); updateUI();
let started = false;
function startGame() {
  if (started) return; started = true;
  $('splash').style.display = 'none'; paused = false; last = performance.now();
  if (pending && pending.gold > 0) showOffline(pending);
  else if (firstRun) banner('출동');
}
$('splash').addEventListener('click', startGame);
$('sp-lineup').innerHTML = ['knight', 'dark', 'priest'].map(id => `<img src="${portrait(id)}" alt="">`).join('');
[[30, '비 내리는 중'], [65, '요원 호출하는 중'], [100, '구역 지도 펼치는 중']].forEach(([w, m], i) => setTimeout(() => {
  if (started) return; $('sp-fill').style.width = w + '%'; $('sp-msg').textContent = m;
}, 250 + i * 650));
setTimeout(startGame, 2500);
requestAnimationFrame(loop);
}
</script>
</body>
</html>
