<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 수사 3팀과 같은 누아르, 비 오는 밤의 범죄 액션, 모바일 방치형
   IDEA: 이상현상 전담수사팀 요원들이 비 내리는 도시 구역을 돌아다니며 이상체를 처리
   PICTURE: 상단 전투 캔버스(구역 지도, 요원, 이상체, 근원체)
   COLOUR and TYPE: 깊은 남색 패널 + 금색 테두리 + 진홍 강조 / Black Han Sans 제목, Noto Sans KR 본문
   LAYOUT: 세로 고정. HUD → 전투 → 파티 슬롯 → 탭 패널 → 하단 탭 */
/* 색은 수사 3팀과 같은 값 (--ink 는 여기서 글자색) */
:root{--bg:#0F1422;--panel:#1A2131;--panel2:#232C40;--line:#2F3A52;--gold:#F2C94C;--gold2:#2F3A52;--red:#E0503E;--rift:#9D7BFF;--ink:#E6E9F2;--dim:#8F9AB0;--ok:#5BD08A;--r:6px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;margin:0;height:100%;background:#080B13;color:var(--ink);font:15px/1.4 'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.num{font-family:"Black Han Sans",sans-serif;letter-spacing:.01em}

/* HUD: 왼쪽은 구역 번호와 진행, 오른쪽은 재화. 진행 숫자는 막대 밖 오른쪽에 둠 */
#hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 9px;background:var(--bg);border-bottom:1px solid var(--line)}
#stageBox{flex:1}
#stageRow{display:flex;align-items:baseline;gap:8px}
#stage{font-family:"Black Han Sans";font-size:26px;color:var(--gold);line-height:1;letter-spacing:.01em}
#area{font-size:13px;font-weight:600;color:var(--dim)}
#prog{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:6px}
#prog::before{content:"";grid-column:1;grid-row:1;height:6px;border-radius:3px;background:#070A11;box-shadow:inset 0 0 0 1px var(--line)}
#prog i{grid-column:1;grid-row:1;height:6px;border-radius:3px;background:var(--gold);transition:width .2s;justify-self:start}
#prog i.boss{background:var(--red)}
#prog span{grid-column:2;grid-row:1;font:400 12px "Black Han Sans";color:var(--ink);white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 7px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-family:"Black Han Sans";font-size:15px;white-space:nowrap}

/* 전투 */
#battle{position:relative;flex:0 0 auto;height:45vh;height:45dvh;min-height:260px;max-height:430px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossBtn{position:absolute;left:10px;top:10px;display:none;padding:8px 14px;border-radius:10px;border:0;background:var(--red);color:#fff;font-family:"Black Han Sans";font-size:15px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* 기술 컷인: 비스듬한 띠에 요원 일러스트가 휙 지나감 (CSS 애니메이션, 1.1초) */
#cutin{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
#cutin .ci{position:absolute;left:-10%;right:-10%;top:30%;height:30%;transform:skewY(-7deg);opacity:0;overflow:hidden;border-top:2px solid var(--ci,#fff);border-bottom:2px solid var(--ci,#fff);box-shadow:0 0 18px var(--ci,#fff);background:#000}
#cutin .ci.go{animation:ciBand 1.1s cubic-bezier(.2,.8,.2,1) forwards}
#cutin .ci img{position:absolute;inset:-20% 0;width:100%;height:140%;object-fit:cover;transform:skewY(7deg)}
#cutin .ci.go img{animation:ciPan 1.1s linear forwards}
#cutin .ci::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,0) 45%)}
#cutin .ci-t{position:absolute;z-index:1;left:14%;top:50%;transform:translateY(-50%) skewY(7deg)}
#cutin .ci-t b{display:block;font:400 26px "Black Han Sans";color:#fff;text-shadow:0 2px 0 #000,0 0 12px var(--ci,#fff);letter-spacing:.02em}
#cutin .ci-t small{display:block;margin-top:2px;font:600 10px 'IBM Plex Sans KR',sans-serif;letter-spacing:.3em;color:var(--ci,#fff)}
@keyframes ciBand{0%{opacity:0;transform:skewY(-7deg) translateX(-60%)}14%{opacity:1;transform:skewY(-7deg) translateX(0)}78%{opacity:1;transform:skewY(-7deg) translateX(0)}100%{opacity:0;transform:skewY(-7deg) translateX(40%)}}
@keyframes ciPan{from{transform:skewY(7deg) translateX(-3%) scale(1.06)}to{transform:skewY(7deg) translateX(3%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){#cutin{display:none}}
#banner{position:absolute;left:0;right:0;top:36%;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(18,21,28,.82) 20%,rgba(18,21,28,.82) 80%,transparent);text-align:center;font-family:"Black Han Sans";font-size:30px;color:#fff;color:var(--gold);text-shadow:0 2px 0 #000;opacity:0;pointer-events:none;transition:opacity .3s}

/* 파티 칸: 세나 키우기 같은 완성 게임처럼 얼굴 그림 위에는 아무것도 덮지 않음
 * 기술 대기는 테두리를 시계 방향으로 채우는 고리(보라, 다 차면 금색), 체력은 그림 아래 얇은 줄 */
#party{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:8px 10px 7px;background:var(--bg);border-bottom:1px solid var(--line)}
.slot{position:relative}
.slot .face{position:relative;aspect-ratio:1;padding:2.5px;border-radius:var(--r);background:conic-gradient(var(--rift) calc((1 - var(--cd,0)) * 360deg),var(--line) 0)}
.slot .face img{display:block;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - 2px)}
.slot.ready .face{background:var(--gold);box-shadow:0 0 10px rgba(242,201,76,.55)}
.slot .hp{height:4px;margin-top:4px;border-radius:2px;background:#3a1010;overflow:hidden}
.slot .hp i{display:block;height:100%;background:var(--ok);width:var(--hp,100%)}
.slot.dead .face img{filter:grayscale(1) brightness(.5)}
.slot.dead .face{background:var(--line)}
.slot.empty{aspect-ratio:1;display:grid;place-items:center;color:var(--dim);font-size:22px;border:1px dashed var(--line);border-radius:var(--r)}

/* 패널 */
#panel{flex:1;overflow-y:auto;padding:10px 10px 18px;background:var(--bg)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
#tabs button{height:54px;border:0;background:none;color:var(--dim);font:700 15px 'IBM Plex Sans KR';position:relative}
#tabs button.on{color:var(--gold);background:linear-gradient(rgba(242,201,76,.08),rgba(242,201,76,0))}
#tabs button.on::after{content:"";position:absolute;left:30%;right:30%;top:-1px;height:2px;background:var(--gold)}
.dot{position:absolute;top:10px;right:calc(50% - 30px);width:7px;height:7px;border-radius:50%;background:var(--red);display:none}

/* 강화 횟수 고르기: 한 덩어리 막대 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{height:34px;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 13px 'IBM Plex Sans KR'}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--panel2);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}

/* 요원 카드 = 인사 파일: 왼쪽에 세로 증명사진(카드 높이 전체), 사진 위에 등급 도장 */
.card{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) auto;column-gap:12px;align-items:center;margin-bottom:8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.card .ph{grid-row:1 / span 2;align-self:stretch;position:relative;min-height:112px;background:var(--bg);border-right:1px solid var(--line)}
.card .pt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.card .ph::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc,var(--line))}
.card.locked .pt{filter:grayscale(1) brightness(.4)}
.card .info{padding:10px 0 0}
.nm{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.nm b{font:400 20px/1.1 "Black Han Sans";letter-spacing:.01em}
.role{font-size:12px;font-weight:600;color:var(--dim)}
.card > .btn{margin:10px 10px 0 0}
/* 등급 도장: 시작 화면의 '위험 등급' 도장과 같은 말투 */
.gr{position:absolute;z-index:1;left:6px;bottom:6px;padding:1px 5px;border:1.5px solid currentColor;border-radius:3px;font:700 10px/1.3 'IBM Plex Sans KR',sans-serif;letter-spacing:.06em;transform:rotate(-8deg);background:rgba(10,13,20,.72)}
.g-희귀{color:#8FB8F0}.g-영웅{color:#C2A6FF}.g-전설{color:var(--gold)}
.c-희귀{--gc:#5B86C4}.c-영웅{--gc:var(--rift)}.c-전설{--gc:var(--gold)}
.stars{margin-top:3px;color:var(--gold);font-size:12px;letter-spacing:1px}
.stars s{color:#36405A;text-decoration:none}
.stat{display:flex;gap:12px;margin-top:2px;font-size:12px;color:var(--dim);white-space:nowrap}
.stat em{font-style:normal;color:var(--ink);font:400 14px "Black Han Sans";margin-left:2px}
.shard{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px 10px 0}
.bar{height:5px;border-radius:3px;background:#070A11;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--rift)}
.st{font-size:12px;color:var(--dim);white-space:nowrap}
.st b{font:400 13px "Black Han Sans";color:var(--ink)}
.card.locked .info{padding:0}
.card.locked{min-height:72px}

/* 버튼: 금색 = 주 행동, 보라 테두리 = 승급, 테두리만 = 보조 */
.btn{min-width:92px;min-height:46px;padding:4px 10px;border-radius:var(--r);border:0;background:var(--gold);color:#141824;font:700 14px 'IBM Plex Sans KR';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn .cost i{font-style:normal}
.btn .cost{display:flex;align-items:center;gap:3px;font-family:"Black Han Sans";font-weight:400;font-size:14px}
.btn:disabled{background:var(--panel2);color:#5F6878;box-shadow:none}
.btn.sm{min-width:60px;min-height:32px;font-size:13px}
.btn.blue{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.blue:disabled{background:transparent;color:#5F6878;box-shadow:inset 0 0 0 1px var(--line)}
.btn.rift{background:transparent;color:#CDB8FF;box-shadow:inset 0 0 0 1.5px var(--rift)}
.btn.rift:not(:disabled){background:rgba(157,123,255,.14)}
.btn.rift:disabled{color:#5F6878;box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:12px;color:var(--dim);line-height:1.55}
h3{margin:18px 2px 8px;font:400 16px "Black Han Sans";color:var(--dim)}

/* 훈련소 줄 */
.urow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;margin-bottom:8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.uic{width:44px;height:44px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.uic svg{width:26px;height:26px}
.ut{font:400 17px "Black Han Sans"}
.uv{margin-top:2px;font-size:12px;color:var(--dim)}
.uv em{font-style:normal;color:var(--ok);font-weight:700}

.sbanner{position:relative;height:170px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#080B13}
.sbanner canvas{position:absolute;inset:0;width:100%;height:100%}
.sbanner .tt{position:absolute;left:14px;bottom:12px;right:14px}
.sbanner .tt b{display:block;font:400 28px "Black Han Sans";color:#fff;text-shadow:0 2px 0 #000}
.sbanner .tt span{font-size:13px;font-weight:600;color:var(--gold)}
.sbanner.small{height:124px}
.sbanner .tag{position:absolute;left:12px;top:12px;padding:1px 6px;border:1.5px solid var(--red);border-radius:3px;color:#FF8A78;background:rgba(10,13,20,.7);font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.06em;transform:rotate(-6deg)}
.sbanner .left{position:absolute;right:12px;top:12px;padding:2px 8px;border-radius:var(--r);background:rgba(10,13,20,.75);color:var(--ink);font-size:12px;white-space:nowrap}
.sgap{height:18px}
.rtable{width:100%;margin-top:14px;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rtable th,.rtable td{padding:7px 12px;text-align:right;white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable th{color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);background:var(--panel2)}
.rtable td{font-family:"Black Han Sans";font-size:14px}
.rtable td:first-child{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:600}
.rtable tr + tr td{border-top:1px solid rgba(47,58,82,.5)}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.srow .btn{min-height:56px;font-size:15px}
.rates{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.rates div{display:flex;justify-content:space-between;padding:2px 0}

/* 모달 */
#modal{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(8,9,12,.78)}
#modal.on{display:grid}
.mbox{width:100%;max-width:360px;padding:20px 18px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;box-shadow:0 10px 40px #000}
.mbox h2{margin:0 0 6px;font:400 22px "Black Han Sans";color:var(--gold)}
.mbox p{margin:4px 0;color:var(--dim)}
.big{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0;font:400 34px "Black Han Sans";color:#fff}
.mbtns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.mbtns .btn{flex:1}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.res.one{grid-template-columns:90px;justify-content:center}
.rc{position:relative;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:3px 3px 5px;opacity:0;transform:scale(.6);animation:pop .35s forwards}
.rc img{width:100%;aspect-ratio:1;display:block;border-radius:7px}
.rc.leg{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,63,.6)}
.rc small{display:block;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rc .new{position:absolute;top:-6px;right:-4px;padding:0 5px;border-radius:6px;background:var(--red);color:#fff;font:400 11px "Black Han Sans"}
@keyframes pop{to{opacity:1;transform:none}}

/* 시작 화면 */
/* 시작 화면: 수사 3팀 로딩 화면과 같은 구성 (부제, 큰 제목, 그림 줄, 불러오기 줄, 건너뛰기 안내) */
#splash{position:absolute;inset:0;z-index:30;background:var(--bg)}
#spbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sp-game{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 20vh) 24px 24px;gap:22px}
/* AIU 로고 */
.aiu{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.aiu-mark{width:min(64vw,236px);height:auto;display:block;overflow:visible}
.aiu .rift{animation:rift 3.2s infinite}
@keyframes rift{0%,100%{opacity:.95}46%{opacity:.95}48%{opacity:.25}50%{opacity:1}52%{opacity:.4}54%{opacity:.95}}
.aiu-stamp{position:absolute;right:-14px;top:-14px;padding:3px 7px;border:2px solid #E0503E;border-radius:4px;color:#E0503E;font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.12em;transform:rotate(12deg);opacity:.88;background:rgba(18,21,28,.6)}
.aiu-en{margin-top:4px;font:600 9px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.42em;margin-right:-.42em;color:var(--dim)}
.aiu-ko{display:flex;align-items:center;gap:10px;font:600 14px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.22em;color:var(--ink)}
.aiu-ko span{margin-right:-.22em}
.aiu-ko i{display:block;width:22px;height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){.aiu .rift{animation:none}}
.sp-sub{font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--dim)}
.sp-title{font-family:'Black Han Sans',sans-serif;font-size:60px;line-height:1;color:var(--gold);text-align:center}
.sp-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;align-items:center;gap:10px}
.sp-load{width:200px;display:flex;flex-direction:column;gap:8px;align-items:center}
.sp-bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sp-bar{position:relative}
/* 로딩 바: 매 프레임 width 를 직접 바꿔 부드럽게 차오름 (transition 없음), 끝에 작은 빛 */
.sp-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(255,210,63,.7)}
.sp-msg{font-size:12px;color:var(--dim);min-height:16px}
.sp-msg.ready{font-weight:600;letter-spacing:.32em;margin-right:-.32em;color:var(--gold)}
.sp-skip{font-size:11px;color:var(--dim);opacity:.6;margin-top:6px}
/* 불러오기가 끝나면: 접속 안내가 또렷하게 깜빡임 */
.sp-skip.ready{font-size:14px;font-weight:600;letter-spacing:.2em;margin-right:-.2em;color:var(--ink);opacity:1;animation:tapBlink 1.4s ease-in-out infinite}
@keyframes tapBlink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sp-skip.ready{animation:none}}
/* 제작사 표기: 수사 3팀 .sp-brand 와 같은 값 (bottom 12px, gap 4px, 8px 글씨, 로고 108px, margin-top -7px) */
#splash .by{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px}
#splash .by small{font-family:'IBM Plex Sans KR',sans-serif;font-size:8px;font-weight:600;letter-spacing:.32em;color:#A3ACBA}
#splash .by .sp-logo{width:min(28vw,108px);height:auto;display:block;margin-top:-7px}
#toast{position:absolute;left:50%;top:70px;z-index:40;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.85);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#bossBtn{animation:none}}
</style>
</head>
<body>
<!-- 재화 아이콘 (글자 도형 대신 항상 이 아이콘을 사용) -->
<svg width="0" height="0" style="position:absolute">
  <defs>

<script>
{
'use strict';
/* ============================================================
 * AIU (이상현상 전담수사팀) — 화면과 전투 (core.js 의 규칙을 사용)
 *  구조: 저장 상태 S(영구) / 전투 상태 R(일시) / 그리기 / UI 패널
 * ============================================================ */
const C = window.Core;
if (!C) { document.body.textContent = '게임 규칙을 불러오지 못했습니다.'; throw new Error('Core 없음'); }
const $ = id => document.getElementById(id);
const SAVE_KEY = 'lamp-knights-save-v1';

/* ---------- 저장 / 불러오기 (저장소가 막힌 환경에서도 게임은 계속) ---------- */
let storageOk = true;
function readSave() {
  try { return localStorage.getItem(SAVE_KEY); } catch (e) { storageOk = false; return null; }
}
function writeSave() {
  if (!storageOk) return;
  try { S.lastSeen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch (e) { storageOk = false; toast('이 브라우저에서는 저장이 되지 않아요'); }
}
let S = C.loadFromString(readSave(), Date.now()).state;
const firstRun = !readSave();

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }
let bannerT = 0;
function banner(msg) { const b = $('banner'); b.textContent = msg; b.style.opacity = 1; clearTimeout(bannerT); bannerT = setTimeout(() => b.style.opacity = 0, 1400); }
window.addEventListener('error', e => toast('오류가 발생했어요: ' + (e.message || '알 수 없음')));

/* ---------- 지역 테마 (챕터마다 순환) ---------- */
const THEMES = [
  { name: '빗속 뒷골목', boss: '우산 쓴 남자' },
  { name: '안개 항구',   boss: '안개 등대지기' },
  { name: '네온 유흥가', boss: '네온 마네킹' },
];
const theme = () => THEMES[Math.floor((S.stage - 1) / 10) % THEMES.length];

/* ---------- 그림 (빌드 때 assets/art 의 webp 가 data URI 로 들어감) ----------
 * spr_<id>: 전신 그림 (요원은 오른쪽, 이상체와 근원체는 왼쪽을 봄, 배경은 투명)
 * card_<id>: 요원 얼굴 카드, key: 시작 화면 그림
 * 그림을 못 불러오면 아래 임시 그림(캔버스로 직접 그린 모습)으로 대신함 */
const ART = /*ART*/{};
const IMG = {};
for (const [k, src] of Object.entries(ART)) { const im = new Image(); im.decoding = 'async'; im.src = src; IMG[k] = im; }
const imgOk = k => { const im = IMG[k]; return !!(im && im.complete && im.naturalWidth > 0); };
/* 어두운 바닥에서도 보이도록 전신 그림 둘레에 얇은 빛 테두리를 붙인 판을 한 번만 만들어 둠
 * (매 프레임 테두리를 그리면 느려서 미리 구움). 요원은 밝은 빛, 이상체와 근원체는 보랏빛 */
const RIM = {};
function makeRim(k) {
  const im = IMG[k], pad = 7, w = im.naturalWidth, h = im.naturalHeight;
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const q = c.getContext('2d'); if (!q) return;
  for (let a = 0; a < 16; a++) q.drawImage(im, pad + Math.cos(a * Math.PI / 8) * pad * 0.7, pad + Math.sin(a * Math.PI / 8) * pad * 0.7);
  q.globalCompositeOperation = 'source-in';
  const hero = /^spr_(knight|archer|mage|priest|dark)(_[cd])?$/.test(k);
  q.fillStyle = hero ? 'rgba(215,224,255,.55)' : 'rgba(176,120,255,.8)'; q.fillRect(0, 0, c.width, c.height);
  q.globalCompositeOperation = 'source-over'; q.drawImage(im, pad, pad);
  // 맞았을 때 덮어 그리는 흰 실루엣 (같은 크기, 같은 여백)
  const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
  const wq = wc.getContext('2d'); wq.drawImage(im, pad, pad); wq.globalCompositeOperation = 'source-in'; wq.fillStyle = '#fff'; wq.fillRect(0, 0, wc.width, wc.height);
  RIM[k] = { c, pad, white: wc };
}
/** 모든 그림이 준비될 때까지 기다림 (실패한 그림은 건너뜀, 최대 4초) */
const artReady = Promise.race([
  Promise.all(Object.entries(IMG).map(([k, im]) => (im.decode ? im.decode() : Promise.resolve()).then(() => { if (k.startsWith('spr_')) makeRim(k); }).catch(() => {}))),
  new Promise(r => setTimeout(r, 4000)),
]);

/* ---------- 요원 외형 (그림을 못 불러왔을 때 쓰는 임시 모습: 사람 얼굴 + 역할 장비) ----------
 * 그림 주문서의 외모와 같게: 머리 색과 모양, 피부, 옷 색 */
const LOOK = {
  knight: { coat: '#2f3a52', trim: '#5d6b86', hair: '#2a2620', hairStyle: 'buzz',  skin: '#d9b896' },   // 램파트: 짧은 머리, 진압 조끼
  archer: { coat: '#2f4436', trim: '#55705c', hair: '#b9bcc6', hairStyle: 'bob',   skin: '#ecd3bd' },   // 롱샷: 은회색 단발, 초록 후드
  mage:   { coat: '#4a2c2a', trim: '#8a5a3a', hair: '#c4472f', hairStyle: 'messy', skin: '#e3c2a4' },   // 블레이즈: 붉은 머리, 가죽 재킷
  priest: { coat: '#d4d5da', trim: '#9a3a42', hair: '#1c1a22', hairStyle: 'tail',  skin: '#efd6c2' },   // 헤일로: 검은 묶음 머리, 흰 비옷
  dark:   { coat: '#18171d', trim: '#6b4fa0', hair: '#121116', hairStyle: 'fringe', skin: '#d8bea6' },  // 나이트폴: 한쪽 눈 가린 앞머리, 검은 정장
};
function rr(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + p));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/** 사람 머리 (오른쪽을 보는 옆얼굴 기준, hy = 머리 중심 높이) */
function drawHumanHead(g, id, hy, s) {
  const L = LOOK[id], r = s * 0.17;
  // 목과 얼굴
  g.fillStyle = shade(L.skin, -25); g.fillRect(-s * 0.04, hy + r * 0.6, s * 0.08, s * 0.08);
  g.fillStyle = L.skin; g.beginPath(); g.ellipse(s * 0.01, hy, r * 0.92, r, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(s * 0.12, hy - s * 0.02); g.lineTo(s * 0.19, hy + s * 0.04); g.lineTo(s * 0.12, hy + s * 0.07); g.fill();   // 코
  // 머리카락
  g.fillStyle = L.hair;
  if (L.hairStyle === 'buzz') { g.beginPath(); g.arc(0, hy - s * 0.01, r * 1.0, Math.PI * 1.02, Math.PI * 1.98); g.fill(); }
  else if (L.hairStyle === 'bob') { g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.08, Math.PI * 0.85, Math.PI * 2.02); g.lineTo(s * 0.06, hy - s * 0.04); g.lineTo(-s * 0.16, hy + s * 0.13); g.closePath(); g.fill(); }
  else if (L.hairStyle === 'messy') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.05, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    for (const [x, y] of [[-0.12, -0.17], [-0.02, -0.21], [0.08, -0.18], [0.15, -0.1]]) { g.beginPath(); g.moveTo(x * s, hy + y * s + s * 0.06); g.lineTo(x * s + s * 0.05, hy + y * s); g.lineTo(x * s + s * 0.07, hy + y * s + s * 0.07); g.fill(); }
  } else if (L.hairStyle === 'tail') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.04, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    g.beginPath(); g.ellipse(-s * 0.17, hy + s * 0.04, s * 0.05, s * 0.13, 0.35, 0, 7); g.fill();   // 묶은 머리
  } else { // fringe: 한쪽 눈을 가린 앞머리
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.06, Math.PI * 0.9, Math.PI * 2.0); g.fill();
    g.beginPath(); g.moveTo(s * 0.02, hy - s * 0.16); g.quadraticCurveTo(s * 0.2, hy - s * 0.1, s * 0.15, hy + s * 0.06); g.lineTo(s * 0.06, hy - s * 0.02); g.closePath(); g.fill();
  }
  // 눈 (나이트폴은 빛나는 호박색)
  g.fillStyle = id === 'dark' ? '#ffb31a' : '#1b1b22';
  g.fillRect(s * 0.08, hy - s * 0.015, s * 0.035, s * 0.03);
  if (id === 'knight') { g.strokeStyle = 'rgba(120,60,60,.8)'; g.lineWidth = s * 0.012; g.beginPath(); g.moveTo(s * 0.07, hy + s * 0.08); g.lineTo(s * 0.12, hy + s * 0.12); g.stroke(); }   // 턱 흉터
  // 차가운 테두리 빛 (누아르 림 라이트): 필터 없이 선 하나
  g.strokeStyle = 'rgba(170,195,255,.45)'; g.lineWidth = s * 0.018; g.lineCap = 'round';
  g.beginPath(); g.arc(0, hy, r * 1.05, Math.PI * 1.0, Math.PI * 1.55); g.stroke();
}

/** 전신 그림 한 장 그리기. h = 화면 높이(지도 단위), 발이 (x, y)
 * 숨 쉬듯 살짝 늘었다 줄고, 공격(swing)하면 보는 쪽으로 몸을 기울이며, 맞으면(hurt) 좌우로 떨림.
 * face: 1 이면 그림 그대로, -1 이면 좌우를 뒤집음. sh = 그림자 반지름 */
let walkFlap = 0;   // drawHeroRt 가 걷는 중이면 코트 자락 흔들림 세기를 넣어 줌
function drawSprite(g, im, x, y, h, t, swing, hurt, face, sh, rim) {
  const w = h * im.naturalWidth / im.naturalHeight;
  g.save(); g.translate(x, y);
  if (hurt > 0) g.translate(Math.sin(hurt * 40) * hurt * 3, 0);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 0, sh, sh * 0.24, 0, 0, 7); g.fill();
  if (face < 0) g.scale(-1, 1);
  // 공격: 윗몸을 앞으로 휘며 앞으로 내딛음 (swing 1 → 0 으로 줄어들며 원래 자세로)
  const lunge = Math.sin(Math.min(1, swing) * Math.PI) * 0.6 + swing * 0.4;
  g.scale(1 + lunge * 0.04, 1 + Math.sin(t * 3 + x * 0.05) * 0.012 - lunge * 0.04);   // 숨쉬기, 내딛을 때 살짝 눌림
  drawRimmed(g, im, rim, -w / 2 + lunge * h * 0.14, -h, w, h, lunge * 0.16 + Math.sin(t * 2.2 + x) * 0.006, walkFlap, hurt > 0.75 ? (hurt - 0.75) * 1.6 : 0);
  g.restore();
}

/** 그림을 (x, y, w, h) 칸에 그림. 빛 테두리 판(rim)이 있으면 테두리까지 같은 비율로 */
function drawRimmed(g, im, rim, x, y, w, h, bend = 0, flap = 0, flash = 0, slice = true) {
  const src = rim ? rim.c : im, pad = rim ? rim.pad : 0, k = w / im.naturalWidth;
  const sw = src.width, sh = src.height, dx = x - pad * k, dy = y - pad * k, dw = sw * k, dh = sh * k;
  // 반투명(연기) 그림은 띠로 자르면 겹친 자리에 줄이 생김 → 발을 축으로 통째로 기울이기만 함
  let saved = false;
  if (!slice && bend) { g.save(); saved = true; g.translate(x + w / 2, y + h); g.rotate(bend * 0.9); g.translate(-(x + w / 2), -(y + h)); bend = 0; flap = 0; }
  // 불투명 그림: 가로 띠 N개로 잘라 발은 고정, 위로 갈수록 bend 만큼 더 밀어 그림 → 허리가 휨. flap: 아래 띠가 물결처럼 흔들림
  const N = (bend || flap) ? 9 : 1;
  for (let i = 0; i < N; i++) {
    const f0 = i / N, f1 = (i + 1) / N, fm = (f0 + f1) / 2, up = 1 - fm;
    const off = bend * up * up * h + (fm > 0.55 ? Math.sin(R.t * 13 + fm * 7) * flap * (fm - 0.55) * h : 0);
    const sy = Math.floor(f0 * sh), ey = i < N - 1 ? Math.floor(f1 * sh) : sh, shh = ey - sy;

/** 요원 그리기. s = 키 기준 크기, swing = 공격 동작(0~1), face: 1 오른쪽 / -1 왼쪽 */
function drawHero(g, id, x, y, s, t, swing, hurt, face = 1) {
  if (imgOk('spr_' + id)) {

  g.strokeStyle = 'rgba(170,195,255,.3)'; g.lineWidth = s * 0.014; g.beginPath(); g.moveTo(-s * 0.15, -s * 0.58); g.lineTo(-s * 0.21 - flap, -s * 0.14); g.stroke();
  g.fillStyle = L.trim; g.fillRect(-s * 0.15, -s * 0.36, s * 0.3, s * 0.035);

  if (id === 'dark') { g.fillStyle = '#6b4fa0'; g.fillRect(-s * 0.02, -s * 0.6, s * 0.04, s * 0.2); }      // 보라 넥타이
  if (id === 'knight') { g.fillStyle = '#232a38'; g.fillRect(-s * 0.16, -s * 0.56, s * 0.32, s * 0.18); }  // 진압 조끼

/* ---------- 이상체 그리기 (기본 그림은 왼쪽을 봄) ----------
 * shade: 검은 연기로 된 얼굴 없는 사람 형체, 몸에 보랏빛 금
 * crawler: 관절이 너무 많은 네발 검은 타르 덩어리
 * 근원체: 지역마다 다른 큰 이상체 (우산 쓴 남자, 안개 등대지기, 네온 마네킹) */
function drawEnemy(g, e, t) {
  const s = e.size, chap = Math.floor((S.stage - 1) / 10) % 3;

  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 0, s * 0.32, s * 0.08, 0, 0, 7); g.fill();
  const wob = Math.sin(t * 4 + e.ph);
  const key = e.boss ? 'spr_boss' + (chap + 1) : 'spr_' + (e.type === 'crawler' ? 'crawler' : 'shade');
  if (imgOk(key)) {
    // 그림은 왼쪽을 봄 → 위에서 이미 face 로 뒤집었으므로 여기서는 그대로. 걸을 때 살짝 흔들림, 공격하면 앞으로 기울임
    const im = IMG[key], crawl = !e.boss && e.type === 'crawler';
    const h = crawl ? s * 1.1 * im.naturalHeight / im.naturalWidth : s * (e.boss ? 1.12 : 1.05);
    const w = h * im.naturalWidth / im.naturalHeight;
    const lunge = Math.sin(Math.min(1, e.swing) * Math.PI);
    g.rotate(e.walk ? Math.sin(t * 9 + e.ph) * 0.035 : 0);
    drawRimmed(g, im, RIM[key], -w / 2 - lunge * s * 0.16, -h + (crawl ? s * 0.04 : 0), w, h,
      -lunge * 0.18 + wob * 0.012, 0, e.flash > 0 ? Math.min(e.boss ? 0.35 : 0.55, e.flash * 6) : 0, !(e.boss || e.type !== 'crawler'));
  } else if (!e.boss && e.type === 'crawler') {

    g.strokeStyle = '#141219'; g.lineWidth = s * 0.06; g.lineCap = 'round';

      g.beginPath(); g.moveTo(lx, -s * 0.28); g.lineTo(lx - s * 0.1, -s * 0.42 + ph * s * 0.04); g.lineTo(lx - s * 0.06 + ph * s * 0.05, 0); g.stroke();
    }
    g.fillStyle = '#16141c'; g.beginPath(); g.ellipse(0, -s * 0.3, s * 0.3, s * 0.15 + wob * s * 0.01, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(180,140,255,.9)'; g.fillRect(-s * 0.28, -s * 0.34, s * 0.05, s * 0.03); g.fillRect(-s * 0.2, -s * 0.35, s * 0.04, s * 0.03);
  } else {

    g.fillStyle = body;
    g.beginPath(); g.moveTo(-s * 0.17, -s * 0.62); g.lineTo(s * 0.17, -s * 0.62); g.lineTo(s * 0.22 + wob * s * 0.02, 0); g.lineTo(-s * 0.22 - wob * s * 0.02, 0); g.closePath(); g.fill();
    // 아랫단이 연기처럼 흩어짐
    g.fillStyle = 'rgba(24,22,30,.6)'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc((-0.15 + i * 0.1) * s, -s * 0.02 + Math.sin(t * 5 + i + e.ph) * s * 0.02, s * 0.06, 0, 7); g.fill(); }
    g.fillStyle = body; g.beginPath(); g.ellipse(0, -s * 0.76, s * 0.15, s * 0.17, 0, 0, 7); g.fill();

    if (e.boss && chap === 0) { // 우산 쓴 남자: 검은 우산, 얼굴은 그늘
      g.save(); g.translate(s * 0.05, -s * 0.95); g.rotate(-0.15 + e.swing * 0.4);
      g.fillStyle = '#0c0b10'; g.beginPath(); g.arc(0, 0, s * 0.34, Math.PI, 0); g.closePath(); g.fill();
      g.strokeStyle = '#2a2833'; g.lineWidth = s * 0.015; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, s * 0.4); g.stroke();
      g.restore();
    } else if (e.boss && chap === 1) { // 안개 등대지기: 머리 대신 빛나는 등불
      const lg = g.createRadialGradient(0, -s * 0.78, 0, 0, -s * 0.78, s * 0.3); lg.addColorStop(0, 'rgba(255,240,200,.95)'); lg.addColorStop(1, 'rgba(255,220,150,0)');
      g.fillStyle = lg; g.beginPath(); g.arc(0, -s * 0.78, s * 0.3, 0, 7); g.fill();
    } else if (e.boss && chap === 2) { // 네온 마네킹: 금 대신 분홍, 파랑 네온관
      g.strokeStyle = 'rgba(255,70,170,.9)'; g.lineWidth = s * 0.02; g.beginPath(); g.moveTo(-s * 0.12, -s * 0.6); g.lineTo(s * 0.1, -s * 0.3); g.stroke();
      g.strokeStyle = 'rgba(70,210,255,.9)'; g.beginPath(); g.moveTo(s * 0.12, -s * 0.58); g.lineTo(-s * 0.08, -s * 0.2); g.stroke();
    }
    // 눈: 얼굴 없이 빛나는 점 하나
    if (!(e.boss && chap === 1)) { g.fillStyle = e.boss ? '#ff5d5d' : 'rgba(190,160,255,.95)'; g.fillRect(-s * 0.08, -s * 0.79, s * 0.05, s * 0.03); }
    // 팔: 공격할 때 길게 뻗음
    g.strokeStyle = body; g.lineWidth = s * 0.06; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-s * 0.12, -s * 0.52); g.lineTo(-s * 0.2 - e.swing * s * 0.25, -s * 0.36 - e.swing * s * 0.1); g.stroke();
  }
  g.restore();
  if (!e.boss && e.hp < e.max) {
    const w = s * 0.6, by = e.y - s * (e.type === 'crawler' ? 1.05 : 1.15);
    g.fillStyle = '#300'; g.fillRect(e.x - w / 2, by, w, 4);
    g.fillStyle = '#ff5a4a'; g.fillRect(e.x - w / 2, by, w * Math.max(0, e.hp / e.max), 4);
  }
}

/* ---------- 지도 (위에서 내려다본 끝없는 들판) ----------
 * 좌표는 "지도 단위". 화면에는 u 배율(화면 높이 / 320)로 그린다.
 * 지도는 360단위 조각(청크)으로 나눠, 조각 좌표로 정해지는 난수로 장식을 만든다.
 * → 같은 자리는 언제 봐도 같은 모습이고, 지도는 끝없이 이어진다.
 */
const CH = 360;
const MAPW = 1000, MAPH = 1300, MAX_FIELD = 14;   // 지도 크기(단위), 지도 위 일반 이상체 최대 수
const FIELD = [
  // 1장 빗속 뒷골목: 젖은 돌바닥, 가로등, 상자와 드럼통, 쓰레기통, 세워 둔 차
  { ground: '#252c39', patch: '#2b3342', dark: '#1f252f', tree: '#1c242d', tree2: '#283340', rock: '#4a5365', kinds: ['lamp', 'lamp', 'crate', 'barrel', 'bin', 'car'], night: 0.08, fog: 0, cobble: 1, neon: 0, planks: 0 },
  // 2장 안개 항구: 나무 부두 바닥, 화물 상자, 계류 기둥, 낮게 깔린 안개
  { ground: '#2a2a2e', patch: '#302f34', dark: '#232227', tree: '#24232a', tree2: '#302f37', rock: '#57505f', kinds: ['crate', 'crate', 'barrel', 'lamp', 'bollard'], night: 0.1, fog: 1, cobble: 0, neon: 0, planks: 1 },
  // 3장 네온 유흥가: 젖은 아스팔트에 분홍, 파랑 네온 빛
  { ground: '#1d1f2b', patch: '#24263a', dark: '#18192a', tree: '#1b2533', tree2: '#273446', rock: '#4c5771', kinds: ['lamp', 'lamp', 'bin', 'car', 'crate'], night: 0.14, fog: 0, cobble: 0.35, neon: 1, planks: 0 },
];
/** 가로등 빛 색: 네온 유흥가는 분홍, 파랑 번갈아 */
const lampCol = (F, d) => F.neon ? ((Math.floor(d.x / 7) & 1) ? [255, 70, 170] : [70, 210, 255]) : [255, 190, 90];
const field = () => FIELD[Math.floor((S.stage - 1) / 10) % FIELD.length];

/** 시드 난수 (mulberry32) */
function seeded(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const chunkCache = new Map();
function chunk(cx, cy) {
  const chap = Math.floor((S.stage - 1) / 10) % FIELD.length, key = S.stage + ':' + cx + ',' + cy;
  let c = chunkCache.get(key);
  if (c) return c;
  if (chunkCache.size > 300) chunkCache.clear();   // 메모리 보호
  const r = seeded((cx * 73856093) ^ (cy * 19349663) ^ (S.stage * 83492791)), F = FIELD[chap];
  const ox = cx * CH, oy = cy * CH, flat = [], tall = [];
  // 바닥 얼룩: 항상 납작한 타원 두세 개를 겹친 자연스러운 모양 (동그란 원반처럼 보이지 않게)
  for (let i = 0; i < 5; i++) {
    const x = ox + r() * CH, y = oy + r() * CH, rx = 40 + r() * 50, c = r() < 0.6 ? F.patch : F.dark;
    for (let j = 0; j < 3; j++) flat.push({ k: 'patch', x: x + (r() - 0.5) * rx, y: y + (r() - 0.5) * rx * 0.3, rx: rx * (0.5 + r() * 0.4), ry: rx * (0.22 + r() * 0.12), c });
  }
  for (let i = 0; i < 12; i++) flat.push({ k: r() < 0.6 ? 'tuft' : 'flower', x: ox + r() * CH, y: oy + r() * CH, h: r() });
  // 돌바닥 조각: 마을과 성채는 많이, 협곡은 드문드문
  const nst = Math.round(60 * F.cobble);
  for (let i = 0; i < nst; i++) flat.push({ k: 'stone', x: ox + r() * CH, y: oy + r() * CH, h: r() });
  for (let i = 0; i < 3; i++) flat.push({ k: 'puddle', x: ox + r() * CH, y: oy + r() * CH, rx: 16 + r() * 26, h: r() });
  const n = 2 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) tall.push({ k: F.kinds[Math.floor(r() * F.kinds.length)], x: ox + r() * CH, y: oy + r() * CH, s: 0.8 + r() * 0.5 });
  c = { flat, tall }; chunkCache.set(key, c);
  return c;
}

/* ---------- 전투 상태 (저장 안 함) ---------- */
const R = { enemies: [], proj: [], fx: [], texts: [], heroes: {}, t: 0, buff: 0, wipe: 0, boss: null, bossT: 0,
  cam: { x: 0, y: MAPH / 2 - 220 }, A: { x: 0, y: MAPH / 2 - 220 }, heading: -1.57, spawnT: 0, roam: null, mapStage: 0 };
const cv = $('cv'), g = cv.getContext('2d');
if (!g) toast('이 기기에서는 전투 화면을 그릴 수 없어요');
let W = 360, H = 300, DPR = 1, u = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height); u = H / 320;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
const cvRO = new ResizeObserver(resize); cvRO.observe(cv);

/* ---------- 스테이지 지도: 경계가 있는 넓은 들판 (화면 약 3×4개) ----------
 * 이상체 무리가 지도 곳곳에 흩어져 생기고, 요원 팀은 가장 가까운 무리를 찾아 어디로든 돌아다닌다. */
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
/** 지도 안에 가둠 (벽에서 pad 만큼 떨어지게) */

/* ---------- 메인 루프 ---------- */
let last = performance.now(), uiT = 0, saveT = 0, paused = true;
const modalEl = $('modal');
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {
    // 시작 화면이나 팝업이 떠 있는 동안은 전투를 멈춤 (보스 제한 시간 보호)
    // 히트스톱: 치명타, 기술, 처치 순간 화면이 아주 잠깐 멈췄다 풀림 (타격감의 핵심)
    if (!paused && !modalEl.classList.contains('on')) { if (R.stop > 0) { R.stop -= dt; R.shake = Math.max(0, (R.shake || 0) - dt * 10); } else update(dt); }
    if (g) draw();

    saveT += dt; if (saveT > 5) { saveT = 0; writeSave(); }
  } catch (e) { console.error(e); toast('전투 처리 중 오류: ' + e.message); }

  // 전멸: 3초 뒤 그 자리에서 부활, 근처 이상체는 물러남(다시 배치)
  if (R.wipe > 0) {

    return;
  }

  R.spawnT -= dt;

  if (!R.boss && !S.farming && S.kills >= C.CONST.WAVE_KILLS) spawnBoss();
  // 파티 기준점: 싸우는 중이면 요원들 가운데, 아니면 지도에서 가장 가까운 무리(보스가 있으면 보스)를 향해 이동

    R.A.x += (mx / hs.length - R.A.x) * Math.min(1, dt * 2); R.A.y += (my / hs.length - R.A.y) * Math.min(1, dt * 2);
  } else {

    const dx = tp.x - R.A.x, dy = tp.y - R.A.y;

      else damage(p.tgt, p.dmg);

  }

  for (const e of R.enemies) {
    e.hit = Math.max(0, e.hit - dt); e.flash = Math.max(0, (e.flash || 0) - dt); e.swing = Math.max(0, e.swing - dt * 3); e.walk = false;
    if (e.vx || e.vy) { e.x += e.vx * dt; e.y += e.vy * dt; const fr = Math.pow(0.0015, dt); e.vx *= fr; e.vy *= fr; if (Math.abs(e.vx) + Math.abs(e.vy) < 2) e.vx = e.vy = 0; keepIn(e, 30); }
    let tg = null, bd = Infinity;
    for (const h of hs) { const d = dist(e, R.heroes[h.id]); if (d < bd) { bd = d; tg = h; } }
    if (!tg) continue;
    if (bd < (e.boss ? 240 : 150)) e.aggro = true;
    if (!e.aggro) { // 들키기 전: 제자리 근처를 어슬렁거림
      e.wt -= dt;
      if (e.wt <= 0) { e.wt = 1.5 + Math.random() * 2.5; const a = Math.random() * Math.PI * 2; e.tx = e.home.x + Math.cos(a) * 35; e.ty = e.home.y + Math.sin(a) * 25; }

    e.face = hr.x >= e.x ? 1 : -1;
    e.at += dt * (e.boss ? 0.7 : 0.8);
    if (e.at >= 1) {
      e.at = 0; e.swing = 1;
      hr.hp -= e.atk; hr.hurt = 1;
      addText(hr.x, hr.y - HERO_SIZE, C.formatNum(e.atk), '#ff7a7a', false);
    }

function drawProj(p) {

    const tg = g.createLinearGradient(-26, 0, 4, 0); tg.addColorStop(0, 'rgba(255,220,140,0)'); tg.addColorStop(1, p.gold ? '#ffd23a' : '#fff1c8');
    g.strokeStyle = tg; g.lineWidth = 2; g.beginPath(); g.moveTo(-26, 0); g.lineTo(4, 0); g.stroke();
  } else if (p.k === 'mage') { // 화염병: 빙글 도는 병 + 불꽃
    g.rotate(performance.now() / 80);
    g.fillStyle = '#3d5a3a'; g.fillRect(-3, -5, 6, 10);
    const fl = g.createRadialGradient(0, -7, 0, 0, -7, 9); fl.addColorStop(0, '#fff2c0'); fl.addColorStop(0.5, '#ff8a2e'); fl.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = fl; g.beginPath(); g.arc(0, -7, 9, 0, 7); g.fill();
  } else { // 진정제 침
    g.strokeStyle = '#dfe6f2'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-10, 0); g.lineTo(4, 0); g.stroke();
    g.fillStyle = '#c8323c'; g.fillRect(-12, -1.5, 4, 3);

}
/** 검은 배경 이펙트 그림을 빛 더하기로 그림 (검은 부분은 사라짐) */
function fxImg(k, x, y, w, h, a, rot = 0) {
  if (!imgOk(k)) return false;
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.max(0, Math.min(1, a));
  g.translate(x, y); if (rot) g.rotate(rot); g.drawImage(IMG[k], -w / 2, -h / 2, w, h); g.restore();
  return true;
}
function drawFx(f) {
  // 이펙트 그림이 있으면 그것으로, 없으면 아래 코드 그림으로
  if (f.k === 'xslash' && fxImg('fx_slash', f.x, f.y, f.r * 2.4, f.r * 2.4, f.life * 4, -0.5)) { fxImg('fx_slash', f.x, f.y, f.r * 2.4, f.r * 2.4, f.life * 4, 1.1); return; }
  if (f.k === 'spark' && fxImg('fx_hit', f.x, f.y, f.len * 3, f.len * 3, f.life * 5, f.a0)) return;
  if (f.k === 'burst' && f.col === '#ff8a2e' && fxImg('fx_fire', f.x, f.y, f.r * 2.6, f.r * 2.6, f.life * 3)) return;
  if (f.k === 'pillar' && fxImg('fx_heal', f.x, f.y - 55, 60, 120, f.life * 1.5)) return;
  if (f.k === 'ring' && f.col === '#7fb2ff' && fxImg('fx_shock', f.x, f.y, f.r * 2.4, f.r * 1.3, f.life * 2.5)) return;
  if (f.k === 'coin') { g.save(); g.translate(f.x, f.y); g.scale(Math.abs(Math.cos(f.life * 12)) + 0.2, 1); g.fillStyle = '#f5c451'; g.strokeStyle = '#8a5609'; g.lineWidth = 1.2; g.beginPath(); g.arc(0, 0, 4.5, 0, 7); g.fill(); g.stroke(); g.restore(); }
  else if (f.k === 'slash') { g.strokeStyle = f.col; g.globalAlpha = f.life * 5; g.lineWidth = 4; g.beginPath(); if (f.face < 0) g.arc(f.x + f.r * 0.4, f.y, f.r, Math.PI - 0.9, Math.PI + 1); else g.arc(f.x - f.r * 0.4, f.y, f.r, -1, 0.9); g.stroke(); g.globalAlpha = 1; }
  else if (f.k === 'burst') { const p = 1 - f.life / 0.45; g.globalAlpha = Math.max(0, f.life * 2.4); const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (0.5 + p)); gr.addColorStop(0, '#fff'); gr.addColorStop(0.35, f.col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, f.r * (0.5 + p), 0, 7); g.fill(); g.globalAlpha = 1; }
  else if (f.k === 'spark') { const p = 1 - f.life / 0.22; g.strokeStyle = f.col; g.lineWidth = 2; g.globalAlpha = Math.max(0, f.life * 5); g.beginPath();
    for (let i = 0; i < f.n; i++) { const a = f.a0 + i * 6.283 / f.n, r0 = f.len * (0.2 + p * 0.6), r1 = r0 + f.len * 0.45 * (1 - p); g.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0 * 0.8); g.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1 * 0.8); }
    g.stroke(); g.globalAlpha = 1; }
  else if (f.k === 'mote' || f.k === 'ember') { g.globalAlpha = Math.min(1, f.life * 2); g.fillStyle = f.k === 'ember' ? (f.life > 0.4 ? '#ffd27a' : '#ff6a2e') : '#b98cff'; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); g.globalAlpha = 1; }
  else if (f.k === 'xslash') { // 두 번 엇갈려 긋는 칼자국: 가운데가 굵고 양 끝이 뾰족한 초승달 모양
    const p = 1 - f.life / 0.25, a = Math.min(1, f.life * 6);
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const [rot, del] of [[-0.55, 0], [0.55, 0.25]]) {
      const q = Math.max(0, Math.min(1, (p - del) * 3)); if (q <= 0) continue;
      g.save(); g.translate(f.x, f.y); g.rotate(rot); g.scale(1, 0.32);
      const L = f.r * q;
      g.fillStyle = `rgba(170,120,255,${0.55 * a})`; g.beginPath(); g.moveTo(-L, 0); g.quadraticCurveTo(0, -f.r * 0.32, L, 0); g.quadraticCurveTo(0, -f.r * 0.12, -L, 0); g.fill();
      g.fillStyle = `rgba(250,244,255,${a})`; g.beginPath(); g.moveTo(-L * 0.9, 0); g.quadraticCurveTo(0, -f.r * 0.22, L * 0.9, 0); g.quadraticCurveTo(0, -f.r * 0.15, -L * 0.9, 0); g.fill();
      g.restore();
    }
    g.restore(); }
  else if (f.k === 'pillar') { // 치유 빛: 가운데가 밝고 양옆, 위로 갈수록 옅어지는 빛 기둥 + 떠오르는 빛 알갱이
    const a = Math.min(1, f.life * 2), p = 1 - f.life / 0.8, gr = g.createLinearGradient(f.x - 12, 0, f.x + 12, 0);
    gr.addColorStop(0, 'rgba(255,236,160,0)'); gr.addColorStop(0.5, 'rgba(255,240,190,1)'); gr.addColorStop(1, 'rgba(255,236,160,0)');
    g.fillStyle = gr; for (let i = 0; i < 8; i++) { g.globalAlpha = a * 0.32 * (1 - i / 8); g.fillRect(f.x - 12, f.y - (i + 1) * 12, 24, 12); }
    g.fillStyle = '#fff3c4'; for (let i = 0; i < 4; i++) { const yy = f.y - ((p * 90 + i * 24) % 96); g.globalAlpha = a * 0.9; g.beginPath(); g.arc(f.x + Math.sin(i * 2.1 + p * 6) * 7, yy, 1.6, 0, 7); g.fill(); }
    g.globalAlpha = 1; }
  else if (f.k === 'ring') { // 바닥에 퍼지는 빛 고리: 얇은 선 + 안쪽 은은한 빛, 빨리 사라짐
    const p = 1 - f.life / 0.45, rr = f.r * (0.35 + p * 0.75), a = Math.max(0, f.life * 1.8);
    g.save(); g.translate(f.x, f.y); g.scale(1, 0.5);
    const gl = g.createRadialGradient(0, 0, rr * 0.6, 0, 0, rr); gl.addColorStop(0, 'rgba(0,0,0,0)'); gl.addColorStop(1, f.col);
    g.globalAlpha = a * 0.35; g.fillStyle = gl; g.beginPath(); g.arc(0, 0, rr, 0, 7); g.fill();
    g.globalAlpha = a * 0.8; g.strokeStyle = f.col; g.lineWidth = 1.6; g.beginPath(); g.arc(0, 0, rr, 0, 7); g.stroke();
    g.restore(); g.globalAlpha = 1; }
}

/* ---------- 초상화 (캔버스로 한 번 그려서 재사용) ---------- */
const portraitCache = {};
function portrait(id) {
  if (ART['card_' + id]) return ART['card_' + id];   // 그림 카드 (얼굴)
  if (portraitCache[id]) return portraitCache[id];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const p = c.getContext('2d'); if (!p) return '';
  const bg = p.createLinearGradient(0, 0, 0, 128); bg.addColorStop(0, shade(LOOK[id].coat, 45)); bg.addColorStop(1, '#1C212B');
  p.fillStyle = bg; p.fillRect(0, 0, 128, 128);
  drawHero(p, id, 56, 190, 200, 0, 0.15, 0);
  return (portraitCache[id] = c.toDataURL());
}

let partyKey = '';
function renderParty() {
  const list = owned(), slots = [];

    const h = list[i];
    slots.push(h ? `<div class="slot" id="sl-${h.id}"><div class="face"><img src="${portrait(h.id)}" alt="${h.name}"></div><div class="hp"><i></i></div></div>` : `<div class="slot empty" title="호출로 합류">+</div>`);

function updateUI() {
  $('stage').textContent = C.stageLabel(S.stage);
  $('area').textContent = theme().name;
  $('gold').textContent = C.formatNum(S.gold);
  $('gems').textContent = C.formatNum(S.gems);
  const bar = $('prog').firstElementChild, lab = $('prog').lastElementChild;
  if (R.boss) { bar.className = 'boss'; bar.style.width = (100 * Math.max(0, R.boss.hp / R.boss.max)) + '%'; lab.textContent = '봉쇄 작전'; }

  else { bar.className = ''; bar.style.width = (100 * S.kills / C.CONST.WAVE_KILLS) + '%'; lab.textContent = `${S.kills} / ${C.CONST.WAVE_KILLS}`; }
  $('bossBtn').style.display = S.farming && !R.boss ? 'block' : 'none';
  const key = owned().map(h => h.id).join();
  if (key !== partyKey) { partyKey = key; renderParty(); }
  for (const h of owned()) {
    const el = $('sl-' + h.id), r = R.heroes[h.id]; if (!el || !r) continue;
    el.style.setProperty('--cd', Math.max(0, r.cd / h.skill.cd).toFixed(3));

/** 그림을 칸에 꽉 차게(비율 유지, 넘치는 쪽은 잘라냄) 그림. ax, ay: 0 왼쪽(위) ~ 1 오른쪽(아래) 기준 */
function drawCover(p, im, w, h, ax = 0.5, ay = 0.5) {
  const sc = Math.max(w / im.naturalWidth, h / im.naturalHeight), iw = im.naturalWidth * sc, ih = im.naturalHeight * sc;
  p.drawImage(im, (w - iw) * ax, (h - ih) * ay, iw, ih);
}
/** 호출 배너: 일러스트를 배경으로 깔고, 왼쪽 글자가 잘 읽히게 왼쪽을 어둡게 */
function drawSummonBanner() {
  const d = Math.min(3, devicePixelRatio || 1);
  for (const [id, key, ax, ay] of [['sbc', 'banner_pick', 1, 0.3], ['sbc2', 'banner_call', 0.5, 0.35]]) {
    const c = $(id); if (!c) continue;
    const w = c.clientWidth || 360, h = c.clientHeight || 150;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    const p = c.getContext('2d'); if (!p) continue; p.scale(d, d);
    p.fillStyle = '#0b0d12'; p.fillRect(0, 0, w, h);
    if (imgOk(key)) drawCover(p, IMG[key], w, h, ax, ay);
    else if (id === 'sbc') drawHero(p, 'dark', w * 0.74, h * 1.02, h * 0.95, 1, 0.3, 0);
    else C.STARTER_IDS.forEach((hid, i) => drawHero(p, hid, w * (0.5 + i * 0.13), h * 1.04, h * 0.82, 1, 0, 0));
    const sh = p.createLinearGradient(0, 0, w * 0.62, 0); sh.addColorStop(0, 'rgba(8,10,16,.88)'); sh.addColorStop(1, 'rgba(8,10,16,0)');
    p.fillStyle = sh; p.fillRect(0, 0, w, h);
    const bt = p.createLinearGradient(0, h * 0.55, 0, h); bt.addColorStop(0, 'rgba(8,10,16,0)'); bt.addColorStop(1, 'rgba(8,10,16,.6)');
    p.fillStyle = bt; p.fillRect(0, h * 0.55, w, h * 0.45);
  }
}

  $('dotTrain').style.display = C.UPGRADES.some(u => C.upgradeCost(u.id, S.up[u.id]) <= S.gold) && tab !== 'train' ? 'block' : 'none';
}
/** 일괄 강화 계획: 1회/10회는 정해진 단계, 최대는 살 수 있는 만큼 */
function lvPlan(lv) {
  if (bulk === 0) { const r = C.heroLvAffordable(lv, S.gold, 1000); return r.n > 0 ? r : { n: 1, cost: C.heroLvCost(lv) }; }
  return { n: bulk, cost: C.heroLvCostBulk(lv, bulk) };
}

/* ---------- 입력 ---------- */
$('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  try {
    if (act === 'bulk') { bulk = +b.dataset.v; renderPanel(); }
    else if (act === 'lv') {
      const d = S.heroes[b.dataset.h], { n, cost } = lvPlan(d.lv);
      if (cost > S.gold) return toast('골드가 부족해요');
      S.gold -= cost; d.lv += n; syncHeroes(false);
    } else if (act === 'star') {
      const d = S.heroes[b.dataset.h], need = C.starNeed(d.stars);
      if (d.shards < need) return;
      d.shards -= need; d.stars++; syncHeroes(false); banner(`${C.heroById(b.dataset.h).name} ★${d.stars} 승급`); renderPanel();
    } else if (act === 'up') {
      const id = b.dataset.u, cost = C.upgradeCost(id, S.up[id]);
      if (cost > S.gold) return toast('골드가 부족해요');
      S.gold -= cost; S.up[id]++;
    } else if (act === 'sum') doSummon(+b.dataset.n, b.dataset.kind === 'pickup');
    else if (act === 'testOff') showOffline(C.offlineReward(S, 3600));
    else if (act === 'reset') confirmReset();
    updateUI(); writeSave();
  } catch (err) { console.error(err); toast('처리하지 못했어요: ' + err.message); }
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  for (const x of $('tabs').children) x.classList.toggle('on', x === b);
  renderPanel(); $('panel').scrollTop = 0;
});
$('bossBtn').addEventListener('click', () => { S.farming = false; S.kills = C.CONST.WAVE_KILLS; R.enemies = []; R.boss = null; updateUI(); });

/* ---------- 요원 호출 / 특별 채용 ---------- */
/** n회 호출. pickup 이면 특별 채용(전설 확률 높음) */
function doSummon(n, pickup) {
  const cost = n === 10 ? C.CONST.SUMMON_COST_10 : C.CONST.SUMMON_COST_1;
  if (S.gems < cost) return toast('보석이 부족해요');
  const ids = C.summon(n, Math.random, pickup ? C.CONST.PICKUP_LEGEND_RATE : C.CONST.LEGEND_RATE);
  const res = C.applySummon(S, ids);
  res.state.gems -= cost; S = res.state;
  syncHeroes(false); writeSave();
  openModal(`<h2>${pickup ? '채용 결과' : '호출 결과'}</h2><div class="res ${n === 1 ? 'one' : ''}">${ids.map((id, i) => {
    const h = C.heroById(id);
    return `<div class="rc ${h.grade === '전설' ? 'leg' : ''}" style="animation-delay:${i * 0.07}s"><img src="${portrait(id)}" alt=""><small>${h.name}</small>${res.isNew[i] ? '<span class="new">NEW</span>' : ''}</div>`;
  }).join('')}</div><p>${res.isNew.some(Boolean) ? '새 요원이 AIU에 합류했어요' : '조각은 요원 탭에서 승급에 써요'}</p><div class="mbtns"><button class="btn" data-close>확인</button></div>`);
  renderPanel();
}

/* ---------- 모달 ---------- */
function openModal(html, onClose) {
  const m = $('modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.add('on');
  m.onclick = e => { const b = e.target.closest('[data-close]'); if (!b) return; m.classList.remove('on'); if (onClose) onClose(b.dataset.close); };
}
function showOffline(r) {
  if (!r || r.gold <= 0) { if (r) toast('받을 보상이 없어요'); return; }
  openModal(`<h2>자리를 비운 동안</h2><p>요원들이 ${C.formatDuration(r.sec)} 동안 이상체 ${C.formatNum(r.kills)}개체를 처리했어요</p>
    <div class="big">${icon('gold')}<span>${C.formatNum(r.gold)}</span></div><p class="hint">최대 8시간까지 쌓여요</p>
    <div class="mbtns"><button class="btn" data-close="ok">받기</button></div>`, () => { S.gold += r.gold; writeSave(); updateUI(); banner('보상 획득'); });
}
function confirmReset() {
  openModal(`<h2>처음부터 다시</h2><p>골드, 요원, 스테이지가 모두 지워져요</p><div class="mbtns"><button class="btn ghost" data-close="no">취소</button><button class="btn" data-close="yes" style="background:linear-gradient(#ff7a6b,#c7332a);color:#fff;box-shadow:0 3px 0 #6d1510">초기화</button></div>`, v => {
    if (v !== 'yes') return;
    S = C.newState(Date.now()); R.heroes = {}; R.enemies = []; R.proj = []; R.boss = null; R.mapStage = 0; syncHeroes(true); writeSave(); renderPanel(); toast('새 게임을 시작했어요');
  });
}

/* ---------- 앱 생명주기: 숨김 → 복귀 시 오프라인 보상 ---------- */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); writeSave(); }
  else if (hiddenAt) { const r = C.offlineReward(S, (Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); if (r.gold > 0) showOffline(r); }
});
window.addEventListener('pagehide', writeSave);

/* ---------- 시작 ---------- */
const pending = firstRun ? null : C.offlineReward(S, (Date.now() - S.lastSeen) / 1000);
syncHeroes(true); renderPanel(); updateUI();
let started = false, splashReady = false;   // splashReady: 불러오기가 끝나야 화면을 눌러 접속할 수 있음
function startGame() {
  if (started || !splashReady) return; started = true;
  $('splash').style.display = 'none'; paused = false; last = performance.now();
  if (pending && pending.gold > 0) showOffline(pending);
  else if (firstRun) banner('출동');
}
$('splash').addEventListener('click', startGame);
/* 시작 화면 배경: 요원 다섯 명 그림(key)을 화면 가로 폭에 맞춰 아래에 붙이고, 남는 위쪽은 그림 하늘색으로 이어 칠함.
 * 그 위에 비, 하늘 균열의 보랏빛 번쩍임, 글자가 잘 보이도록 위아래 어둡게 깔기. 그림이 없으면 하늘과 비만 그림 */
{
  const cvs = $('spbg'), q = cvs.getContext('2d'), key = IMG.key;
  const rnd = seeded(20261127);
  const drops = Array.from({ length: 120 }, () => ({ x: rnd(), y: rnd(), l: 10 + rnd() * 18, v: 0.8 + rnd() * 0.7, a: 0.07 + rnd() * 0.16 }));
  let flashNext = 1.2, flashT0 = -9;
  function spDraw(now) {
    if (started || !q) return;
    const W2 = cvs.clientWidth, H2 = cvs.clientHeight, d = Math.min(3, devicePixelRatio || 1);
    if (cvs.width !== Math.round(W2 * d) || cvs.height !== Math.round(H2 * d)) { cvs.width = Math.round(W2 * d); cvs.height = Math.round(H2 * d); }
    q.setTransform(d, 0, 0, d, 0, 0);
    const t = now / 1000;
    q.fillStyle = '#090d1b'; q.fillRect(0, 0, W2, H2);   // 그림 맨 위 하늘색과 같은 색
    let iw = 0, ih = 0, iy = 0, ix = 0;
    if (imgOk('key')) {
      // 가로 폭에 맞추고 아래에 붙임 (요원이 양옆으로 잘리지 않게). 화면이 그림보다 납작하면 위쪽 하늘이 잘림
      const sc = W2 / key.naturalWidth;
      iw = key.naturalWidth * sc; ih = key.naturalHeight * sc; ix = (W2 - iw) / 2; iy = H2 - ih;
      q.drawImage(key, ix, iy, iw, ih);
      // 그림 윗선이 보이지 않게 하늘색으로 부드럽게 이음
      if (iy > 0) { const fg = q.createLinearGradient(0, iy, 0, iy + ih * 0.12); fg.addColorStop(0, '#090d1b'); fg.addColorStop(1, 'rgba(9,13,27,0)'); q.fillStyle = fg; q.fillRect(0, iy, W2, ih * 0.12); }
    }
    // 하늘 균열 번쩍임: 3~6초마다 그림 속 균열(가운데 뒤) 자리가 잠깐 밝아짐
    if (t >= flashNext) { flashT0 = t; flashNext = t + 3 + rnd() * 3; }
    const age = t - flashT0;
    if (age < 0.8 && ih) {
      const fl = (1 - age / 0.8) * (Math.sin(age * 55) > -0.3 ? 1 : 0.4);
      const cx = ix + iw * 0.53, cy = iy + ih * 0.42, gl = q.createRadialGradient(cx, cy, 0, cx, cy, iw * 0.5);
      gl.addColorStop(0, `rgba(170,120,255,${0.32 * fl})`); gl.addColorStop(1, 'rgba(170,120,255,0)');
      q.fillStyle = gl; q.fillRect(0, 0, W2, H2);
    }
    // 아래쪽 글자(불러오기 줄, 제작사)가 잘 보이게 바닥을 어둡게
    const bot = q.createLinearGradient(0, H2 * 0.72, 0, H2); bot.addColorStop(0, 'rgba(6,8,14,0)'); bot.addColorStop(1, 'rgba(6,8,14,.88)');
    q.fillStyle = bot; q.fillRect(0, H2 * 0.72, W2, H2 * 0.28);
    // 비
    q.lineWidth = 1;
    for (const r of drops) {
      const y = ((r.y + t * r.v) % 1.1 - 0.05) * H2, x = ((r.x - t * r.v * 0.1) % 1 + 1) % 1 * W2;
      q.strokeStyle = `rgba(185,200,240,${r.a})`; q.beginPath(); q.moveTo(x, y); q.lineTo(x - r.l * 0.2, y + r.l); q.stroke();
    }
    requestAnimationFrame(spDraw);
  }
  requestAnimationFrame(spDraw);
}
/* 로딩 바: 약 2.2초 동안 매 프레임 부드럽게 차오름. 지나는 지점마다 문구가 바뀌고, 다 차면 접속 안내 */
{
  const DUR = 2200, steps = [[0, '비 내리는 중'], [0.35, '요원 호출하는 중'], [0.7, '구역 지도 펼치는 중']];
  const fill = $('sp-fill'), msg = $('sp-msg');
  const ease = x => 1 - Math.pow(1 - x, 2.2);   // 처음엔 빠르게, 끝으로 갈수록 천천히
  let t0 = null, artDone = false;
  artReady.then(() => { artDone = true; });
  function loadTick(now) {
    if (started) return;
    if (t0 === null) t0 = now;
    const x = Math.min(1, (now - t0) / DUR), p = ease(x);
    fill.style.width = (p * 100).toFixed(2) + '%';
    let m = steps[0][1]; for (const [at, text] of steps) if (p >= at) m = text;
    if (msg.textContent !== m) msg.textContent = m;
    if (x < 1 || !artDone) { requestAnimationFrame(loadTick); return; }
    // 다 차면 자동으로 넘어가지 않고, 화면을 눌러야 접속
    splashReady = true; msg.textContent = 'READY'; msg.classList.add('ready');
    const tap = $('sp-tap'); tap.textContent = 'TOUCH TO START'; tap.classList.add('ready');
  }
  requestAnimationFrame(loadTick);
}
requestAnimationFrame(loop);
}
</script>
</body>
