<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 수사 3팀과 같은 누아르, 비 오는 밤의 범죄 액션, 모바일 방치형
   IDEA: 이상현상 전담수사팀 요원들이 비 내리는 도시 구역을 돌아다니며 이상체를 처리
   PICTURE: 상단 전투 캔버스(구역 지도, 요원, 이상체, 근원체)
   COLOUR and TYPE: 깊은 남색 패널 + 금색 테두리 + 진홍 강조 / Black Han Sans 제목, Noto Sans KR 본문
   LAYOUT: 세로 고정. HUD → 전투 → 파티 슬롯 → 탭 패널 → 하단 탭 */
/* 색은 수사 3팀과 같은 값 (--ink 는 여기서 글자색) */
:root{--bg:#0F1422;--panel:#1A2131;--panel2:#232C40;--line:#2F3A52;--gold:#F2C94C;--gold2:#2F3A52;--red:#E0503E;--rift:#9D7BFF;--ink:#E6E9F2;--dim:#8F9AB0;--ok:#5BD08A;--r:6px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;margin:0;height:100%;background:#080B13;color:var(--ink);font:15px/1.4 'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.num{font-family:"Black Han Sans",sans-serif;letter-spacing:.01em}

/* HUD: 왼쪽은 구역 번호와 진행, 오른쪽은 재화. 진행 숫자는 막대 밖 오른쪽에 둠 */
#hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 9px;background:var(--bg);border-bottom:1px solid var(--line)}
#stageBox{flex:1}
#stageRow{display:flex;align-items:baseline;gap:8px}
#stage{font-family:"Black Han Sans";font-size:26px;color:var(--gold);line-height:1;letter-spacing:.01em}
#area{font-size:13px;font-weight:600;color:var(--dim)}
#prog{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:6px}
#prog::before{content:"";grid-column:1;grid-row:1;height:6px;border-radius:3px;background:#070A11;box-shadow:inset 0 0 0 1px var(--line)}
#prog i{grid-column:1;grid-row:1;height:6px;border-radius:3px;background:var(--gold);transition:width .2s;justify-self:start}
#prog i.boss{background:var(--red)}
#prog span{grid-column:2;grid-row:1;font:400 12px "Black Han Sans";color:var(--ink);white-space:nowrap}
#btnSet{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
#btnSet .ic{width:18px;height:18px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.setrow .ut{font:400 15px "Black Han Sans"}
.setrow .uv{font-size:12px;color:var(--dim)}
.pill{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 7px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-family:"Black Han Sans";font-size:15px;white-space:nowrap}

/* 전투 */
#battle{position:relative;flex:0 0 auto;height:45vh;height:45dvh;min-height:260px;max-height:430px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossAuto{position:absolute;left:10px;top:10px;z-index:2;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,20,34,.86);color:var(--dim);font:700 12px 'IBM Plex Sans KR'}
#bossAuto[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#bossAuto::before{content:"";display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:currentColor;vertical-align:1px}
#bossBtn{position:absolute;left:10px;top:42px;display:none;padding:8px 14px;border-radius:10px;border:0;background:var(--red);color:#fff;font-family:"Black Han Sans";font-size:15px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* 가이드 퀘스트: 세나 키우기처럼 전투 화면 왼쪽 아래에 한 줄 */
/* 퀘스트 상자: 한 줄 알약 (번호 칩, 할 일, 진행 수, 보상). 진행은 아래 가는 금색 줄. 다 차면 보상 칸이 금색 '받기' */
#quest{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;align-items:center;gap:6px;max-width:64%;height:30px;padding:0 0 0 6px;border:1px solid var(--line);border-radius:15px;background:rgba(15,20,34,.9);color:var(--ink);text-align:left;overflow:hidden}
#quest .q-l{display:contents}
#quest .q-h{display:flex;align-items:center;gap:5px;min-width:0}
#quest .qn{flex:none;padding:2px 5px;border-radius:9px;background:rgba(242,201,76,.16);font:700 10px/1 'IBM Plex Sans KR',sans-serif;color:var(--gold)}
#quest .qt{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quest .q-p{display:contents}
#quest .q-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
#quest .q-bar i{display:block;height:100%;width:var(--qp,0%);background:var(--gold)}
#quest .qc{flex:none;font:700 11px 'IBM Plex Sans KR',sans-serif;color:var(--dim);white-space:nowrap}
#quest .qr{flex:none;display:flex;align-items:center;gap:2px;align-self:stretch;padding:0 9px 0 7px;border-left:1px solid var(--line);background:rgba(0,0,0,.2)}
#quest .qr .ic{width:13px;height:13px}
#quest .qr b{font:700 11px 'IBM Plex Sans KR',sans-serif}
#quest .qr em{display:none;font-style:normal;font:700 11px 'IBM Plex Sans KR',sans-serif}
#quest.done{border-color:var(--gold);box-shadow:0 0 10px rgba(242,201,76,.45);animation:qpulse 1.2s ease-in-out infinite}
#quest.done .qr{background:var(--gold);color:#141824;border-left-color:var(--gold)}
#quest.done .qr em{display:block}
#quest.done .qr .ic,#quest.done .qr b{display:none}
#quest.done .qc{color:var(--gold)}
@keyframes qpulse{50%{box-shadow:0 0 2px rgba(242,201,76,.2)}}
/* 전투 버튼: 퀘스트 상자와 같은 높이의 정사각, 아이콘 + 글자 */
#bctl{position:absolute;right:8px;bottom:8px;z-index:2;display:flex;gap:6px}
#bctl button{display:flex;place-items:center;align-items:center;justify-content:center;gap:3px;min-width:30px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:15px;background:rgba(15,20,34,.9);color:var(--dim);font:700 11px 'IBM Plex Sans KR',sans-serif}
#bctl .ic{width:13px;height:13px}
#bctl button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(40,34,14,.9)}
@media (prefers-reduced-motion:reduce){#quest.done{animation:none}}
#banner{position:absolute;left:0;right:0;top:36%;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(18,21,28,.82) 20%,rgba(18,21,28,.82) 80%,transparent);text-align:center;font-family:"Black Han Sans";font-size:30px;color:#fff;color:var(--gold);text-shadow:0 2px 0 #000;opacity:0;pointer-events:none;transition:opacity .3s}

/* 파티 칸: 세나 키우기 같은 완성 게임처럼 얼굴 그림 위에는 아무것도 덮지 않음
 * 기술 대기는 테두리를 시계 방향으로 채우는 고리(보라, 다 차면 금색), 체력은 그림 아래 얇은 줄 */
/* 파티 칸: 세나 키우기처럼 작은 얼굴 칸을 가운데 한 줄로 (전투 화면을 더 넓게) */
#party{display:grid;grid-template-columns:repeat(5,minmax(0,52px));justify-content:center;gap:12px;padding:6px 10px 5px;background:var(--bg);border-bottom:1px solid var(--line)}
.slot{position:relative;cursor:pointer}
.slot .face{position:relative;aspect-ratio:1;padding:2.5px;border-radius:var(--r);background:conic-gradient(var(--rift) calc((1 - var(--cd,0)) * 360deg),var(--line) 0)}
.slot .face img{display:block;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - 2px)}
.slot.cast .face{animation:slotCast .6s ease-out}
@keyframes slotCast{0%{box-shadow:0 0 0 0 var(--cc,#fff),0 0 18px var(--cc,#fff);transform:scale(1.08)}100%{box-shadow:0 0 0 6px rgba(0,0,0,0);transform:none}}
@media (prefers-reduced-motion:reduce){.slot.cast .face{animation:none}}
.slot.ready .face{background:var(--gold);box-shadow:0 0 10px rgba(242,201,76,.55)}
.slot .hp{height:3px;margin-top:3px;border-radius:2px;background:#3a1010;overflow:hidden}
.slot .hp i{display:block;height:100%;background:var(--ok);width:var(--hp,100%)}
.slot.dead .face img{filter:grayscale(1) brightness(.5)}
.slot.dead .face{background:var(--line)}
.slot.empty{aspect-ratio:1;display:grid;place-items:center;color:var(--dim);font-size:18px;border:1px dashed var(--line);border-radius:var(--r)}

/* 패널 */
#panel{flex:1;overflow-y:auto;padding:10px 10px 18px;background:var(--bg)}
/* 작은 칸 안 글자 세로 가운데 맞춤: 글꼴마다 다른 위아래 여백을 잘라 글자 몸통 기준으로 맞춤 (Black Han Sans는 위로 떠 보임) */
.sbar .st,#bctl button span,.lvb,.rn b,.seg button,#tabs button,.btn{text-box:trim-both cap alphabetic}
/* 요원 격자: 세나 키우기 영웅 목록처럼 한 줄에 4명. 칸 = 얼굴(레벨, 등급) + 이름 + 별 + 조각 줄 + 강화 */
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 5px}   /* 한 줄 5명: 첫 줄이 곧 출전 5명 (세나 키우기 영웅 목록처럼) */
.hc{display:grid;gap:4px;min-width:0}
.hcard{display:grid;gap:3px;padding:3px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;min-width:0}
.hc.locked{padding:4px;border-radius:var(--r);background:var(--panel);border:1px dashed var(--line);cursor:pointer;align-content:start}
.hph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--bg);box-shadow:inset 0 -3px 0 var(--gc,var(--line))}
.hph img{width:100%;height:100%;object-fit:cover;display:block}
.hc.locked .hph img{filter:grayscale(1) brightness(.35)}
.hph .gr{transform:none;left:2px;top:2px;font-size:8px;padding:0 2px;border-width:1px}
.hph .lvb{padding:10px 0 2px;font-size:9px}.hph .lvb b{font-size:12px;margin-left:2px}
.hph .no{position:absolute;inset:auto 0 6px;text-align:center;font:700 10px 'IBM Plex Sans KR';color:var(--dim)}
.hph .up{display:none;position:absolute;right:2px;top:2px;z-index:3;padding:0 3px;border-radius:3px;background:var(--rift);color:#fff;font:700 9px 'IBM Plex Sans KR'}
.hc.canstar .hph .up{display:block}
.hc.inparty .hph .up{top:15px}   /* 출전 표시 아래로 (겹치지 않게) */
.hc.canstar .hcard{border-color:var(--rift);box-shadow:0 0 8px rgba(157,123,255,.5)}
.hn{font:700 12px/1.2 'IBM Plex Sans KR';text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hst{color:var(--gold);font-size:8px;letter-spacing:0;text-align:center;line-height:1}
.hst s{color:#36405A;text-decoration:none}
.sbar.mini{height:4px;margin:1px 2px 0;border-radius:2px}
.hc .hb{min-width:0;min-height:28px;height:28px;padding:0 2px}
/* 분류 4가지: 색 + 그림. 명단과 파티에는 이것만, 세부 역할(돌격, 저격...)은 상세 창에만 */
.t-공격{--tc:#ff6b5b}.t-광역{--tc:#ffa53a}.t-방어{--tc:#5ea8ff}.t-지원{--tc:#4fd88a}
.tic{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:rgba(10,13,20,.85);color:var(--tc);flex:none}
.tic svg{width:10px;height:10px}
.hph .tic{position:absolute;left:2px;bottom:2px;z-index:2;width:14px;height:14px}
.hph .tic svg{width:9px;height:9px}
.hn{font-size:11px;letter-spacing:-.02em}
.hn.long{font-size:9.5px;letter-spacing:-.07em}   /* 아이언사이드처럼 긴 이름도 한 줄에 */   /* 아이언사이드처럼 긴 이름도 한 줄에 다 보이게 */
.hph .pin{position:absolute;right:2px;top:2px;z-index:2;padding:0 3px;border-radius:3px;background:var(--gold);color:#1a1405;font:700 8px/1.35 'IBM Plex Sans KR'}
.hc.inparty .hcard{border-color:rgba(255,210,63,.55)}
.hcard{position:relative}
.hc.canlv .hcard::after{content:'';position:absolute;right:-3px;top:-3px;z-index:4;width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 2px var(--bg)}   /* 경험치로 강화 가능 */
/* 분류 거르기 탭 + 일괄 강화 칸 (한 줄) */
.htop{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tfil{display:flex;gap:4px;flex:1;min-width:0}
.tfil button{flex:1;min-width:0;height:32px;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--dim);display:grid;place-items:center}
.tfil button svg{width:15px;height:15px}
.tfil button b{font:700 12px 'IBM Plex Sans KR';color:inherit}
.tfil button.on{border-color:var(--tc,var(--gold));color:var(--tc,var(--gold));background:var(--panel2)}
.htop .seg{margin:0;flex:none;grid-template-columns:repeat(3,38px)}
.htop .seg button{height:32px;font-size:12px}
.hcount{display:flex;align-items:center;gap:10px;margin:-4px 2px 8px;font-size:11px;color:var(--dim)}
.hcount .xchip{display:inline-flex;align-items:center;gap:3px;padding:0 8px 0 5px;height:24px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.hcount .xchip b{color:#6ff0c8;font:400 13px 'Black Han Sans'}.hcount .xchip .ic{width:15px;height:15px}
.hcount .hall{margin-left:auto}.hcount .hall:disabled{opacity:.4}
.hcount .hall:not(:disabled){border-color:var(--rift);color:#fff;background:rgba(157,123,255,.25)}
.hcount .hsort{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);font:700 11px 'IBM Plex Sans KR'}
.hcount .hsort svg{width:13px;height:13px;color:var(--gold)}
.hcount b{color:var(--gold)}
/* 상세 창: 분류 배지와 세부 역할, 파티 넣기 */
.tbadge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px 1px 3px;border-radius:10px;background:var(--panel2);color:var(--tc);font:700 12px 'IBM Plex Sans KR';vertical-align:2px}
.tbadge .tic{width:16px;height:16px}
.hd-sk p{margin:4px 0 0;flex-basis:100%;font-size:12px;color:var(--dim);line-height:1.45}
.hd-sk{flex-wrap:wrap}
.pswap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 2px}
.pswap button{position:relative;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden;aspect-ratio:1}
.pswap img{width:100%;height:100%;object-fit:cover;display:block}
.pswap span{position:absolute;inset:auto 0 0;padding:6px 0 1px;font:700 9px 'IBM Plex Sans KR';color:#fff;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
.pswap-t{font-size:12px;color:var(--dim);margin-top:6px}
.hc .hb .cost{font-size:11px;gap:2px}.hc .hb .ic{width:12px;height:12px}
/* 요원 상세 창 */
.hdet{text-align:left}
.hd-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.hd-top img{width:84px;height:104px;object-fit:cover;object-position:50% 0;border-radius:var(--r);border:2px solid var(--gc,var(--line))}
.hd-t .gr{position:static;display:inline-block;transform:none;margin-bottom:4px}
.hd-t b{display:block;font:400 24px "Black Han Sans"}
.hd-t .hst{text-align:left;font-size:14px;margin-top:4px}
.hd-seg{margin:0 0 8px}
#hdParty:not(:empty){margin-top:8px}
.hd-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.hd-stat span{display:grid;gap:2px;padding:8px;border-radius:var(--r);background:var(--panel2);font-size:11px;color:var(--dim);text-align:center}
.hd-stat b{font:400 17px "Black Han Sans";color:var(--ink)}
.hd-sk{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:8px 10px;border-radius:var(--r);background:var(--panel2)}
.hd-sk small{color:var(--dim)}.hd-sk b{font:400 15px "Black Han Sans";color:var(--gold)}.hd-sk em{margin-left:auto;font-style:normal;font-size:12px;color:var(--dim)}
.hd-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.hd-btns .btn{min-width:0}
/* 일일 출동 타일: 2칸 + 균열 심층 넓은 칸 */
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.dtile{position:relative;display:grid;align-content:end;justify-items:start;gap:2px;height:118px;padding:10px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(circle at 75% 35%,#2a2140,#0b0d12 70%);color:var(--ink);text-align:left}
.dtile img{position:absolute;right:-6px;top:4px;height:96%;opacity:.9;pointer-events:none}
.dtile::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,16,.9),rgba(8,10,16,.2) 70%);pointer-events:none}
.dtile>span{position:relative;z-index:1}
.dtn{font:400 18px "Black Han Sans"}
.dtk{font-size:12px;color:var(--dim)}.dtk i{font-style:normal;color:var(--gold);font-weight:700}
.dtr{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.dtb{position:absolute!important;top:8px;left:10px;font:700 10px 'IBM Plex Sans KR';color:#cbbcf5}
.dtile.wide{width:100%;height:104px;background:radial-gradient(circle at 80% 40%,#3a1460,#0b0d12 70%);border-color:rgba(157,123,255,.5)}
.dsh{text-align:left}
.ds-top{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.ds-top img{width:64px;height:76px;object-fit:contain;border-radius:var(--r);background:radial-gradient(#2a2140,#0b0d12)}
.ds-top b{display:block;font:400 22px "Black Han Sans"}.ds-top small{display:block;color:var(--dim)}
.dsh .dstep{justify-content:center;margin:6px 0}.dsh .dstep b{font-size:18px;min-width:70px}
.dsh .drw{justify-content:center}
.dsh .hint{font-size:12px;margin:10px 0 0}
.btn small{font-size:10px;font-weight:600;opacity:.8}
/* 메뉴 접기: 메뉴 칸을 숨기고 전투 화면이 남는 높이를 모두 씀 */
#app.folded #panel{display:none}
#app.folded #battle{flex:1;height:auto;max-height:none}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
#tabs button{height:54px;border:0;background:none;color:var(--dim);font:700 15px 'IBM Plex Sans KR';position:relative}
#tabs button.on{color:var(--gold);background:linear-gradient(rgba(242,201,76,.08),rgba(242,201,76,0))}
#tabs button.on::after{content:"";position:absolute;left:30%;right:30%;top:-1px;height:2px;background:var(--gold)}
.dot{position:absolute;top:10px;right:calc(50% - 30px);width:7px;height:7px;border-radius:50%;background:var(--red);display:none}

/* 강화 횟수 고르기: 한 덩어리 막대 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{height:34px;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 13px 'IBM Plex Sans KR'}
.seg button:first-child{border-left:0}
.dcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(90deg,rgba(120,80,200,.10),rgba(0,0,0,0) 60%),var(--panel)}
.dcard.tower{background:linear-gradient(90deg,rgba(220,70,70,.12),rgba(0,0,0,0) 60%),var(--panel)}
.dimg{width:56px;height:64px;border-radius:var(--r);background:radial-gradient(circle at 50% 70%,#2a2140,#0b0d12 75%);overflow:hidden;display:grid;place-items:end center}
.dimg img{max-width:100%;max-height:100%;object-fit:contain}
.dinfo{min-width:0;text-align:left}
.dt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.dt b{font:400 16px "Black Han Sans"}
.dleft{font-size:12px;color:var(--dim);white-space:nowrap}
.dleft i{font-style:normal;color:var(--gold);font-weight:700}
.dd{font-size:12px;color:var(--dim);margin:2px 0 6px}
.dstep{display:flex;align-items:center;gap:6px}
.dstep b{font-size:14px;min-width:46px;text-align:center}
.dstep .btn.sm{min-width:30px;height:26px;padding:0 6px}
.df{font-style:normal;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px}
.df.ez{color:#8fe3a8;background:rgba(143,227,168,.12)}.df.md{color:#ffd98a;background:rgba(255,217,138,.12)}.df.hd{color:#ff7b6b;background:rgba(255,123,107,.12)}
.drw{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--dim)}
.rw{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:700;font-size:13px;white-space:nowrap}
.rw .ic{width:16px;height:16px}
.dbtns{display:grid;gap:6px}
.dbtns .btn{min-width:58px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 58px;gap:10px;align-items:center;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left}
.mrow .mt b{font-size:14px}
.mrow .bar{height:5px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--gold)}
.mrow .mp{font-size:12px;color:var(--dim);white-space:nowrap}
.mrow.done{opacity:.55}
.mrow.bonus{border-color:rgba(185,140,255,.5);background:linear-gradient(90deg,rgba(185,140,255,.12),rgba(0,0,0,0)),var(--panel)}
.attg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.attg{grid-auto-rows:1fr}
.att{position:relative;display:grid;grid-template-columns:1fr;align-content:center;justify-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.att small{font-size:12px;color:var(--dim)}
.att .rw{font-size:14px}.att .rw .ic{width:20px;height:20px}
.att.wk{grid-column:span 2;border-color:rgba(185,140,255,.6);background:linear-gradient(135deg,rgba(185,140,255,.16),rgba(0,0,0,0)),var(--panel)}
.att.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.att.got>:not(.ck){opacity:.2}
.att .ck{position:absolute;inset:0;display:grid;place-items:center;font:400 18px "Black Han Sans";font-style:normal;color:var(--gold);border-radius:var(--r);background:rgba(10,13,22,.45)}
.att-btn{width:100%;margin-top:10px;height:44px}
.seg.two{grid-template-columns:repeat(2,52px);margin:0}
.seg button.on{background:var(--panel2);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}

/* 요원 카드 = 인사 파일: 왼쪽에 세로 증명사진(카드 높이 전체), 사진 위에 등급 도장 */
.card{position:relative;display:grid;grid-template-columns:68px minmax(0,1fr) 86px;column-gap:10px;align-items:stretch;margin-bottom:8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.card .ph{align-self:stretch;position:relative;min-height:92px;background:var(--bg);border-right:1px solid var(--line)}
.card .pt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.card .ph::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc,var(--line))}
.card.locked .pt{filter:grayscale(1) brightness(.4)}
.card .info{display:grid;align-content:center;gap:3px;padding:8px 0;min-width:0}
.card .acts{display:grid;align-content:center;gap:6px;padding:8px 8px 8px 0}
.card .acts .btn{min-width:0;width:100%}
.card .acts [data-act=lv]{min-height:44px}
.card .acts [data-act=star]{min-height:28px;height:28px}
/* 사진 아래쪽 레벨 띠, 등급 도장은 위쪽 */
.lvb{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12px 0 3px;text-align:center;font:400 11px "Black Han Sans";color:var(--dim);background:linear-gradient(rgba(10,13,20,0),rgba(10,13,20,.92) 55%)}
.lvb b{margin-left:3px;font:400 15px "Black Han Sans";color:#fff}
/* 조각 줄: 굵게, 숫자는 줄 안에. 승급할 수 있으면 금색으로 반짝 */
.sbar{position:relative;height:16px;margin-top:3px;border-radius:8px;background:#070A11;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6a4fd0,var(--rift))}
.sbar .st{position:absolute;inset:0;display:grid;place-items:center;font:700 11px/16px 'IBM Plex Sans KR',sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.hc.canstar .sbar i,.card.canstar .sbar i{background:linear-gradient(90deg,#d9a92a,var(--gold))}
.card.canstar [data-act=star]{box-shadow:0 0 12px rgba(157,123,255,.7)}
.nm{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.nm b{font:400 18px/1.1 "Black Han Sans";letter-spacing:.01em}
.role{font-size:12px;font-weight:600;color:var(--dim)}
/* 등급 도장: 시작 화면의 '위험 등급' 도장과 같은 말투 */
.gr{position:absolute;z-index:2;left:4px;top:4px;padding:0 4px;border:1.5px solid currentColor;border-radius:3px;font:700 10px/1.3 'IBM Plex Sans KR',sans-serif;letter-spacing:.06em;transform:rotate(-8deg);background:rgba(10,13,20,.72)}
.g-희귀{color:#8FB8F0}.g-영웅{color:#C2A6FF}.g-전설{color:var(--gold)}
.c-희귀{--gc:#5B86C4}.c-영웅{--gc:var(--rift)}.c-전설{--gc:var(--gold)}
.stars{margin-top:0;color:var(--gold);font-size:12px;letter-spacing:1px}
.stars s{color:#36405A;text-decoration:none}
.stat{display:flex;gap:10px;margin-top:0;font-size:12px;color:var(--dim);white-space:nowrap}
.stat em{font-style:normal;color:var(--ink);font:400 14px "Black Han Sans";margin-left:2px}
.bar{height:5px;border-radius:3px;background:#070A11;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--rift)}
.st{font-size:12px;color:var(--dim);white-space:nowrap}
.st b{font:400 13px "Black Han Sans";color:var(--ink)}
.card.locked .info{padding:0}
.card.locked{min-height:72px}

/* 버튼: 금색 = 주 행동, 보라 테두리 = 승급, 테두리만 = 보조 */
.btn{min-width:92px;min-height:46px;padding:4px 10px;border-radius:var(--r);border:0;background:var(--gold);color:#141824;font:700 14px 'IBM Plex Sans KR';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn .cost i{font-style:normal}
.btn .cost{display:flex;align-items:center;gap:3px;font-family:"Black Han Sans";font-weight:400;font-size:14px}
.btn:disabled{background:var(--panel2);color:#5F6878;box-shadow:none}
.btn.sm{min-width:60px;min-height:32px;font-size:13px}
.btn.blue{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.blue:disabled{background:transparent;color:#5F6878;box-shadow:inset 0 0 0 1px var(--line)}
.btn.rift{background:transparent;color:#CDB8FF;box-shadow:inset 0 0 0 1.5px var(--rift)}
.btn.rift:not(:disabled){background:rgba(157,123,255,.14)}
.btn.rift:disabled{color:#5F6878;box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:12px;color:var(--dim);line-height:1.55}
h3{margin:18px 2px 8px;font:400 16px "Black Han Sans";color:var(--dim)}

/* 훈련소 줄 */
.urow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;margin-bottom:8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.uic{width:44px;height:44px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.uic svg{width:26px;height:26px}
.ut{font:400 17px "Black Han Sans"}
.uv{margin-top:2px;font-size:12px;color:var(--dim)}
.uv em{font-style:normal;color:var(--ok);font-weight:700}

.sbanner{position:relative;height:170px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#080B13}
.sbanner canvas{position:absolute;inset:0;width:100%;height:100%}
.sbanner .tt{position:absolute;left:14px;bottom:12px;right:14px}
.sbanner .tt b{display:block;font:400 28px "Black Han Sans";color:#fff;text-shadow:0 2px 0 #000}
.sbanner .tt span{font-size:13px;font-weight:600;color:var(--gold)}
.sbanner .tt .pity{display:block;margin-top:2px;font-style:normal;font-size:12px;color:#C9D0DE}
.sbanner.small{height:124px}
.sbanner .tag{position:absolute;left:12px;top:12px;padding:1px 6px;border:1.5px solid var(--red);border-radius:3px;color:#FF8A78;background:rgba(10,13,20,.7);font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.06em;transform:rotate(-6deg)}
.sbanner .left{position:absolute;right:12px;top:12px;padding:2px 8px;border-radius:var(--r);background:rgba(10,13,20,.75);color:var(--ink);font-size:12px;white-space:nowrap}
.sgap{height:18px}
.rtable{width:100%;margin-top:14px;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rtable th,.rtable td{padding:7px 8px;text-align:right;white-space:nowrap}
.rtable td em{font:700 10px 'IBM Plex Sans KR';font-style:normal;color:#ff6b5b;margin-left:2px}
.rtable th{font-size:12px}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable th{color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);background:var(--panel2)}
.rtable td{font-family:"Black Han Sans";font-size:13px}
.rtable td:first-child{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:600}
.rtable tr + tr td{border-top:1px solid rgba(47,58,82,.5)}
.wallet{display:flex;gap:14px;justify-content:flex-end;margin:0 2px 8px;font-size:12px;color:var(--dim)}
.wallet span{display:flex;align-items:center;gap:4px}
.wallet b{font:400 14px "Black Han Sans";color:var(--ink)}
.sbanner.locked canvas{filter:grayscale(.8) brightness(.45)}
.sbanner .lock{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);padding:6px 14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(10,13,20,.85);font:400 16px "Black Han Sans";color:#fff;white-space:nowrap}
.slv-r{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;color:var(--dim)}
.slv{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.slv-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slv-h b{font:400 16px "Black Han Sans";color:var(--gold)}
.slv-h span{font-size:12px;color:var(--dim)}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn .cost .ic{width:1.05em;height:1.05em}
.srow .btn{min-height:56px;font-size:15px}
.rates{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.rates div{display:flex;justify-content:space-between;padding:2px 0}

/* 모달 */
/* 균열 심층 화면: 아래로 내려가는 수직 갱도. 위가 얕은 층, 아래가 깊은 층 */
#rift{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;color:var(--ink);
  background:radial-gradient(120% 60% at 50% 0%,rgba(157,123,255,.22),rgba(0,0,0,0) 60%),linear-gradient(#120d22,#07060d 70%)}
#rift.on{display:flex}
/* 열릴 때: 가운데 세로 균열이 갈라지며 양옆으로 열림 */
#rift.opening{animation:rfOpen .55s cubic-bezier(.2,.8,.2,1)}
@keyframes rfOpen{0%{clip-path:inset(0 49.5% 0 49.5%);filter:brightness(2.2)}60%{filter:brightness(1.3)}100%{clip-path:inset(0 0 0 0);filter:none}}
.rf-tear{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(ellipse 6% 60% at 50% 50%,#fff,rgba(200,170,255,.8) 30%,rgba(157,123,255,0) 70%)}
#rift.opening .rf-tear{animation:rfTear .55s ease-out}
@keyframes rfTear{0%{opacity:1;transform:scaleX(.3)}100%{opacity:0;transform:scaleX(8)}}
/* 도전: 현재 층 점으로 빨려 들어가듯 확대 + 보랏빛 번쩍 */
#rift.diving .rf-shaft{transition:transform .6s cubic-bezier(.6,0,.9,.4),opacity .6s;transform:scale(2.4);opacity:0}
#rift.diving .rf-tear{animation:rfDive .6s ease-in forwards;background:radial-gradient(circle at var(--dx,50%) var(--dy,50%),#fff 0,rgba(200,170,255,.9) 12%,rgba(60,20,120,.95) 60%)}
@keyframes rfDive{0%{opacity:0}70%{opacity:.6}100%{opacity:1}}
#rfFx{position:absolute;inset:0;z-index:4;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.rf-depth{margin-left:auto;margin-right:10px;text-align:right}
.rf-depth small{display:block;font-size:11px;color:#a99ad6}
.rf-depth b{font:400 18px "Black Han Sans";color:#cbbcf5;text-shadow:0 0 10px rgba(157,123,255,.8)}
/* 지나온 길 위로 빛이 흘러감 */
.rf-flow{stroke-dasharray:4 18;animation:rfFlow 1.2s linear infinite}
@keyframes rfFlow{to{stroke-dashoffset:-22}}
/* 근원체 점: 붉은 고리가 천천히 돎 */
.rn.boss::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(255,107,91,.7);animation:rfSpin 6s linear infinite}
.rn.boss.done::before{border-color:rgba(139,120,207,.5);animation:none}
@keyframes rfSpin{to{transform:rotate(360deg)}}
.rn.mile:not(.done){box-shadow:0 0 12px rgba(185,140,255,.6)}
/* 돌파 도장 */
.rf-stamp{position:absolute;z-index:5;margin:-14px 0 0 24px;padding:2px 7px;border:2px solid var(--gold);border-radius:4px;color:var(--gold);font:400 14px "Black Han Sans";transform:rotate(-12deg) scale(2.4);opacity:0;animation:rfStamp .5s cubic-bezier(.2,1.6,.4,1) forwards;pointer-events:none;background:rgba(20,14,36,.8)}
@keyframes rfStamp{to{transform:rotate(-12deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#rift.opening,#rift.opening .rf-tear,.rf-flow,.rn.boss::before,.rf-stamp{animation:none}.rf-stamp{opacity:1;transform:rotate(-12deg)}}
#rift::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:radial-gradient(1.5px 1.5px at 20% 30%,#c9b3ff,transparent),radial-gradient(1px 1px at 70% 60%,#c9b3ff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#9d7bff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent);
  background-size:180px 240px;animation:rfMote 9s linear infinite}
@keyframes rfMote{to{background-position:0 -240px}}
@media (prefers-reduced-motion:reduce){#rift::before{animation:none}}
.rf-head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 8px}
.rf-head small{display:block;font-size:11px;color:#a99ad6}
.rf-head b{font:400 26px "Black Han Sans";color:#e6dcff;text-shadow:0 0 18px rgba(157,123,255,.7)}
.rf-x{width:34px;height:34px;border:1px solid rgba(157,123,255,.4);border-radius:var(--r);background:rgba(20,14,36,.8);color:#cbbcf5;font-size:16px}
.rf-zone{position:relative;margin:0 16px 8px;padding:8px 12px;border-left:3px solid var(--rift);background:linear-gradient(90deg,rgba(157,123,255,.16),rgba(0,0,0,0));text-align:left}
.rf-zone em{font-style:normal;font-size:12px;color:#a99ad6}
.rf-zone b{display:block;font:400 18px "Black Han Sans";color:#efe8ff}
.rf-shaft{position:relative;flex:1;overflow-y:auto;padding:8px 16px 40px;scroll-behavior:smooth}
.rmap{position:relative;margin:0 -16px}
.rmap svg{position:absolute;left:0;top:0}
.rz{position:absolute;left:14px;z-index:1;text-align:left;pointer-events:none}
.rz em{display:block;font-style:normal;font-size:11px;color:var(--ac)}
.rz b{font:400 17px "Black Han Sans";color:#efe8ff;text-shadow:0 0 12px var(--ac)}
.rn{position:absolute;z-index:2;width:34px;height:34px;margin:-17px 0 0 -17px;padding:0;display:grid;place-items:center;border-radius:50%;border:2px solid #5b4a8f;background:#1a1330;color:#8f84b4;font:400 13px "Black Han Sans"}
.rn .ic{width:18px;height:18px}
.rn.mile{border-radius:8px;transform:rotate(45deg)}.rn.mile .ic{transform:rotate(-45deg)}
.rn.boss{width:52px;height:52px;margin:-26px 0 0 -26px;border-color:#ff6b5b;background:radial-gradient(#3a1420,#140a14);overflow:visible}
.rn.boss img{width:44px;height:44px;object-fit:contain;border-radius:50%}
.rn .rl{position:absolute;top:100%;left:50%;margin-top:3px;transform:translateX(-50%);font:400 11px "Black Han Sans";color:#cbbcf5;white-space:nowrap}
.rn.mile .rl{transform:translateX(-50%) rotate(-45deg);margin-top:8px}
.rn.done{border-color:#8b78cf;background:#3b2d6b;color:#d9ccff}
.rn.lock{opacity:.7}
.rn.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 5px rgba(242,201,76,.18),0 0 20px rgba(242,201,76,.7);animation:rfPulse 1.4s ease-in-out infinite}
.rn.pop{animation:rnPop .5s ease-out}
@keyframes rnPop{40%{scale:1.35}}
@keyframes rfPulse{50%{box-shadow:0 0 0 9px rgba(242,201,76,.06),0 0 26px rgba(242,201,76,.9)}}
.rme{position:absolute;z-index:3;width:40px;height:40px;margin:-62px 0 0 -20px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;box-shadow:0 4px 10px #000;transition:left .7s ease-in-out,top .7s ease-in-out;pointer-events:none}
.rme img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
@media (prefers-reduced-motion:reduce){.rme{transition:none}.rn.cur,.rn.pop{animation:none}}
.rf-foot{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(157,123,255,.3);background:rgba(10,7,20,.92)}
.rf-foot .tt b{font:400 20px "Black Han Sans";color:var(--gold)}
.rf-foot .tt div{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:#a99ad6}

.mbox{width:100%;max-width:360px;padding:20px 18px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;box-shadow:0 10px 40px #000}

#splash{position:absolute;inset:0;z-index:30;background:var(--bg)}

.aiu-mark{width:min(64vw,236px);height:auto;display:block;overflow:visible}

.sp-tag{margin-top:-4px;min-height:22px;text-align:center;font:500 14px/1.6 'IBM Plex Sans KR',sans-serif;color:#d6cff0;letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.sp-tag span{opacity:0;animation:tagCh .06s forwards}
@keyframes tagCh{to{opacity:1}}
/* 시즌 이름: 표어가 다 써진 뒤 떠오르고, 빛줄기가 주기적으로 지나감 */
.sp-season{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin-top:-8px;padding:5px 14px;border-radius:999px;border:1px solid rgba(180,140,255,.6);background:rgba(40,20,80,.55);font:700 12px 'IBM Plex Sans KR',sans-serif;color:#e6dcff;opacity:0;animation:seasonIn .6s ease-out 2.9s forwards}
.sp-season b{color:#ffd23f}
.sp-season::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:seasonShine 2.8s ease-in-out 3.6s infinite}
@keyframes seasonIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes seasonShine{60%,100%{left:120%}}

.aiu-stamp{position:absolute;right:-14px;top:-14px;padding:3px 7px;border:2px solid #E0503E;border-radius:4px;color:#E0503E;font:700 11px 'IBM Plex Sans KR',sans-serif;letter-spacing:.12em;transform:rotate(12deg);opacity:.88;background:rgba(18,21,28,.6)}

.sp-sub{font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--dim)}

.sp-bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sp-bar{position:relative}
/* 로딩 바: 매 프레임 width 를 직접 바꿔 부드럽게 차오름 (transition 없음), 끝에 작은 빛 */

.sp-skip.ready{font-size:14px;font-weight:600;letter-spacing:.2em;margin-right:-.2em;color:var(--ink);opacity:1;animation:tapBlink 1.4s ease-in-out infinite}

'use strict';
/* ============================================================
 * AIU (이상현상 전담수사팀) — 화면과 전투 (core.js 의 규칙을 사용)
 *  구조: 저장 상태 S(영구) / 전투 상태 R(일시) / 그리기 / UI 패널
 * ============================================================ */
const C = window.Core;
if (!C) { document.body.textContent = '게임 규칙을 불러오지 못했습니다.'; throw new Error('Core 없음'); }
const $ = id => document.getElementById(id);
const SAVE_KEY = 'lamp-knights-save-v1';

/* ---------- 저장 / 불러오기 (저장소가 막힌 환경에서도 게임은 계속) ---------- */
let storageOk = true;
function readSave() {
  try { return localStorage.getItem(SAVE_KEY); } catch (e) { storageOk = false; return null; }
}
function writeSave() {
  if (!storageOk) return;
  try { S.lastSeen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch (e) { storageOk = false; toast('이 브라우저에서는 저장이 되지 않아요'); }
}
let S = C.loadFromString(readSave(), Date.now()).state;
C.dailyReset(S, new Date());   // 처음 켤 때 날짜가 바뀌었으면 일일 출동, 임무 새로
const firstRun = !readSave();

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }
let bannerT = 0;
function banner(msg) { const b = $('banner'); b.textContent = msg; b.style.opacity = 1; clearTimeout(bannerT); bannerT = setTimeout(() => b.style.opacity = 0, 1400); }
window.addEventListener('error', e => toast('오류가 발생했어요: ' + (e.message || '알 수 없음')));

/* ---------- 지역 테마 (챕터마다 순환) ---------- */
const THEMES = [
  { name: '빗속 뒷골목', boss: '우산 쓴 남자' },
  { name: '안개 항구',   boss: '안개 등대지기' },
  { name: '네온 유흥가', boss: '네온 마네킹' },
];
const theme = () => THEMES[Math.floor((S.stage - 1) / 10) % THEMES.length];

/* ---------- 그림 (빌드 때 assets/art 의 webp 가 data URI 로 들어감) ----------
 * spr_<id>: 전신 그림 (요원은 오른쪽, 이상체와 근원체는 왼쪽을 봄, 배경은 투명)
 * card_<id>: 요원 얼굴 카드, key: 시작 화면 그림
 * 그림을 못 불러오면 아래 임시 그림(캔버스로 직접 그린 모습)으로 대신함 */
const ART = /*ART*/{};
const IMG = {};
for (const [k, src] of Object.entries(ART)) { const im = new Image(); im.decoding = 'async'; im.src = src; IMG[k] = im; }
const imgOk = k => { const im = IMG[k]; return !!(im && im.complete && im.naturalWidth > 0); };
/* 어두운 바닥에서도 보이도록 전신 그림 둘레에 얇은 빛 테두리를 붙인 판을 한 번만 만들어 둠
 * (매 프레임 테두리를 그리면 느려서 미리 구움). 요원은 밝은 빛, 이상체와 근원체는 보랏빛 */
const RIM = {};
function makeRim(k) {
  const im = IMG[k], pad = 7, w = im.naturalWidth, h = im.naturalHeight;
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const q = c.getContext('2d'); if (!q) return;
  for (let a = 0; a < 16; a++) q.drawImage(im, pad + Math.cos(a * Math.PI / 8) * pad * 0.7, pad + Math.sin(a * Math.PI / 8) * pad * 0.7);
  q.globalCompositeOperation = 'source-in';
  const hero = new RegExp('^spr_(' + C.HEROES.map(h => h.id).join('|') + ')(_[cd])?$').test(k);   // 요원 전신 그림 (새 요원 그림이 오면 자동으로)
  q.fillStyle = hero ? 'rgba(215,224,255,.55)' : 'rgba(176,120,255,.8)'; q.fillRect(0, 0, c.width, c.height);
  q.globalCompositeOperation = 'source-over'; q.drawImage(im, pad, pad);
  // 맞았을 때 덮어 그리는 흰 실루엣 (같은 크기, 같은 여백)
  const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
  const wq = wc.getContext('2d'); wq.drawImage(im, pad, pad); wq.globalCompositeOperation = 'source-in'; wq.fillStyle = '#fff'; wq.fillRect(0, 0, wc.width, wc.height);
  // 발 가운데: 그림 맨 아래 6% 줄에서 칠해진 가로 범위의 가운데 (자세가 바뀌어도 발 자리에 맞춰 그리려고)
  let ax = 0.5;
  try {
    const y0 = pad + Math.floor(h * 0.94), dh = Math.max(1, Math.floor(h * 0.06)), d = wq.getImageData(pad, y0, w, dh).data;
    let lo = w, hi = -1;
    for (let yy = 0; yy < dh; yy++) for (let xx = 0; xx < w; xx++) if (d[(yy * w + xx) * 4 + 3] > 60) { if (xx < lo) lo = xx; if (xx > hi) hi = xx; }
    if (hi > lo) ax = (lo + hi) / 2 / w;
  } catch (e) { /* 읽기 실패 시 가운데 */ }
  RIM[k] = { c, pad, white: wc, ax };
  if (window.createImageBitmap) Promise.all([createImageBitmap(c), createImageBitmap(wc)]).then(([bc, bw]) => { RIM[k].c = bc; RIM[k].white = bw; }).catch(() => { /* 캔버스 그대로 씀 */ });
}
/** 모든 그림이 준비될 때까지 기다림 (실패한 그림은 건너뜀, 최대 4초) */
const artReady = Promise.race([
  Promise.all(Object.entries(IMG).map(([k, im]) => (im.decode ? im.decode() : Promise.resolve()).then(() => { if (k.startsWith('spr_')) makeRim(k); }).catch(() => {}))),
  new Promise(r => setTimeout(r, 4000)),
]);

/* ---------- 요원 외형 (그림을 못 불러왔을 때 쓰는 임시 모습: 사람 얼굴 + 역할 장비) ----------
 * 그림 주문서의 외모와 같게: 머리 색과 모양, 피부, 옷 색 */
const LOOK = {
  knight: { coat: '#2f3a52', trim: '#5d6b86', hair: '#2a2620', hairStyle: 'buzz',  skin: '#d9b896' },   // 램파트: 짧은 머리, 진압 조끼
  archer: { coat: '#2f4436', trim: '#55705c', hair: '#b9bcc6', hairStyle: 'bob',   skin: '#ecd3bd' },   // 롱샷: 은회색 단발, 초록 후드
  mage:   { coat: '#4a2c2a', trim: '#8a5a3a', hair: '#c4472f', hairStyle: 'messy', skin: '#e3c2a4' },   // 블레이즈: 붉은 머리, 가죽 재킷
  priest: { coat: '#d4d5da', trim: '#9a3a42', hair: '#1c1a22', hairStyle: 'tail',  skin: '#efd6c2' },   // 헤일로: 검은 묶음 머리, 흰 비옷
  dark:   { coat: '#18171d', trim: '#6b4fa0', hair: '#121116', hairStyle: 'fringe', skin: '#d8bea6' },  // 나이트폴: 한쪽 눈 가린 앞머리, 검은 정장
  // 새 요원 (전신 그림이 오기 전까지 이 모양으로 그림)
  scanner:  { coat: '#26404a', trim: '#5fe8d0', hair: '#3a2c22', hairStyle: 'bob',    skin: '#ecd3bd', gear: 'goggle' },   // 스캐너: 고글, 정찰 드론
  breaker:  { coat: '#3a3d44', trim: '#8a8f9c', hair: '#1f1c18', hairStyle: 'buzz',   skin: '#c9a27e', gear: 'helmet' },   // 브레이커: 방탄 헬멧, 해머
  echo:     { coat: '#3a2a44', trim: '#ff8ad8', hair: '#e9e2f0', hairStyle: 'tail',   skin: '#efd6c2', gear: 'headset' },  // 에코: 헤드셋, 음파 장치
  requiem:  { coat: '#141418', trim: '#f2f0e6', hair: '#8c8c94', hairStyle: 'buzz',   skin: '#d9b896' },                   // 레퀴엠: 신부복 흰 깃, 산탄총
  ironside: { coat: '#4b5872', trim: '#ffb02e', hair: '#2a2018', hairStyle: 'tail',   skin: '#e3c2a4', gear: 'helmet' },   // 아이언사이드: 외골격, 큰 방패
  blackbox: { coat: '#2c2a26', trim: '#ffc85a', hair: '#d8d8dc', hairStyle: 'fringe', skin: '#efe3d6', gear: 'glasses' },  // 블랙박스: 안경, 격리 상자
  ghost:    { coat: '#121826', trim: '#7ff2ff', hair: '#0f0f14', hairStyle: 'bob',    skin: '#e8d2c0', gear: 'visor' },    // 고스트: 광학 위장, 소음기 권총
};
function rr(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + p));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/** 사람 머리 (오른쪽을 보는 옆얼굴 기준, hy = 머리 중심 높이) */
function drawHumanHead(g, id, hy, s) {
  const L = LOOK[id], r = s * 0.17;
  // 목과 얼굴
  g.fillStyle = shade(L.skin, -25); g.fillRect(-s * 0.04, hy + r * 0.6, s * 0.08, s * 0.08);
  g.fillStyle = L.skin; g.beginPath(); g.ellipse(s * 0.01, hy, r * 0.92, r, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(s * 0.12, hy - s * 0.02); g.lineTo(s * 0.19, hy + s * 0.04); g.lineTo(s * 0.12, hy + s * 0.07); g.fill();   // 코
  // 머리카락
  g.fillStyle = L.hair;
  if (L.hairStyle === 'buzz') { g.beginPath(); g.arc(0, hy - s * 0.01, r * 1.0, Math.PI * 1.02, Math.PI * 1.98); g.fill(); }
  else if (L.hairStyle === 'bob') { g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.08, Math.PI * 0.85, Math.PI * 2.02); g.lineTo(s * 0.06, hy - s * 0.04); g.lineTo(-s * 0.16, hy + s * 0.13); g.closePath(); g.fill(); }
  else if (L.hairStyle === 'messy') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.05, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    for (const [x, y] of [[-0.12, -0.17], [-0.02, -0.21], [0.08, -0.18], [0.15, -0.1]]) { g.beginPath(); g.moveTo(x * s, hy + y * s + s * 0.06); g.lineTo(x * s + s * 0.05, hy + y * s); g.lineTo(x * s + s * 0.07, hy + y * s + s * 0.07); g.fill(); }
  } else if (L.hairStyle === 'tail') {
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.04, Math.PI * 0.95, Math.PI * 2.0); g.fill();
    g.beginPath(); g.ellipse(-s * 0.17, hy + s * 0.04, s * 0.05, s * 0.13, 0.35, 0, 7); g.fill();   // 묶은 머리
  } else { // fringe: 한쪽 눈을 가린 앞머리
    g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.06, Math.PI * 0.9, Math.PI * 2.0); g.fill();
    g.beginPath(); g.moveTo(s * 0.02, hy - s * 0.16); g.quadraticCurveTo(s * 0.2, hy - s * 0.1, s * 0.15, hy + s * 0.06); g.lineTo(s * 0.06, hy - s * 0.02); g.closePath(); g.fill();
  }
  // 눈 (나이트폴은 빛나는 호박색)
  g.fillStyle = id === 'dark' ? '#ffb31a' : '#1b1b22';
  g.fillRect(s * 0.08, hy - s * 0.015, s * 0.035, s * 0.03);
  // 머리 장비
  if (L.gear === 'goggle' || L.gear === 'visor') { g.fillStyle = L.trim; g.globalAlpha = 0.9; g.fillRect(-s * 0.02, hy - s * 0.04, s * 0.17, s * 0.045); g.globalAlpha = 1; }
  else if (L.gear === 'glasses') { g.strokeStyle = '#e8e8ee'; g.lineWidth = s * 0.012; g.strokeRect(s * 0.06, hy - s * 0.035, s * 0.07, s * 0.05); }
  else if (L.gear === 'helmet') { g.fillStyle = shade(L.coat, -10); g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.12, Math.PI * 0.98, Math.PI * 2.02); g.fill(); g.fillStyle = L.trim; g.fillRect(-r, hy - s * 0.04, r * 2.1, s * 0.025); }
  else if (L.gear === 'headset') { g.strokeStyle = L.trim; g.lineWidth = s * 0.025; g.beginPath(); g.arc(0, hy - s * 0.02, r * 1.12, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); g.fillStyle = L.trim; g.fillRect(-s * 0.05, hy - s * 0.03, s * 0.06, s * 0.08); }
  if (id === 'knight') { g.strokeStyle = 'rgba(120,60,60,.8)'; g.lineWidth = s * 0.012; g.beginPath(); g.moveTo(s * 0.07, hy + s * 0.08); g.lineTo(s * 0.12, hy + s * 0.12); g.stroke(); }   // 턱 흉터
  // 차가운 테두리 빛 (누아르 림 라이트): 필터 없이 선 하나
  g.strokeStyle = 'rgba(170,195,255,.45)'; g.lineWidth = s * 0.018; g.lineCap = 'round';
  g.beginPath(); g.arc(0, hy, r * 1.05, Math.PI * 1.0, Math.PI * 1.55); g.stroke();
}

/** 전신 그림 한 장 그리기. h = 화면 높이(지도 단위), 발이 (x, y)
 * 숨 쉬듯 살짝 늘었다 줄고, 공격(swing)하면 보는 쪽으로 몸을 기울이며, 맞으면(hurt) 좌우로 떨림.
 * face: 1 이면 그림 그대로, -1 이면 좌우를 뒤집음. sh = 그림자 반지름 */
let walkFlap = 0;
// 시험용: 자동 검수 스크립트가 그림과 동작 그림을 직접 그려 볼 수 있게 (게임 동작에는 영향 없음)
window.AIU_TEST = { IMG, RIM, drawSprite: (...a) => drawSprite(...a) };   // drawHeroRt 가 걷는 중이면 코트 자락 흔들림 세기를 넣어 줌
function drawSprite(g, im, x, y, h, t, swing, hurt, face, sh, rim) {
  const w = h * im.naturalWidth / im.naturalHeight;
  g.save(); g.translate(x, y);
  if (hurt > 0) g.translate(Math.sin(hurt * 40) * hurt * 3, 0);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 0, sh, sh * 0.24, 0, 0, 7); g.fill();
  if (face < 0) g.scale(-1, 1);
  // 공격: 윗몸을 앞으로 휘며 앞으로 내딛음 (swing 1 → 0 으로 줄어들며 원래 자세로)
  const lunge = Math.sin(Math.min(1, swing) * Math.PI) * 0.6 + swing * 0.4;
  g.scale(1 + lunge * 0.04, 1 + Math.sin(t * 3 + x * 0.05) * 0.012 - lunge * 0.04);   // 숨쉬기, 내딛을 때 살짝 눌림
  drawRimmed(g, im, rim, -w * (rim ? rim.ax : 0.5) + lunge * h * 0.14, -h, w, h, lunge * 0.16 + Math.sin(t * 2.2 + x) * 0.006, walkFlap, hurt > 0.75 ? (hurt - 0.75) * 1.6 : 0);
  g.restore();
}

/** 그림을 (x, y, w, h) 칸에 그림. 빛 테두리 판(rim)이 있으면 테두리까지 같은 비율로 */
function drawRimmed(g, im, rim, x, y, w, h, bend = 0, flap = 0, flash = 0, slice = true) {
  if (!GQ.hi) flap = 0;   // 낮음: 옷자락 흔들림 끔 (윤곽 빛은 그림 한 장에 합쳐져 있어 비용이 없으므로 유지)
  const src = rim ? rim.c : im, pad = rim ? rim.pad : 0, k = w / im.naturalWidth;
  const sw = src.width, sh = src.height, dx = x - pad * k, dy = y - pad * k, dw = sw * k, dh = sh * k;
  // 반투명(연기) 그림은 띠로 자르면 겹친 자리에 줄이 생김 → 발을 축으로 통째로 기울이기만 함
  let saved = false;
  if (!slice && bend) { g.save(); saved = true; g.translate(x + w / 2, y + h); g.rotate(bend * 0.9); g.translate(-(x + w / 2), -(y + h)); bend = 0; flap = 0; }
  // 불투명 그림: 가로 띠 N개로 잘라 발은 고정, 위로 갈수록 bend 만큼 더 밀어 그림 → 허리가 휨. flap: 아래 띠가 물결처럼 흔들림
  const N = (bend || flap) && GQ.hi ? 9 : 1;
  for (let i = 0; i < N; i++) {
    const f0 = i / N, f1 = (i + 1) / N, fm = (f0 + f1) / 2, up = 1 - fm;
    const off = bend * up * up * h + (fm > 0.55 ? Math.sin(R.t * 13 + fm * 7) * flap * (fm - 0.55) * h : 0);
    const sy = Math.floor(f0 * sh), ey = i < N - 1 ? Math.floor(f1 * sh) : sh, shh = ey - sy;
    // 아래로 0.5 만큼 겹쳐 그려 띠 사이 틈을 막음 (불투명 그림이라 겹침이 보이지 않음)
    const ov = N > 1 && i < N - 1 ? 0.5 : 0;
    g.drawImage(src, 0, sy, sw, shh, dx + off, dy + sy * k, dw, shh * k + ov);
    if (flash > 0 && rim) { g.globalAlpha = flash; g.drawImage(rim.white, 0, sy, sw, shh, dx + off, dy + sy * k, dw, shh * k + ov); g.globalAlpha = 1; }
  }
  if (saved) g.restore();
}

/** 요원 그리기. s = 키 기준 크기, swing = 공격 동작(0~1), face: 1 오른쪽 / -1 왼쪽 */
function drawHero(g, id, x, y, s, t, swing, hurt, face = 1) {
  if (imgOk('spr_' + id)) {
    // 동작 그림이 있으면: 공격 중엔 C(공격 자세), 걷는 중엔 B와 D(한 발 내디딤)를 번갈아. 없으면 B 한 장
    let k = 'spr_' + id;
    if (swing > 0.12 && imgOk(k + '_c')) k += '_c';
    else if (walkFlap > 0.02 && imgOk(k + '_d') && Math.floor(t * 5.5 + x * 0.01) % 2) k += '_d';
    // 동작 그림은 머리 크기를 맞춰 만들었으므로, 서 있는 그림과의 높이 비율 그대로 그림
    const hk = s * 1.22 * IMG[k].naturalHeight / IMG['spr_' + id].naturalHeight;
    return drawSprite(g, IMG[k], x, y, hk, t, swing, hurt, face, 0.3 * s, RIM[k]);
  }
  const L = LOOK[id], bob = Math.sin(t * 5 + x) * s * 0.02;
  g.save(); g.translate(x, y);
  if (face < 0) g.scale(-1, 1);
  // 캔버스 필터는 매우 느려서(측정: 초당 1.3프레임) 쓰지 않음. 맞으면 몸이 좌우로 떨림
  if (hurt > 0) g.translate(Math.sin(hurt * 40) * hurt * 3, 0);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0, 0, s * 0.3, s * 0.07, 0, 0, 7); g.fill();
  g.translate(0, bob);
  g.fillStyle = '#16161c'; g.fillRect(-s * 0.12, -s * 0.2, s * 0.09, s * 0.2); g.fillRect(s * 0.03, -s * 0.2, s * 0.09, s * 0.2);
  // 몸: 긴 코트(옷자락이 살짝 펄럭임), 빛 받는 왼쪽 면
  const bg = g.createLinearGradient(-s * 0.2, 0, s * 0.2, 0); bg.addColorStop(0, shade(L.coat, 28)); bg.addColorStop(1, shade(L.coat, -18));
  const flap = Math.sin(t * 6) * s * 0.02;

/* ---------- 전투 상태 (저장 안 함) ---------- */
const R = { enemies: [], proj: [], fx: [], texts: [], heroes: {}, t: 0, buff: 0, wipe: 0, boss: null, bossT: 0,
  cam: { x: 0, y: MAPH / 2 - 220 }, A: { x: 0, y: MAPH / 2 - 220 }, heading: -1.57, spawnT: 0, roam: null, mapStage: 0 };
const cv = $('cv'), g = cv.getContext('2d');

let W = 360, H = 300, DPR = 1, u = 1;
/* 전투 화면 해상도: 화면 픽셀이 많을수록 느려짐 (측정: 3배 → 2배로 프레임 2배, 1.5배로 3배).
 * 최대 2배로 시작하고, 2초 평균이 초당 45프레임 아래면 0.25씩 낮춤 (최저 1배). 저장해서 다음에도 씀 */
let dprCap = 2;
try { const v = parseFloat(localStorage.getItem('aiu-dpr')); if (v >= 1 && v <= 2) dprCap = v; } catch (e) { /* 저장 불가 */ }
/* 그래픽 설정 (세븐나이츠 키우기의 그래픽 품질, 프레임 설정과 같은 역할)
 * hi: 높음이면 안개, 등불 반사, 윤곽 빛, 몸 휘기, 비 90줄. 낮음이면 모두 끄고 비 30줄, 해상도 1배

const GQ = { hi: true, fps60: true, auto: true };
try { Object.assign(GQ, JSON.parse(localStorage.getItem('aiu-gfx') || '{}')); } catch (e) { /* 저장 불가 */ }

function resize() {

/* ---------- 스테이지 지도: 경계가 있는 넓은 들판 (화면 약 3×4개) ----------

/* ---------- 출동 (일일 출동, 균열 심층) ----------
 * 지금 지도의 이상체를 치우고 출동 근원체 하나와 30초 동안 싸움. 이기면 보상, 지면 그대로 (입장 횟수는 안 줄어듦).

function startChal(kind, id, lv) {

  if (R.boss) return toast('근원체 봉쇄가 끝난 뒤 출동할 수 있어요');
  if (!alive().length) return toast('요원이 회복한 뒤 출동할 수 있어요');

  const name = kind === 'tower' ? `균열 심층 ${lv}층` : `${C.dungeonById(id).name} ${lv}단계`;
  R.chal = { kind, id, lv, eq, name };
  // 지금 사냥하던 지도를 그대로 맡겨 둠 (출동이 끝나면 이 장면으로 돌아옴)

}
/** 출동 전에 맡겨 둔 지도로 복귀: 이상체, 요원 위치와 체력, 화면 위치까지 그대로 */

  } catch (e) { toast(e.message); }

  }, 1600);

function addText(x, y, txt, col, big) { if (R.texts.length < 60) R.texts.push({ x, y, txt, col, big, life: 0.9 }); }

/** 피해 적용 (치명타 판정 포함). 처치 시 보상 */
function damage(e, base) {

  const crit = Math.random() < C.critChance(S.up.crit);
  // 스캐너 표식이 붙은 적은 받는 피해 증가
  const dmg = base * (R.buff > 0 ? 1.5 : 1) * (crit ? C.CRIT_DMG : 1) * (e.mark > 0 ? 1 + (e.markAmp || 0) : 1);

  addText(e.x + (Math.random() - 0.5) * e.size * 0.7, e.y - e.size * (0.75 + Math.random() * 0.35), C.formatNum(dmg), crit ? '#ffd23a' : '#fff', crit);

function kill(e) {

function portrait(id) {

function sortHeroes(list, pids) {

function drawSummonBanner() {

    const c = $(id); if (!c) continue;
    const w = c.clientWidth || 360, h = c.clientHeight || 150;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    const p = c.getContext('2d'); if (!p) continue; p.scale(d, d);
    p.fillStyle = '#0b0d12'; p.fillRect(0, 0, w, h);
    if (imgOk(key)) drawCover(p, IMG[key], w, h, ax, ay);
    else if (id !== 'sbc2') drawHero(p, id === 'sbc' ? 'dark' : 'mage', w * 0.74, h * 1.02, h * 0.95, 1, 0.3, 0);
    else C.STARTER_IDS.forEach((hid, i) => drawHero(p, hid, w * (0.5 + i * 0.13), h * 1.04, h * 0.82, 1, 0, 0));
    const sh = p.createLinearGradient(0, 0, w * 0.62, 0); sh.addColorStop(0, 'rgba(8,10,16,.88)'); sh.addColorStop(1, 'rgba(8,10,16,0)');
    p.fillStyle = sh; p.fillRect(0, 0, w, h);

    if (cur) {   // 확대 기준점을 현재 층 점으로
      const r = cur.getBoundingClientRect(), er = el.getBoundingClientRect(), sr = sh.getBoundingClientRect();
      sh.style.transformOrigin = `${r.left + r.width / 2 - sr.left}px ${r.top + r.height / 2 - sr.top + sh.scrollTop}px`;
      el.style.setProperty('--dx', ((r.left + r.width / 2 - er.left) / er.width * 100).toFixed(1) + '%');
      el.style.setProperty('--dy', ((r.top + r.height / 2 - er.top) / er.height * 100).toFixed(1) + '%');
    }
    b.disabled = true; el.classList.add('diving');
    setTimeout(() => { closeRift(); sh.style.transformOrigin = ''; startChal('tower', null, S.tower + 1); addFx({ k: 'flash', life: 0.4 }); }, 620);
  }
});

/* ---------- 요원 상세 (카드를 누르면): 능력치, 기술, 조각, 강화와 승급 ---------- */
let detId = null;
function openHeroDetail(id) {
  detId = id; const h = C.heroById(id), d = S.heroes[id];
  openModal(`<div id="hdet" class="hdet c-${h.grade}">
    <div class="hd-top"><img src="${ART['id_' + id] || portrait(id)}" alt=""><div class="hd-t"><span class="gr g-${h.grade}">${h.grade}</span>

    ${d.owned ? `<div class="hd-stat"><span>레벨<b id="hdLv"></b></span><span>공격력<b id="hdAtk"></b></span><span>체력<b id="hdHp"></b></span></div>
    <div class="hd-sk"><small>기술</small><b>${h.skill.name}</b><em>재사용 ${h.skill.cd}초</em><p>${skillText(h)}</p></div>
    <div class="sbar"><i id="hdBar"></i><span class="st" id="hdSh"></span></div>
    <div id="hdParty"></div>
    <div class="seg hd-seg">${[[1, '1회'], [10, '10회'], [0, '최대']].map(([v, l]) => `<button data-act="bulk" data-v="${v}" class="${bulk === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="hd-btns"><button class="btn sm rift" data-act="star" data-h="${id}" id="hdStar">승급</button>
      <button class="btn" data-act="lv" data-h="${id}" id="hdUp"><span class="bl"></span><span class="cost">${icon('gold')}<i></i></span></button></div>`
    : `<div class="hd-sk"><small>기술</small><b>${h.skill.name}</b><em>재사용 ${h.skill.cd}초</em><p>${skillText(h)}</p></div>
      <p>${h.limited ? '특별 채용(한정)에서만 만날 수 있어요.' : h.grade === '희귀' ? '요원 호출에서 만날 수 있어요.' : '요원 호출이나 정예 호출에서 만날 수 있어요.'}</p>`}
    <div class="mbtns"><button class="btn ghost" data-close>닫기</button></div></div>`, () => { detId = null; });
  fillHeroDetail();
}
function fillHeroDetail() {
  const id = detId; if (!id || !$('hdet')) return;
  const h = C.heroById(id), d = S.heroes[id];
  $('hdStars').innerHTML = starStr(d.stars);
  if (!d.owned) return;
  // 파티: 넣기 / 빼기. 가득 차 있으면 바꿀 요원을 눌러서 자리 교체
  const pids = C.partyIds(S), inP = pids.includes(id), full = pids.length >= C.CONST.PARTY_MAX;
  $('hdParty').innerHTML = inP
    ? `<button class="btn ghost" style="width:100%;margin-bottom:8px" data-act="party" data-h="${id}" ${pids.length <= 1 ? 'disabled' : ''}>출전에서 빼기</button>`
    : full ? `<div class="pswap-t">출전 자리가 가득 찼어요. 바꿀 요원을 눌러요</div><div class="pswap">${pids.map(p => { const ph = C.heroById(p); return `<button data-act="pswap" data-o="${p}" data-h="${id}"><img src="${ART['card_' + p] || portrait(p)}" alt=""><span>${ph.name}</span></button>`; }).join('')}</div>`
    : `<button class="btn" style="width:100%;margin-bottom:8px" data-act="party" data-h="${id}">출전시키기</button>`;
  $('hdLv').textContent = d.lv; $('hdAtk').textContent = C.formatNum(C.heroAtk(id, d.lv, d.stars, S.up.atk)); $('hdHp').textContent = C.formatNum(C.heroHp(id, d.lv, d.stars));
  const need = C.starNeed(d.stars, h.grade), max = need === Infinity;
  $('hdBar').style.width = max ? '100%' : Math.min(100, 100 * d.shards / need) + '%';
  $('hdSh').textContent = max ? '최고 등급' : `조각 ${d.shards} / ${need}`;
  $('hdStar').disabled = max || d.shards < need;
  const { n, cost } = lvPlan(d.lv), up = $('hdUp');
  up.querySelector('.bl').textContent = bulk === 1 ? '강화' : `강화 +${Math.max(n, bulk === 0 ? 1 : bulk)}`;
  up.querySelector('.cost i').textContent = C.formatNum(cost); up.disabled = !(n > 0 && cost <= S.exp);
}

/** 일괄 강화 계획: 1회/10회는 정해진 단계, 최대는 살 수 있는 만큼 */
function lvPlan(lv) {
  if (bulk === 0) { const r = C.heroLvAffordable(lv, S.exp, 1000); return r.n > 0 ? r : { n: 1, cost: C.heroLvCost(lv) }; }
  return { n: bulk, cost: C.heroLvCostBulk(lv, bulk) };
}

/* ---------- 입력 ---------- */
function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  try {
    if (act === 'bulk') { bulk = +b.dataset.v; for (const x of document.querySelectorAll('[data-act=bulk]')) x.classList.toggle('on', +x.dataset.v === bulk); fillHeroDetail(); }
    else if (act === 'starall') {
      // 일괄 승급: 조각이 다 찬 요원을 한 번에 (세나 키우기 영웅관리의 일괄 승급과 같음)
      let n = 0;
      for (const h of owned()) { const d = S.heroes[h.id]; let need; while ((need = C.starNeed(d.stars, h.grade)) !== Infinity && d.shards >= need) { d.shards -= need; d.stars++; n++; } }
      if (!n) return;
      syncHeroes(false); banner(`일괄 승급 ${n}회`); writeSave(); renderPanel();
    }
    else if (act === 'hfil') { hfil = b.dataset.v; renderPanel(); }
    else if (act === 'hsort') { hsort = (hsort + 1) % HSORT.length; try { localStorage.setItem('aiu-hsort', hsort); } catch (e) {} renderPanel(); toast(`${HSORT[hsort]} 정렬`); }
    else if (act === 'party' || act === 'pswap') {
      const id = b.dataset.h, nm = C.heroById(id).name;
      if (act === 'pswap') { if (!C.swapParty(S, b.dataset.o, id)) return; toast(`${C.heroById(b.dataset.o).name} 대신 ${nm} 출전`); }
      else { const r = C.toggleParty(S, id); if (r === 'in') toast(`${nm} 출전`); else if (r === 'out') toast(`${nm} 출전에서 뺐어요`); else return; }
      partyChanged(); fillHeroDetail(); renderPanel(); writeSave();
    }
    else if (act === 'hdet') return openHeroDetail(b.dataset.h);
    else if (act === 'dsheet') return openDungeonSheet(b.dataset.d);
    else if (act === 'rsub') { runSub = b.dataset.v; renderPanel(); }
    else if (act === 'dlv') { dsel[b.dataset.d] = (dsel[b.dataset.d] || 1) + +b.dataset.v; fillDungeonSheet(); }
    else if (act === 'dgo') { modalEl.classList.remove('on'); sheetId = null; startChal('dungeon', b.dataset.d, dsel[b.dataset.d] || 1); }
    else if (act === 'topen') openRift();
    else if (act === 'dsweep') {
      const d = C.dungeonById(b.dataset.d), r = C.sweepDungeon(S, d.id);
      toast(`${d.name} ${S.dbest[d.id]}단계 소탕 완료`); banner('소탕 완료');
      for (const [ic, v] of [['gold', r.gold], ['tix', r.tix], ['exp', r.exp]]) if (v) addText(R.A.x, R.A.y - 70, ({ gold: '+', tix: '호출권 +', exp: '경험치 +' })[ic] + C.formatNum(v), ic === 'exp' ? '#6ff0c8' : '#ffd23a', true);
      writeSave(); renderPanel();
    } else if (act === 'mget') { const g = C.missionClaim(S, +b.dataset.m); if (g) { toast(`보석 ${g}개를 받았어요`); writeSave(); } }
    else if (act === 'mbonus') { const n = C.missionBonus(S); if (n) { toast(`정예 호출권 ${n}장을 받았어요`); writeSave(); } }
    else if (act === 'attend') {
      const r = C.attend(S, new Date());
      if (r) { toast(`출석 ${r.day}일째 보상을 받았어요`); writeSave(); renderPanel(); }
    }
    else if (act === 'lv') {
      const d = S.heroes[b.dataset.h], { n, cost } = lvPlan(d.lv);
      if (cost > S.exp) return toast('경험치가 부족해요. 모의 훈련에서 많이 벌 수 있어요');
      S.exp -= cost; d.lv += n; syncHeroes(false); C.progress(S, 'lvup', n);
    } else if (act === 'star') {
      const d = S.heroes[b.dataset.h], need = C.starNeed(d.stars, C.heroById(b.dataset.h).grade);
      if (d.shards < need) return;
      d.shards -= need; d.stars++; syncHeroes(false); banner(`${C.heroById(b.dataset.h).name} ★${d.stars} 승급`); renderPanel();
    } else if (act === 'up') {
      const id = b.dataset.u, cost = C.upgradeCost(id, S.up[id]);
      if (cost > S.gold) return toast('골드가 부족해요');
      S.gold -= cost; S.up[id]++; C.progress(S, 'train', 1);
    } else if (act === 'sum') doSummon(+b.dataset.n, b.dataset.kind);
    else if (act === 'testOff') showOffline(C.offlineReward(S, 3600));
    else if (act === 'reset') confirmReset();
    updateUI(); writeSave();
  } catch (err) { console.error(err); toast('처리하지 못했어요: ' + err.message); }
}
$('panel').addEventListener('click', onAct);

/* ---------- 뒤로 가기 버튼: 바로 꺼지지 않게 (휴대폰 게임 기본) ----------
 * 열린 창 → 균열 심층 화면 → 접힌 메뉴 펼치기 순서로 하나씩 닫고, 아무것도 없으면 '한 번 더 누르면 종료' 안내.
 * 2초 안에 한 번 더 누르면 그때 나감 */
let backAt = 0;
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;   // 앱(APK)으로 실행 중이면 있음
const keepHist = () => { if (!CapApp) try { history.pushState({ aiu: 1 }, ''); } catch (e) { /* 무시 */ } };
function handleBack() {
  if (modalEl.classList.contains('on')) {
    const c = modalEl.querySelector('[data-close]');
    if (c) c.click(); else modalEl.classList.remove('on');
    return keepHist();
  }
  if ($('rift').classList.contains('on')) { closeRift(); return keepHist(); }
  if ($('app').classList.contains('folded')) { $('app').classList.remove('folded'); for (const x of $('tabs').children) x.classList.toggle('on', x.dataset.tab === tab); renderPanel(); return keepHist(); }
  const now = Date.now();
  if (now - backAt < 2000) { writeSave(); if (CapApp) CapApp.exitApp(); else history.back(); return; }
  backAt = now; toast('한 번 더 누르면 게임을 종료해요'); keepHist();
}
if (CapApp) CapApp.addListener('backButton', handleBack);   // 앱: 안드로이드 뒤로 가기 버튼을 직접 받음
else { keepHist(); window.addEventListener('popstate', handleBack); }   // 브라우저: 기록 한 칸으로 받음
$('modal').addEventListener('click', onAct);   // 요원 상세, 일일 출동 창 안의 버튼
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  // 세나 키우기처럼: 열린 메뉴를 한 번 더 누르면 메뉴 칸이 접히고 전투 화면이 커짐. 접힌 상태에서 아무 메뉴나 누르면 다시 펼침
  const app = $('app');
  if (!app.classList.contains('folded') && b.dataset.tab === tab) { app.classList.add('folded'); for (const x of $('tabs').children) x.classList.remove('on'); return; }
  app.classList.remove('folded');
  tab = b.dataset.tab;
  for (const x of $('tabs').children) x.classList.toggle('on', x === b);
  renderPanel(); $('panel').scrollTop = 0;
});
$('quest').addEventListener('click', () => {
  const g = C.questClaim(S);
  if (!g) { const q = C.questAt(S.q.i); return toast(`${q.text} ${q.need - S.q.p}번 더 하면 받을 수 있어요`); }

});
$('bAuto').addEventListener('click', () => { S.autoSkill = !S.autoSkill; toast(S.autoSkill ? '기술을 자동으로 써요' : '준비된 요원 얼굴을 누르면 기술을 써요'); writeSave(); updateUI(); });
$('bSpd').addEventListener('click', () => { S.speed = S.speed === 2 ? 1 : 2; writeSave(); updateUI(); });
// 파티 칸: 기술이 준비된 요원을 누르면 바로 사용 (자동이 켜져 있어도 먼저 쓸 수 있음)

  else toast(`${C.heroById(id).skill.name} ${Math.ceil(r.cd)}초 남았어요`);
});
// 자동 추적: 켜면 처치가 다 차는 대로 근원체가 나옴, 끄면 계속 순찰만. 봉쇄에 실패하면 저절로 꺼짐 (세나 키우기 자동소환과 같음)
$('bossAuto').addEventListener('click', () => {
  S.farming = !S.farming;
  toast(S.farming ? '자동 추적을 껐어요. 이 구역에서 계속 순찰해요' : '자동 추적을 켰어요. 처치가 다 차면 근원체를 쫓아가요');

$('btnSet').addEventListener('click', () => {

    <div class="setrow"><div><div class="ut">처음부터 다시</div><div class="uv">저장된 진행을 모두 지워요</div></div><button class="btn sm ghost" data-set="reset">초기화</button></div>

modalEl.addEventListener('click', e => {

/* ---------- 요원 호출 / 특별 채용 ---------- */
/** n회 호출. pickup 이면 특별 채용(전설 확률 높음) */
function doSummon(n, kind) {
  let res;
  try { res = C.doSummon(S, n, kind, Math.random); }
  catch (e) { return toast(e.message.replace('습니다', '요').replace('열립니다', '열려요')); }
  const ids = res.ids, pickup = kind === 'pickup';
  S = res.state; C.progress(S, 'summon', n);
  const lvMsg = res.lvUps.length ? `소환 레벨 ${res.lvUps[res.lvUps.length - 1]} 달성! 보석 ${res.lvUps.reduce((a, L) => a + C.levelReward(L).gems, 0)}개, 정예 호출권 ${res.lvUps.reduce((a, L) => a + C.levelReward(L).ptix, 0)}장` : '';
  syncHeroes(false); writeSave();
  openModal(`<h2>${pickup ? '채용 결과' : kind === 'elite' ? '정예 호출 결과' : '호출 결과'}</h2><div class="res ${n === 1 ? 'one' : ''}">${ids.map((id, i) => {
    const h = C.heroById(id);
    return `<div class="rc ${h.grade === '전설' ? 'leg' : ''}" style="animation-delay:${i * 0.07}s"><img src="${portrait(id)}" alt=""><small>${h.name}</small>${res.isNew[i] ? '<span class="new">NEW</span>' : ''}</div>`;
  }).join('')}</div><p>${res.relayHit ? `누적 ${C.CONST.RELAY}회 달성, ${C.heroById('dark').name} 확정 합류` : lvMsg ? lvMsg : res.isNew.some(Boolean) ? '새 요원이 AIU에 합류했어요' : '조각은 요원 탭에서 승급에 써요'}</p><div class="mbtns"><button class="btn" data-close>확인</button></div>`);
  renderPanel();
}

/* ---------- 모달 ---------- */
function openModal(html, onClose) {

    <div class="big">${icon('gold')}<span>${C.formatNum(r.gold)}</span></div>${r.exp ? `<div class="big">${icon('exp')}<span>${C.formatNum(r.exp)}</span></div>` : ''}${r.tix ? `<div class="big">${icon('tix')}<span>${C.formatNum(r.tix)}</span></div>` : ''}<p class="hint">최대 8시간까지 쌓여요</p>
    <div class="mbtns"><button class="btn" data-close="ok">받기</button></div>`, () => { S.gold += r.gold; S.exp += r.exp || 0; S.tix += r.tix || 0; writeSave(); updateUI(); banner('보상 획득'); });
}
function confirmReset() {
  openModal(`<h2>처음부터 다시</h2><p>골드, 요원, 스테이지가 모두 지워져요</p><div class="mbtns"><button class="btn ghost" data-close="no">취소</button><button class="btn" data-close="yes" style="background:linear-gradient(#ff7a6b,#c7332a);color:#fff;box-shadow:0 3px 0 #6d1510">초기화</button></div>`, v => {

  });
}

/* ---------- 앱 생명주기: 숨김 → 복귀 시 오프라인 보상 ---------- */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); writeSave(); }
  else if (hiddenAt) { const r = C.offlineReward(S, (Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); if (r.gold > 0) showOffline(r); }
});
window.addEventListener('pagehide', writeSave);

/* ---------- 시작 ---------- */
const pending = firstRun ? null : C.offlineReward(S, (Date.now() - S.lastSeen) / 1000);
syncHeroes(true); renderPanel(); updateUI();
let started = false, splashReady = false;   // splashReady: 불러오기가 끝나야 화면을 눌러 접속할 수 있음
function startGame() {
  if (started || !splashReady) return; started = true;
  $('splash').style.display = 'none'; paused = false; last = performance.now();
  if (S.migrated) { delete S.migrated; writeSave(); setTimeout(() => toast(`뽑기 개편 보상으로 보석 ${C.CONST.MIGRATE_GEMS.toLocaleString()}개를 받았어요`), 600); }
  if (pending && pending.gold > 0) showOffline(pending);
  else if (firstRun) banner('출동');
}
$('splash').addEventListener('click', startGame);
/* 시작 화면 배경: 요원 다섯 명 그림(key)을 화면 가로 폭에 맞춰 아래에 붙이고, 남는 위쪽은 그림 하늘색으로 이어 칠함.
 * 그 위에 비, 하늘 균열의 보랏빛 번쩍임, 글자가 잘 보이도록 위아래 어둡게 깔기. 그림이 없으면 하늘과 비만 그림 */
{
  // GPT로 만든 타이틀 로고(logo_title)가 있으면 SVG 로고, 도장, 영문, 한글 줄 대신 그 그림 한 장을 씀 (그림 안에 다 들어 있음)
  if (ART.logo_title) { const box = document.querySelector('.aiu'); if (box) box.innerHTML = `<img class="aiu-img" src="${ART.logo_title}" alt="AIU 이상현상 전담수사팀">`; }
  // 표어를 한 글자씩 나눠 차례로 나타나게 (0.6초 뒤 시작, 한 글자 0.07초)
  { const tg = $('spTag'); if (tg) tg.innerHTML = [...tg.dataset.text].map((c, i) => `<span style="animation-delay:${(0.6 + i * 0.07).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }
  const cvs = $('spbg'), q = cvs.getContext('2d'), key = IMG.key;
  const rnd = seeded(20261127);
  const drops = Array.from({ length: 120 }, () => ({ x: rnd(), y: rnd(), l: 10 + rnd() * 18, v: 0.8 + rnd() * 0.7, a: 0.07 + rnd() * 0.16 }));
  let flashNext = 1.2, flashT0 = -9;
  function spDraw(now) {
    if (started || !q) return;
    const W2 = cvs.clientWidth, H2 = cvs.clientHeight, d = Math.min(3, devicePixelRatio || 1);
    if (cvs.width !== Math.round(W2 * d) || cvs.height !== Math.round(H2 * d)) { cvs.width = Math.round(W2 * d); cvs.height = Math.round(H2 * d); }
    q.setTransform(d, 0, 0, d, 0, 0);
    const t = now / 1000;
    q.fillStyle = '#090d1b'; q.fillRect(0, 0, W2, H2);   // 그림 맨 위 하늘색과 같은 색
    let iw = 0, ih = 0, iy = 0, ix = 0;
    if (imgOk('key')) {
      // 가로 폭에 맞추고 아래에 붙임 (요원이 양옆으로 잘리지 않게). 화면이 그림보다 납작하면 위쪽 하늘이 잘림
      // 화면이 그림보다 길쭉하면 조금 키워서 위쪽 빈 하늘을 줄임 (양옆은 최대 7%씩만 잘림)
      const sc = Math.min(W2 / key.naturalWidth * 1.15, Math.max(W2 / key.naturalWidth, H2 * 0.96 / key.naturalHeight));
      iw = key.naturalWidth * sc; ih = key.naturalHeight * sc; ix = (W2 - iw) / 2; iy = H2 - ih;
      q.drawImage(key, ix, iy, iw, ih);
      // 그림 윗선이 보이지 않게 하늘색으로 부드럽게 이음
      if (iy > 0) { const fg = q.createLinearGradient(0, iy, 0, iy + ih * 0.12); fg.addColorStop(0, '#090d1b'); fg.addColorStop(1, 'rgba(9,13,27,0)'); q.fillStyle = fg; q.fillRect(0, iy, W2, ih * 0.12); }
    }
    // 하늘 균열 번쩍임: 3~6초마다 그림 속 균열(가운데 뒤) 자리가 잠깐 밝아짐
    if (t >= flashNext) { flashT0 = t; flashNext = t + 3 + rnd() * 3; }
    const age = t - flashT0;
    if (age < 0.8 && ih) {
      const fl = (1 - age / 0.8) * (Math.sin(age * 55) > -0.3 ? 1 : 0.4);
      const cx = ix + iw * 0.53, cy = iy + ih * 0.42, gl = q.createRadialGradient(cx, cy, 0, cx, cy, iw * 0.5);
      gl.addColorStop(0, `rgba(170,120,255,${0.32 * fl})`); gl.addColorStop(1, 'rgba(170,120,255,0)');
      q.fillStyle = gl; q.fillRect(0, 0, W2, H2);
    }
    // 위쪽 하늘: 천천히 흘러가는 먹구름 + 로고 뒤 보랏빛 균열 빛 (로고를 위로 올려 비던 하늘을 채움)
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 0.27 + t * 0.006 * (1 + i * 0.3)) % 1.4 - 0.2) * W2, cy = H2 * (0.04 + (i % 3) * 0.07), rr = W2 * (0.45 + (i % 2) * 0.2);
      const cg = q.createRadialGradient(cx, cy, 0, cx, cy, rr); cg.addColorStop(0, 'rgba(46,38,82,.55)'); cg.addColorStop(1, 'rgba(46,38,82,0)');
      q.fillStyle = cg; q.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    const lm = document.querySelector('.aiu-img') || document.querySelector('.aiu-mark');
    if (lm) {
      const r = lm.getBoundingClientRect(), cr = cvs.getBoundingClientRect(), lx = r.left + r.width / 2 - cr.left, ly = r.top + r.height / 2 - cr.top;
      const pulse = 0.22 + Math.sin(t * 1.6) * 0.05 + (age < 0.8 ? (1 - age / 0.8) * 0.25 : 0), lr = r.width * 0.9;
      const lg = q.createRadialGradient(lx, ly, 0, lx, ly, lr); lg.addColorStop(0, `rgba(150,100,255,${pulse.toFixed(3)})`); lg.addColorStop(1, 'rgba(150,100,255,0)');
      q.fillStyle = lg; q.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    }
    // 아래쪽 글자(불러오기 줄, 제작사)가 잘 보이게 바닥을 어둡게
    const bot = q.createLinearGradient(0, H2 * 0.72, 0, H2); bot.addColorStop(0, 'rgba(6,8,14,0)'); bot.addColorStop(1, 'rgba(6,8,14,.88)');
    q.fillStyle = bot; q.fillRect(0, H2 * 0.72, W2, H2 * 0.28);
    // 비
    q.lineWidth = 1;
    for (const r of drops) {
      const y = ((r.y + t * r.v) % 1.1 - 0.05) * H2, x = ((r.x - t * r.v * 0.1) % 1 + 1) % 1 * W2;
      q.strokeStyle = `rgba(185,200,240,${r.a})`; q.beginPath(); q.moveTo(x, y); q.lineTo(x - r.l * 0.2, y + r.l); q.stroke();
    }
    requestAnimationFrame(spDraw);
  }
  requestAnimationFrame(spDraw);
}
/* 로딩 바: 약 2.2초 동안 매 프레임 부드럽게 차오름. 지나는 지점마다 문구가 바뀌고, 다 차면 접속 안내 */
{
  const DUR = 2200, steps = [[0, '비 내리는 중'], [0.35, '요원 호출하는 중'], [0.7, '구역 지도 펼치는 중']];
  const fill = $('sp-fill'), msg = $('sp-msg');
  const ease = x => 1 - Math.pow(1 - x, 2.2);   // 처음엔 빠르게, 끝으로 갈수록 천천히
  let t0 = null, artDone = false;
  artReady.then(() => { artDone = true; });
  function loadTick(now) {
    if (started) return;
    if (t0 === null) t0 = now;
    const x = Math.min(1, (now - t0) / DUR), p = ease(x);
    fill.style.width = (p * 100).toFixed(2) + '%';
    let m = steps[0][1]; for (const [at, text] of steps) if (p >= at) m = text;
    if (msg.textContent !== m) msg.textContent = m;
    if (x < 1 || !artDone) { requestAnimationFrame(loadTick); return; }
    // 다 차면 자동으로 넘어가지 않고, 화면을 눌러야 접속
    splashReady = true; msg.textContent = 'READY'; msg.classList.add('ready');
    const tap = $('sp-tap'); tap.textContent = 'TOUCH TO START'; tap.classList.add('ready');
  }
  requestAnimationFrame(loadTick);
}
requestAnimationFrame(loop);
}
</script>
