/* ---------- 메인 루프 ---------- */
let last = performance.now(), uiT = 0, saveT = 0, paused = true;
const modalEl = $('modal');
function loop(now) {
  // 30프레임 설정: 직전 처리 뒤 30ms가 안 지났으면 이번 화면은 건너뜀
  if (!GQ.fps60 && now - last < 30) { requestAnimationFrame(loop); return; }
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {
    // 시작 화면이나 팝업이 떠 있는 동안은 전투를 멈춤 (보스 제한 시간 보호)
    // 히트스톱: 치명타, 기술, 처치 순간 화면이 아주 잠깐 멈췄다 풀림 (타격감의 핵심)
    if (!paused && !storyOn && !modalEl.classList.contains('on')) { if (R.stop > 0) { R.stop -= dt; R.shake = Math.max(0, (R.shake || 0) - dt * 10); } else { update(dt); if (S.speed === 2) update(dt); } }
    if (g && !sleeping) { draw(); if (!paused) perfTick(dt); }
    uiT += dt; if (uiT > 0.15) { uiT = 0; updateUI(); }
    saveT += dt; if (saveT > 5) { saveT = 0; writeSave(); }
  } catch (e) { console.error(e); toast('전투 처리 중 오류: ' + e.message); }
  requestAnimationFrame(loop);
}
function update(dt) {
  if (DPS.on) DPS.t += dt; LOG.t += dt;
  R.t += dt;
  R.buff = Math.max(0, R.buff - dt);
  if (R.mapStage !== S.stage) newMap();   // 스테이지가 바뀌면 새 지도
  // 전멸: 3초 뒤 그 자리에서 부활, 근처 이상체는 물러남(다시 배치)
  if (R.wipe > 0) {
    R.wipe -= dt;
    if (R.wipe <= 0) { syncHeroes(true); R.enemies = R.enemies.filter(e => dist(e, R.A) > 300 && !e.boss); for (const e of R.enemies) e.aggro = false; for (const h of team()) Object.assign(R.heroes[h.id], formSlot(h.id)); }
    return;
  }
  R.enemies = R.enemies.filter(e => e.hp > 0);
  const live = R.enemies.length > 0;
  // 이상체 보충: 지도 위 일반 이상체가 줄면 다른 곳에 새 무리. 처치 수가 차면 보스 등장
  R.spawnT -= dt;
  if (!R.chal && R.spawnT <= 0 && R.enemies.filter(e => !e.boss).length < MAX_FIELD - 4) { spawnCluster(); R.spawnT = 1.5; }
  if (!R.chal && !R.boss && !S.farming && S.kills >= C.CONST.WAVE_KILLS) spawnBoss();
  // 파티 기준점: 싸우는 중이면 요원들 가운데, 아니면 지도에서 가장 가까운 무리(보스가 있으면 보스)를 향해 이동
  const hs = alive();
  const fighting = live && hs.length && (R.enemies.some(e => e.aggro) || hs.some(h => nearestEnemy(R.heroes[h.id], ENGAGE)));
  R.fighting = !!fighting;
  if (fighting) {
    let mx = 0, my = 0; for (const h of hs) { mx += R.heroes[h.id].x; my += R.heroes[h.id].y; }
    R.A.x += (mx / hs.length - R.A.x) * Math.min(1, dt * 2); R.A.y += (my / hs.length - R.A.y) * Math.min(1, dt * 2);
  } else {
    let tp = R.boss || nearestEnemy(R.A, Infinity);
    if (!tp) { if (!R.roam || dist(R.A, R.roam) < 20) R.roam = randPoint(120); tp = R.roam; }   // 이상체가 없으면 지도 산책
    const dx = tp.x - R.A.x, dy = tp.y - R.A.y;
    if (Math.hypot(dx, dy) > 4) R.heading += angDiff(Math.atan2(dy, dx), R.heading) * Math.min(1, dt * 3);
    moveTo(R.A, tp.x, tp.y, 95, dt);
  }
  keepIn(R.A, 60);
  if (R.boss) { R.bossT -= dt; if (R.bossT <= 0) bossFail('근원체 도주'); }
  for (const h of hs) heroAct(h, R.heroes[h.id], dt);

/** 일괄 강화 계획: 1회/10회는 정해진 단계, 최대는 살 수 있는 만큼 */
function lvPlan(lv) {
  if (bulk === 0) { const r = C.heroLvAffordable(lv, S.exp, 1000); return r.n > 0 ? r : { n: 1, cost: C.heroLvCost(lv) }; }
  return { n: bulk, cost: C.heroLvCostBulk(lv, bulk) };
}

/* ---------- 뒤로 가기 버튼: 바로 꺼지지 않게 (휴대폰 게임 기본) ----------
 * 열린 창 → 균열 심층 화면 → 접힌 메뉴 펼치기 순서로 하나씩 닫고, 아무것도 없으면 '한 번 더 누르면 종료' 안내.
 * 2초 안에 한 번 더 누르면 그때 나감 */
/* 앱(APK)에서는 안드로이드 쪽(MainActivity)이 뒤로 가기를 직접 받아 window.aiuBack() 을 부르고,
 * 'exit' 를 돌려받았을 때만 앱을 닫음 (Capacitor 플러그인에 기대지 않음 → 바로 꺼지는 문제 막음).
 * 브라우저에서는 기록 한 칸(history)으로 받음 */
const inApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const keepHist = () => { if (!inApp) try { history.pushState({ aiu: 1 }, ''); } catch (e) { /* 무시 */ } };
let exitAsked = false;
/** 뒤로 가기 한 번 처리. 열린 창을 닫고, 아무것도 없으면 종료 확인 창. 확인 창에서 한 번 더 누르면 'exit' */
function backStep() {
  if (OP.on) { opEnd(); return 'ok'; }
  if (modalEl.classList.contains('on')) {
    if (exitAsked) { writeSave(); return 'exit'; }   // 종료 확인 창이 떠 있을 때 한 번 더 누르면 종료
    const c = modalEl.querySelector('[data-close]');
    if (c) c.click(); else modalEl.classList.remove('on');
    return 'ok';
  }
  if ($('rift').classList.contains('on')) { closeRift(); return 'ok'; }
  if (hpageId) { closeHeroPage(); return 'ok'; }
  if ($('app').classList.contains('herofull')) { closeHeroWin(); return 'ok'; }
  if (!$('app').classList.contains('folded')) { $('app').classList.add('folded'); for (const x of $('tabs').children) x.classList.remove('on'); return 'ok'; }   // 메뉴가 열려 있으면 접기
  askExit(); return 'ok';
}
function askExit() {
  exitAsked = true;
  openModal(`<h2>게임 종료</h2><p>게임을 종료하시겠어요?<br>진행은 저장되고, 꺼 둔 동안에도 요원들이 이상체를 처리해요.</p>
    <div class="mbtns"><button class="btn ghost" data-close="no">취소</button><button class="btn" data-close="exit">종료</button></div>`, v => {
    exitAsked = false;
    if (v === 'exit') { writeSave(); window.aiuExit = true; if (inApp) { try { window.Capacitor.Plugins.App.exitApp(); } catch (e) { toast('뒤로 가기를 한 번 더 누르면 종료돼요'); } } else history.back(); }
  });
}
window.aiuBack = () => { const r = backStep(); if (r === 'ok') return window.aiuExit ? 'exit' : 'ok'; return r; };
if (!inApp) { keepHist(); window.addEventListener('popstate', () => { backStep(); keepHist(); }); }

function opResize() {

  OP.drops = Array.from({ length: Math.round(w * h / 7000) }, () => { const z = Math.random(); return { x: Math.random() * w, y: Math.random() * h, v: (0.9 + z * 1.3) * h, l: (10 + z * 26) * dpr, a: 0.06 + z * 0.22, wd: (0.5 + z * 1.1) * dpr }; });
}
function opDraw(now) {

  return `<div class="rs-items">${t.join('')}</div>`;
}

function upPlan(id) {

}

 * 그 위에 비, 하늘 균열의 보랏빛 번쩍임, 글자가 잘 보이도록 위아래 어둡게 깔기. 그림이 없으면 하늘과 비만 그림 */
{
  // GPT로 만든 타이틀 로고(logo_title)가 있으면 SVG 로고, 도장, 영문, 한글 줄 대신 그 그림 한 장을 씀 (그림 안에 다 들어 있음)
  if (ART.logo_title) { const box = document.querySelector('.aiu'); if (box) box.innerHTML = `<img class="aiu-img" src="${ART.logo_title}" alt="AIU 이상현상 전담수사팀">`; }
  // 표어를 한 글자씩 나눠 차례로 나타나게 (0.6초 뒤 시작, 한 글자 0.07초)
  { const tg = $('spTag'); if (tg) tg.innerHTML = [...tg.dataset.text].map((c, i) => `<span style="animation-delay:${(0.6 + i * 0.07).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }
  const cvs = $('spbg'), q = cvs.getContext('2d'), key = IMG.key;
  const rnd = seeded(20261127);
  const drops = Array.from({ length: 120 }, () => ({ x: rnd(), y: rnd(), l: 10 + rnd() * 18, v: 0.8 + rnd() * 0.7, a: 0.07 + rnd() * 0.16 }));

    q.setTransform(d, 0, 0, d, 0, 0);
    const t = now / 1000;
    q.fillStyle = '#090d1b'; q.fillRect(0, 0, W2, H2);   // 그림 맨 위 하늘색과 같은 색
    let iw = 0, ih = 0, iy = 0, ix = 0;

      const sc = Math.min(W2 / key.naturalWidth * 1.15, Math.max(W2 / key.naturalWidth, H2 * 0.96 / key.naturalHeight));
      iw = key.naturalWidth * sc; ih = key.naturalHeight * sc; ix = (W2 - iw) / 2; iy = H2 - ih;
      q.drawImage(key, ix, iy, iw, ih);

      if (iy > 0) { const fg = q.createLinearGradient(0, iy, 0, iy + ih * 0.12); fg.addColorStop(0, '#090d1b'); fg.addColorStop(1, 'rgba(9,13,27,0)'); q.fillStyle = fg; q.fillRect(0, iy, W2, ih * 0.12); }

    if (t >= flashNext) { flashT0 = t; flashNext = t + 3 + rnd() * 3; }

      const fl = (1 - age / 0.8) * (Math.sin(age * 55) > -0.3 ? 1 : 0.4);
      const cx = ix + iw * 0.53, cy = iy + ih * 0.42, gl = q.createRadialGradient(cx, cy, 0, cx, cy, iw * 0.5);
      gl.addColorStop(0, `rgba(170,120,255,${0.32 * fl})`); gl.addColorStop(1, 'rgba(170,120,255,0)');
      q.fillStyle = gl; q.fillRect(0, 0, W2, H2);
    }
    // 위쪽 하늘: 천천히 흘러가는 먹구름 + 로고 뒤 보랏빛 균열 빛 (로고를 위로 올려 비던 하늘을 채움)
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 0.27 + t * 0.006 * (1 + i * 0.3)) % 1.4 - 0.2) * W2, cy = H2 * (0.04 + (i % 3) * 0.07), rr = W2 * (0.45 + (i % 2) * 0.2);
      const cg = q.createRadialGradient(cx, cy, 0, cx, cy, rr); cg.addColorStop(0, 'rgba(46,38,82,.55)'); cg.addColorStop(1, 'rgba(46,38,82,0)');
      q.fillStyle = cg; q.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    const lm = document.querySelector('.aiu-img') || document.querySelector('.aiu-mark');
    if (lm) {
      const r = lm.getBoundingClientRect(), cr = cvs.getBoundingClientRect(), lx = r.left + r.width / 2 - cr.left, ly = r.top + r.height / 2 - cr.top;
      const pulse = 0.22 + Math.sin(t * 1.6) * 0.05 + (age < 0.8 ? (1 - age / 0.8) * 0.25 : 0), lr = r.width * 0.9;
      const lg = q.createRadialGradient(lx, ly, 0, lx, ly, lr); lg.addColorStop(0, `rgba(150,100,255,${pulse.toFixed(3)})`); lg.addColorStop(1, 'rgba(150,100,255,0)');
      q.fillStyle = lg; q.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    }
    // 아래쪽 글자(불러오기 줄, 제작사)가 잘 보이게 바닥을 어둡게
    const bot = q.createLinearGradient(0, H2 * 0.72, 0, H2); bot.addColorStop(0, 'rgba(6,8,14,0)'); bot.addColorStop(1, 'rgba(6,8,14,.88)');
    q.fillStyle = bot; q.fillRect(0, H2 * 0.72, W2, H2 * 0.28);
    // 비
    q.lineWidth = 1;
    for (const r of drops) {
      const y = ((r.y + t * r.v) % 1.1 - 0.05) * H2, x = ((r.x - t * r.v * 0.1) % 1 + 1) % 1 * W2;
      q.strokeStyle = `rgba(185,200,240,${r.a})`; q.beginPath(); q.moveTo(x, y); q.lineTo(x - r.l * 0.2, y + r.l); q.stroke();
    }
    requestAnimationFrame(spDraw);
  }
  requestAnimationFrame(spDraw);
}
/* 로딩 바: 약 2.2초 동안 매 프레임 부드럽게 차오름. 지나는 지점마다 문구가 바뀌고, 다 차면 접속 안내 */
{
  const DUR = 2200, steps = [[0, '비 내리는 중'], [0.35, '요원 호출하는 중'], [0.7, '구역 지도 펼치는 중']];
  const fill = $('sp-fill'), msg = $('sp-msg');
  const ease = x => 1 - Math.pow(1 - x, 2.2);   // 처음엔 빠르게, 끝으로 갈수록 천천히
  let t0 = null, artDone = false;
  artReady.then(() => { artDone = true; });
  function loadTick(now) {
    if (started) return;
    if (t0 === null) t0 = now;
    const x = Math.min(1, (now - t0) / DUR), p = ease(x);
    fill.style.width = (p * 100).toFixed(2) + '%';
    let m = steps[0][1]; for (const [at, text] of steps) if (p >= at) m = text;
    if (msg.textContent !== m) msg.textContent = m;
    if (x < 1 || !artDone) { requestAnimationFrame(loadTick); return; }
    // 다 차면 자동으로 넘어가지 않고, 화면을 눌러야 접속
    splashReady = true; msg.textContent = 'READY'; msg.classList.add('ready');
    const tap = $('sp-tap'); tap.textContent = '터치하여 시작'; tap.classList.add('ready');
  }
  requestAnimationFrame(loadTick);
}
requestAnimationFrame(loop);
}
</script>
