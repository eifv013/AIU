/** 그림을 (x, y, w, h) 칸에 그림. 빛 테두리 판(rim)이 있으면 테두리까지 같은 비율로 */
function drawRimmed(g, im, rim, x, y, w, h, bend = 0, flap = 0, flash = 0, slice = true) {
  if (!GQ.hi) flap = 0;   // 낮음: 옷자락 흔들림 끔 (윤곽 빛은 그림 한 장에 합쳐져 있어 비용이 없으므로 유지)

  let saved = false;
  if (!slice && bend) { g.save(); saved = true; g.translate(x + w / 2, y + h); g.rotate(bend * 0.9); g.translate(-(x + w / 2), -(y + h)); bend = 0; flap = 0; }
  // 불투명 그림: 가로 띠 N개로 잘라 발은 고정, 위로 갈수록 bend 만큼 더 밀어 그림 → 허리가 휨. flap: 아래 띠가 물결처럼 흔들림
  const N = (bend || flap) && GQ.hi ? 9 : 1;

    const sy = Math.floor(f0 * sh), ey = i < N - 1 ? Math.floor(f1 * sh) : sh, shh = ey - sy;
    // 아래로 0.5 만큼 겹쳐 그려 띠 사이 틈을 막음 (불투명 그림이라 겹침이 보이지 않음)
    const ov = N > 1 && i < N - 1 ? 0.5 : 0;
    g.drawImage(src, 0, sy, sw, shh, dx + off, dy + sy * k, dw, shh * k + ov);

function sortHeroes(list, pids) {

function fillHeroDetail() {

/** 일괄 강화 계획: 1회/10회는 정해진 단계, 최대는 살 수 있는 만큼 */
function lvPlan(lv) {
  if (bulk === 0) { const r = C.heroLvAffordable(lv, S.exp, 1000); return r.n > 0 ? r : { n: 1, cost: C.heroLvCost(lv) }; }
  return { n: bulk, cost: C.heroLvCostBulk(lv, bulk) };
}

/* ---------- 입력 ---------- */

function backStep() {

    if (exitAsked) { writeSave(); return 'exit'; }   // 종료 확인 창이 떠 있을 때 한 번 더 누르면 종료
    const c = modalEl.querySelector('[data-close]');

    return 'ok';
  }

  if (hpageId) { closeHeroPage(); return 'ok'; }

  if (!$('app').classList.contains('folded')) { $('app').classList.add('folded'); for (const x of $('tabs').children) x.classList.remove('on'); return 'ok'; }   // 메뉴가 열려 있으면 접기

/** n회 호출. pickup 이면 특별 채용(전설 확률 높음) */
function doSummon(n, kind) {
  let res;
  try { res = C.doSummon(S, n, kind, Math.random); }
  catch (e) { return toast(e.message.replace('열립니다', '열려요').replace('부족합니다', '부족해요').replace('않습니다', '않아요').replace('습니다', '어요')); }
  const ids = res.ids, pickup = kind === 'pickup';
  S = res.state; C.progress(S, 'summon', n);
  const lvMsg = res.lvUps.length ? `소환 레벨 ${res.lvUps[res.lvUps.length - 1]} 달성! 보석 ${res.lvUps.reduce((a, L) => a + C.levelReward(L).gems, 0)}개, 정예 호출권 ${res.lvUps.reduce((a, L) => a + C.levelReward(L).ptix, 0)}장` : '';
  syncHeroes(false); writeSave();
  if (n > 30) { renderPanel(); return sumBigHtml(ids, res.isNew, n, kind, res.relayHit, lvMsg); }
  summonFx(ids, res.isNew, n, kind, res.relayHit ? `누적 ${C.CONST.RELAY}회 달성, ${C.heroById('dark').name} 확정 합류` : lvMsg ? lvMsg : res.isNew.some(Boolean) ? '새 요원이 AIU에 합류했어요' : '같은 요원은 조각으로 쌓여요');

}

const SCROLLERS = '.mbody,.sb-g,.rp,.ps,.road,.book,.cxl,.mlist,.ai-log,.tt-list,.cxrs,.cosl,.hstw,.pf2,.lore-p';
function openModal(html, onClose) {
  const m = $('modal'), was = m.classList.contains('on') ? (m.querySelector('.mbody h2') || {}).textContent : null;
  const keep = was ? [...m.querySelectorAll(SCROLLERS)].map(e => e.scrollTop) : null;
  m.innerHTML = `<div class="mbox"><button class="mx" data-close aria-label="닫기"><svg viewBox="0 0 40 40"><path d="M20 2L38 20 20 38 2 20z" fill="url(#mRed)" stroke="#141a2b" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 14l12 12M26 14L14 26" stroke="#fff4e0" stroke-width="3.4" stroke-linecap="round"/></svg></button><div class="mbody">${html}</div></div>`; m.classList.add('on');
  // 창 바깥(어두운 바탕)을 누르면 닫힘. 닫기 버튼과 같게 처리 (확인 창은 '취소'로)
  m.onclick = e => { if (e.target === m) { m.classList.remove('on'); if (onClose) onClose('outside'); return; } const b = e.target.closest('[data-close]'); if (!b) return; m.classList.remove('on'); if (onClose) onClose(b.dataset.close); };
  if (keep && (m.querySelector('.mbody h2') || {}).textContent === was) m.querySelectorAll(SCROLLERS).forEach((e, i) => { if (keep[i]) e.scrollTop = keep[i]; });
}

function playStory(ch, done) {

function stNext() {
  clearTimeout(stT);

  const img = ART[L[0]]; if ($('stImg').getAttribute('src') !== img) { $('stImg').src = img; $('stImg').style.animation = 'none'; void $('stImg').offsetWidth; $('stImg').style.animation = ''; }
  $('stName').textContent = L[1]; $('stLine').textContent = L[2];
  stT = setTimeout(stNext, 3800);   // 자동 넘김
}

/* ============================================================

/** 상품 그림: 첫 보상 아이콘을 크게, 개수는 오른쪽 아래 */
const shArt = rw => { const [k, v] = Object.entries(rw).find(([k]) => RW_IC[k]) || ['gems', 0]; const more = Object.keys(rw).filter(x => RW_IC[x]).length - 1;
  return `<span class="si-a">${icon(RW_IC[k])}<em>×${C.formatNum(v)}</em>${more > 0 ? `<u>+${more}</u>` : ''}</span>`; };
function shItem(it, n, per) {
  const out = n >= it.lim;
  const price = it.pay === 'free' ? '무료' : it.pay === 'ad' ? `<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#2a1c04"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>광고 보기` : `${icon('gem')}${C.formatNum(it.cost)}`;
  return `<button class="si ${out ? 'out' : ''}" data-shop="${it.id}" ${out ? 'disabled' : ''}>${it.tag ? `<span class="si-tag ${it.tag === 'Event' ? 'ev' : ''}">${it.tag}</span>` : ''}
    <b class="si-n">${it.name}</b>${shArt(it.rw)}<small>${per} 구매 가능 ${it.lim - n}/${it.lim}</small><span class="si-p ${it.pay}">${out ? '구매 완료' : price}</span></button>`;
}
function shopHtml(sub = 'shop') {
  const now = new Date(), test = Pay.test ? '<p class="hint">현재는 시험 결제예요. 실제 돈은 나가지 않아요.</p>' : '';
  if (sub === 'daily') {
    // 누적 구매일: 일일 상점에서 산 날을 하루씩 셈 (1일차 ~ 7일차)
    const sk = C.STREAK.map((r, i) => { const got = S.sk.got.includes(i), ready = !got && i < S.sk.n;
      const [k, v] = Object.entries(r)[0];
      return `<button class="sk ${got ? 'got' : ''} ${ready ? 'ready' : ''} ${i === 6 ? 'last' : ''}" data-sk="${i}" ${ready ? '' : 'disabled'}><span>${icon(RW_IC[k])}<em>${C.formatNum(v)}</em></span><b>${i + 1}일차</b></button>`; }).join('');
    return `<div class="sh2"><div class="skw"><div class="sk-h">누적 구매일 <b>${S.sk.n}</b></div><div class="sks">${sk}</div><p class="sk-t">일일 상점에서 상품을 산 날마다 하루씩 쌓여요.</p></div>
      ${shHead('일일 상점', `상품 갱신까지 ${untilTxt()}`)}<div class="sig">${C.SHOP.daily.map(it => shItem(it, C.shopCount(S, it.id, now), '일일')).join('')}</div>${test}</div>`;
  }
  if (sub === 'gems') {
    const gp = C.GOLD_PACKS.map(g => { const n = C.goldPackCount(S, g.id, now), out = n >= 1;
      return `<button class="si ${out ? 'out' : ''}" data-gp="${g.id}" ${out ? 'disabled' : ''}><b class="si-n">월간 한정<br>골드 ${C.formatNum(g.gold)}</b><span class="si-a">${icon('gold')}<em>×10배</em></span><small>월간 구매 가능 ${1 - n}/1</small><span class="si-p gems">${out ? '구매 완료' : icon('gem') + C.formatNum(g.cost)}</span></button>`; }).join('');
    const gm = C.SHOP.gems.map(([n, w], i) => `<button class="si" data-gem="${i}"><b class="si-n">보석 ${n.toLocaleString()}개</b><span class="si-a big">${icon('gem')}<em>×${C.formatNum(n)}</em></span><span class="si-p won">₩${w.toLocaleString()}</span></button>`).join('');
    return `<div class="sh2">${shHead('골드 충전', `갱신까지 ${untilTxt(true)}`)}<div class="sig">${gp}</div>${shHead('보석 충전')}<div class="sig" id="gemShop">${gm}</div>${test}</div>`;
  }
  if (sub === 'month') {
    const plan = pl => { const left = C.planLeft(S, pl.id, now), got = S.plans[pl.id] && S.plans[pl.id].got === C.dayKey(now);
      return `<div class="pln"><b class="pln-t">${pl.name}</b><ul>${pl.perks.map((t, i) => `<li>혜택 ${i + 1}. ${t}</li>`).join('')}</ul>
        <div class="pln-r"><div><small>매일 받는 보상</small>${rwTiles(pl.daily)}</div><i>+</i><div><small>구매 즉시 지급</small>${rwTiles(pl.now)}</div></div>
        <div class="pln-l"><small>활성화 잔여 기간</small><b>${left ? `${left}일` : '없음'}</b></div>
        <div class="pln-b">${left ? `<button class="btn" data-plc="${pl.id}" ${got ? 'disabled' : ''}>${got ? '오늘 받음' : '오늘 보상 받기'}</button>` : ''}<button class="btn ${left ? 'blue' : ''}" data-plan="${pl.id}">${left ? '기간 더하기 ' : ''}₩${pl.price.toLocaleString()}</button></div></div>`; };
    const note = '<p class="pln-n">다시 사면 남은 기간에 더해져요.</p>';
    return `<div class="sh2">${shHead('주간 정액 상점', '매일 정기권 칸에서 받아요')}${note}${C.PLANS.filter(p => p.kind === 'week').map(plan).join('')}
      ${shHead('월정액 상점', '매일 정기권 칸에서 받아요')}${note}${C.PLANS.filter(p => p.kind === 'month').map(plan).join('')}
      ${shHead('패스')}<div class="spk"><b class="spk-t">수사 패스</b><small>스테이지를 올릴 때마다 보상, 패스를 사면 추가 보상</small><button class="si-p" data-mopen="pass">보기</button></div>
      <div class="spk"><b class="spk-t">임무 패스</b><small>임무 점수로 오르는 이번 달 패스</small><button class="si-p" data-mopen="mpass">보기</button></div>${test}</div>`;
  }
  // 상점: 추천 상점 / 일일 광고 상점 / 보석 상점 / 복장 상점
  const fp = S.fp.got.length < 3 ? `<button class="sh-fp" data-fpopen><b>첫 결제 보너스</b><span>처음 결제하면 3일 동안 매일 보너스</span></button>` : '';
  const packs = C.SHOP.packs.map(pk => { const own = S.owned.includes(pk.id);
    return `<div class="spk"><span class="si-tag">${pk.tag === '추천' ? 'New' : 'Hot'}</span><b class="spk-t">${pk.name}</b><small>${pk.sub}</small><div class="spk-r">${rwTiles(pk.rw)}</div><small>계정 당 구매 가능 ${own ? 0 : 1}/1</small><button class="si-p" data-pack="${pk.id}" ${own ? 'disabled' : ''}>${own ? '구매 완료' : '₩' + pk.price.toLocaleString()}</button></div>`; }).join('');
  return `<div class="sh2">${fp}${shHead('추천 상점')}${packs}
    ${shHead('일일 광고 상점', `상품 갱신까지 ${untilTxt()}`)}<div class="sig">${C.SHOP.ad.map(it => shItem(it, C.shopCount(S, it.id, now), '일일')).join('')}</div>
    ${shHead('보석 상점', `상품 갱신까지 ${untilTxt()}`)}<div class="sig">${C.SHOP.gshop.map(it => shItem(it, C.shopCount(S, it.id, now), '일일')).join('')}</div>
    ${shHead('복장 상점')}<div class="spk"><b class="spk-t">요원 복장</b><small>복장을 사면 입지 않아도 보유 효과가 모든 요원에게 적용돼요. 모은 복장 ${S.cos.length} / ${C.COSTUMES.length}</small><button class="si-p" data-cosshop>복장 보기</button></div>${test}</div>`;
}
async function shopAct(b) {
  if (b.dataset.sk != null) { const r = C.streakClaim(S, +b.dataset.sk); if (r) { writeSave(); renderPanel(); showResult('gift', '보상 획득', rwTiles(r)); } return; }
  if (b.dataset.gp) { try { const r = C.goldPackBuy(S, b.dataset.gp, new Date()); writeSave(); renderPanel(); showResult('gift', '구매 완료', rwTiles(r)); } catch (e) { toast(e.message); } return; }
  if (b.dataset.plc) { const r = C.planClaim(S, b.dataset.plc, new Date()); if (r) { writeSave(); renderPanel(); showResult('gift', '보상 획득', rwTiles(r)); } return; }
  if (b.dataset.plan) { const pl = C.planById(b.dataset.plan);
    if (!(await Pay.buy(pl.id, pl.price, pl.name))) return;
    const r = C.planBuy(S, pl.id, new Date()); C.firstPayStart(S, new Date()); refreshMods(); writeSave(); renderPanel(); return showResult('gift', '구매 완료', rwTiles(r)); }
  if (b.hasAttribute('data-cosshop')) { cosOnly = ''; return openModal(cosHtml()); }
  if (b.dataset.shop) {
    const it = C.shopItem(b.dataset.shop);
    if (it.pay === 'ad' && !(await Ads.show('shop'))) return;
    try { const r = C.shopBuy(S, it.id, new Date()); writeSave(); renderPanel(); showResult('gift', '보상 획득', rwTiles(r)); } catch (e) { toast(e.message); }
  } else if (b.dataset.pack) {
    const pk = C.SHOP.packs.find(x => x.id === b.dataset.pack);
    if (!(await Pay.buy(pk.id, pk.price, pk.name))) return;
    S.owned.push(pk.id); const prw = { ...pk.rw }; if (prw.gems) { S.pgems += prw.gems; delete prw.gems; } C.giveReward(S, prw); C.firstPayStart(S, new Date()); writeSave(); renderPanel();
    showResult('gift', '구매 완료', Object.keys(pk.rw).length ? rwTiles(pk.rw) : '<div class="rs-nm">광고 제거</div>');
  } else if (b.dataset.gem) {
    const [n, w] = C.SHOP.gems[+b.dataset.gem];
    if (!(await Pay.buy('g' + b.dataset.gem, w, `보석 ${n.toLocaleString()}개`))) return;
    S.pgems += n; C.firstPayStart(S, new Date()); writeSave(); renderPanel(); showResult('gift', '구매 완료', rwTiles({ gems: n }));
  }
}
$('gemPlus').addEventListener('click', e => {
  e.stopPropagation(); sumSub = subSel.summon = 'gems';
  const t = $('tabs').querySelector('[data-tab="summon"]'); if (tab !== 'summon' || $('app').classList.contains('folded')) t.click(); else renderPanel();
  setTimeout(() => { const g = $('gemShop'); if (g) g.scrollIntoView({ block: 'start' }); }, 60);
});

/* ---------- 수사 패스 ---------- */
function passHtml() {
  const row = (r, i) => {
    const fOk = S.stage >= r.st, fGot = S.pass.f.includes(i), pGot = S.pass.p.includes(i);
    const cell = (track, rw, got, can) => `<button class="ps-c ${got ? 'got' : can ? 'ready' : ''}" ${can && !got ? `data-pass="${i}" data-tr="${track}"` : 'disabled'}>${rwTiles(rw)}${track === 'paid' && !S.pass.paid ? '<i class="ps-lock"></i>' : ''}</button>`;
    return `<div class="ps-r"><span class="ps-st ${fOk ? 'on' : ''}">${r.st}</span>${cell('free', r.free, fGot, fOk)}${cell('paid', r.paid, pGot, fOk && S.pass.paid)}</div>`;
  };
  return `<h2>수사 패스</h2><p class="hint">스테이지를 넘을 때마다 보상을 받아요. 패스를 사면 오른쪽 줄 보상도 받아요.</p>
    <div class="ps-h"><span>스테이지</span><span>무료</span><span>패스</span></div><div class="ps">${C.PASS.map(row).join('')}</div>
    <div class="mbtns"><button class="btn ghost" data-close>닫기</button>${S.pass.paid ? `<button class="btn" data-passall ${C.passReady(S).length ? '' : 'disabled'}>모두 받기</button>` : `<button class="btn" data-passbuy>패스 구매 ${C.PASS_PRICE.toLocaleString()}원</button>`}</div>`;
}
$('passBtn').addEventListener('click', () => { pxTab = 'stage'; openModal(pxWinHtml()); });
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-mopen]'); if (!b) return; if (b.dataset.mopen === 'pass') openModal(passHtml()); else misOpen('p'); });
modalEl.addEventListener('click', async e => {
  const one = e.target.closest('[data-pass]'), all = e.target.closest('[data-passall]'), buy = e.target.closest('[data-passbuy]');
  if (buy) { modalEl.classList.remove('on'); if (await Pay.buy('pass', C.PASS_PRICE, '수사 패스')) { S.pass.paid = true; C.firstPayStart(S, new Date()); writeSave(); } return openModal(passHtml()); }
  if (!one && !all) return;
  const got = {};
  for (const [i, tr] of (one ? [[+one.dataset.pass, one.dataset.tr]] : C.passReady(S))) { const w = C.passClaim(S, i, tr); if (w) for (const [k, v] of Object.entries(w)) got[k] = (got[k] || 0) + v; }
  writeSave(); modalEl.classList.remove('on'); if (Object.keys(got).length) showResult('gift', '보상 획득', rwTiles(got));
});

/* ---------- 가이드 위 버튼: 나침반(수사 수첩), 숙제 도우미(일일 작전 한꺼번에) ---------- */
$('pillRoad').addEventListener('click', () => openModal(roadHtml()));
let hwSel = null;
function hwHtml() {
  if (!hwSel) hwSel = Object.fromEntries(C.DUNGEONS.map(d => [d.id, true]));
  const rows = C.DUNGEONS.map(d => {
    const can = S.keys[d.id] > 0 && S.dbest[d.id] > 0;
    return `<div class="hw ${can ? '' : 'no'}"><button class="hw-ck ${hwSel[d.id] ? 'on' : ''}" data-hw="${d.id}"></button><img src="${ART[BOSS_ART[d.id]] || ''}" alt=""><span><b>${d.name}</b><small>${S.dbest[d.id] ? `${S.dbest[d.id]}단계 소탕` : '첫 클리어 후 소탕 가능'}</small></span><em>${can ? `${S.keys[d.id]}회` : '진행 불가'}</em></div>`;
  }).join('');
  const all = C.DUNGEONS.every(d => hwSel[d.id]);
  return `<h2>숙제 도우미</h2><div class="hws">${rows}</div><label class="hw-all"><button class="hw-ck ${all ? 'on' : ''}" data-hw="all"></button>전체 선택</label>
    <div class="mbtns"><button class="btn ghost" data-close>닫기</button><button class="btn" data-hwgo ${runAlert() ? '' : 'disabled'}>숙제 시작</button></div>`;
}
$('pillHw').addEventListener('click', () => openModal(hwHtml()));
modalEl.addEventListener('click', e => {
  const c = e.target.closest('[data-hw]');
  if (c) { if (c.dataset.hw === 'all') { const v = !C.DUNGEONS.every(d => hwSel[d.id]); for (const d of C.DUNGEONS) hwSel[d.id] = v; } else hwSel[c.dataset.hw] = !hwSel[c.dataset.hw]; return openModal(hwHtml()); }
  if (!e.target.closest('[data-hwgo]')) return;
  const got = {};
  for (const d of C.DUNGEONS) if (hwSel[d.id]) while (S.keys[d.id] > 0 && S.dbest[d.id] > 0) { const r = C.sweepDungeon(S, d.id); for (const k of ['gold', 'tix', 'exp']) if (r[k]) got[k] = (got[k] || 0) + r[k]; }
  writeSave(); modalEl.classList.remove('on'); renderPanel();
  if (Object.keys(got).length) showResult('gift', '숙제 완료', rwTiles(got)); else toast('선택한 작전 중 소탕할 수 있는 게 없어요');
});

$('panel').addEventListener('click', e => {
  if (e.target.closest('[data-fpopen]')) return openModal(fpHtml());
  const ss = e.target.closest('[data-ss]'); if (ss) { sumSub = ss.dataset.ss; renderPanel(); $('panel').scrollTop = 0; return; }
  const b = e.target.closest('[data-shop],[data-pack],[data-gem],[data-sk],[data-gp],[data-plc],[data-plan],[data-cosshop]'); if (b && !b.disabled) shopAct(b);
});

/* ---------- 화면 섬광 (번개, 도장) ---------- */
function flash(col, a) {
  const el = $('flashFx'); el.style.background = col; el.style.setProperty('--fa', a);
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}

/* ---------- 요원 호출 연출 ----------
 * 1) 화면이 어두워지고 비 속에서 균열(호출 문)이 열림. 가장 높은 등급 색으로 빛남 (전설은 금빛 번개)
 * 2) 요원 기록 파일이 가운데서 날아와 자리 잡음 (뒷면: AIU 배지)
 * 3) 누르거나 모두 열기로 뒤집음. 전설은 뒤집기 전에 금빛이 차오르고 화면이 흔들림. 새 요원은 NEW 도장 */
const GCOL = { 희귀: '#6fa8ff', 영웅: '#c07bff', 전설: '#ffcf5a' };
let sxState = null;
function summonFx(ids, isNew, n, kind, msg) {
  const el = $('sfx'), hs = ids.map(id => C.heroById(id));
  const top = hs.some(h => h.grade === '전설') ? '전설' : hs.some(h => h.grade === '영웅') ? '영웅' : '희귀';
  sxState = { n, kind, left: ids.length };
  el.style.setProperty('--gc', GCOL[top]);
  // many: 30장은 5칸 6줄로 작게. fast: 연출 스킵이면 바로 앞면
  el.className = 'on g-' + ({ 희귀: 'r', 영웅: 'h', 전설: 'l' })[top] + (n === 1 ? ' one' : '') + (ids.length > 10 ? ' many' : '') + (sumSkip ? ' fast' : '') + (autoSum ? ' auto' : '');
  for (const [b, m] of [[$('sxA10'), 10], [$('sxA30'), 30]]) { const c = sumCost(kind, m); b.innerHTML = `<b>${m}회</b><span>${icon(c.ic)}${C.formatNum(c.v)}</span>`; b.disabled = !c.ok; }
  $('sxAuto').classList.toggle('on', autoSum);
  $('sxTitle').textContent = kind === 'pickup' ? '특별 채용' : kind === 'elite' ? '정예 호출' : '요원 호출';
  $('sxMsg').textContent = msg;
  $('sxCards').innerHTML = hs.map((h, i) => `<button class="sx-c g-${({ 희귀: 'r', 영웅: 'h', 전설: 'l' })[h.grade]} fd" style="--i:${i};--gc:${GCOL[h.grade]}" data-i="${i}">
    <span class="sx-back"></span><span class="sx-front"><img src="${portrait(h.id)}" alt=""><b>${h.name}</b><small>${h.grade}</small>${isNew[i] ? '<em>NEW</em>' : ''}</span></button>`).join('');
  sxRain();
  if (top === '전설') setTimeout(() => { flash('#ffd27a', 0.55); shake(8); }, 900);
  else setTimeout(() => flash(GCOL[top], 0.3), 900);
  if (sumSkip) { $('sxCards').querySelectorAll('.sx-c.fd').forEach(c => { c.classList.remove('fd'); c.classList.add('flip'); }); sxState.left = 0; sxDone(); }
  else if (n === 1) setTimeout(() => sxFlip($('sxCards').firstElementChild), 1100);
  else if (autoSum) setTimeout(() => { if (autoSum) $('sxAll').click(); }, 700 + ids.length * 20);   // 자동 호출: 깔리자마자 모두 열기
}
/** 다 열렸을 때: 아래 10회 / 닫기 / 30회. 자동 호출이 켜져 있으면 잠깐 보여 주고 같은 횟수로 다시 */
let autoT = 0;
function sxDone() {
  $('sfx').classList.add('done'); clearTimeout(autoT);
  if (!autoSum) return;
  autoT = setTimeout(() => { if (!autoSum || !$('sfx').classList.contains('on')) return;
    const n = Math.min(30, sxState.n), kind = sxState.kind;
    if (!sumCost(kind, n).ok) { autoSum = false; $('sxAuto').classList.remove('on'); return toast('재화가 모자라 자동 호출을 멈췄어요'); }
    sxClose(true); doSummon(n, kind); }, sumSkip ? 900 : 1400);
}
function sxFlip(c) {
  if (!c || !c.classList.contains('fd')) return;
  const leg = c.classList.contains('g-l');
  c.classList.remove('fd'); c.classList.add(leg ? 'charge' : 'flip'); sfx('card', 0.7, 0.03);
  if (leg) setTimeout(() => { sfx('cinehit', 0.8, 0.3); }, 600);
  if (leg) setTimeout(() => { c.classList.remove('charge'); c.classList.add('flip'); flash('#ffd27a', 0.45); shake(6); }, 650);
  sxState.left--; if (sxState.left <= 0) sxDone();
}
$('sxCards').addEventListener('click', e => sxFlip(e.target.closest('.sx-c')));
$('sxAll').addEventListener('click', () => [...$('sxCards').querySelectorAll('.sx-c.fd')].forEach((c, i) => setTimeout(() => sxFlip(c), i * 35)));
$('sxSkip').addEventListener('click', () => { $('sxCards').querySelectorAll('.sx-c.fd').forEach(c => { c.classList.remove('fd'); c.classList.add('flip'); }); sxState.left = 0; sxDone(); });
function sxClose(keep) { clearTimeout(autoT); if (!keep) autoSum = false; $('sfx').className = ''; cancelAnimationFrame(sxRaf); renderPanel(); }
$('sxOk').addEventListener('click', () => sxClose());

let sxRaf = 0;
function sxRain() {
  const c = $('sfxC'), q = c.getContext('2d'), W2 = c.width = innerWidth, H2 = c.height = innerHeight;
  const drops = Array.from({ length: 90 }, () => ({ x: Math.random() * W2, y: Math.random() * H2, v: 500 + Math.random() * 400 }));
  const motes = Array.from({ length: 40 }, () => ({ x: W2 / 2, y: H2 * 0.42, a: Math.random() * 6.28, v: 20 + Math.random() * 90, r: 1 + Math.random() * 2 }));
  let last = performance.now();
  const col = getComputedStyle($('sfx')).getPropertyValue('--gc').trim() || '#6fa8ff';
  const tick = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    q.clearRect(0, 0, W2, H2);
    q.strokeStyle = 'rgba(170,190,230,.25)'; q.lineWidth = 1;
    for (const d of drops) { d.y += d.v * dt; d.x -= d.v * dt * 0.15; if (d.y > H2) { d.y = -20; d.x = Math.random() * W2 * 1.2; } q.beginPath(); q.moveTo(d.x, d.y); q.lineTo(d.x + 3, d.y - 16); q.stroke(); }
    q.fillStyle = col;
    for (const m of motes) { m.x += Math.cos(m.a) * m.v * dt; m.y += Math.sin(m.a) * m.v * dt - 10 * dt; if (Math.hypot(m.x - W2 / 2, m.y - H2 * 0.42) > W2 * 0.6) { m.x = W2 / 2; m.y = H2 * 0.42; } q.globalAlpha = 0.6; q.beginPath(); q.arc(m.x, m.y, m.r, 0, 7); q.fill(); }
    q.globalAlpha = 1;
    sxRaf = requestAnimationFrame(tick);
  };

}

let talkT = 0; const talkRecent = [];
function talk() {
  if (overlayBlocked()) return;
  const bn = (theme().boss || '근원체');

  // 최근에 말한 요원은 덜 고름, 최근 대사 6개는 다시 안 나옴
  const lastWho = talkRecent.length ? talkRecent[talkRecent.length - 1].who : '';
  const pool = t.length > 1 ? t.filter(h => h.id !== lastWho) : t;
  const h = pool[Math.floor(Math.random() * pool.length)];
  const all = [...(LINES[h.id] || []), ...(TYPE_LINES[h.type] || [])];

/* ---------- 피해량 기록, 획득 기록 ---------- */
const LOG = { t: 0, base: null };
let mtTab = 'dps';
function logReset() { LOG.t = 0; LOG.base = { gold: S.gold, exp: S.exp, gems: C.gemTotal(S), tix: S.tix, kills: S.killsTotal || 0, stage: S.stage }; }
function meterOpen(on) {
  $('meter').classList.toggle('on', on); $('bMeter').setAttribute('aria-pressed', on);
  try { localStorage.setItem('aiu-meter', on ? '1' : '0'); } catch (e) {}
  if (on) meterDraw();
}
function fmtT(t) { const z = n => String(n).padStart(2, '0'); t = Math.floor(t); return `${z(Math.floor(t / 3600))}:${z(Math.floor(t / 60) % 60)}:${z(t % 60)}`; }
function meterDraw() {
  if (!$('meter').classList.contains('on')) return;
  for (const b of $('meter').querySelectorAll('[data-mt]')) b.classList.toggle('on', b.dataset.mt === mtTab);
  if (mtTab === 'dps') {
    const rows = team().map(h => [h, DPS.d[h.id] || 0]).sort((a, b) => b[1] - a[1]);
    const top = Math.max(1, ...rows.map(r => r[1])), sum = rows.reduce((a, r) => a + r[1], 0);
    $('mtB').innerHTML = rows.map(([h, v]) => `<div class="mt-r"><img src="${ART['id_' + h.id] || portrait(h.id)}" alt=""><i style="--w:${Math.round(v / top * 112)}px"></i><span>${h.name}</span><b>${C.formatNum(v)}</b></div>`).join('')
      + `<div class="mt-f"><span>초당 ${C.formatNum(sum / Math.max(1, DPS.t))}</span><button data-mtr="dps">초기화</button></div>`;
  } else {
    if (!LOG.base) logReset();
    const B = LOG.base, row = (ic, v) => `<div class="mt-r">${icon(ic)}<span>획득</span><b>+${C.formatNum(Math.max(0, v))}</b></div>`;
    $('mtB').innerHTML = row('gold', S.gold - B.gold) + row('exp', S.exp - B.exp) + row('gem', C.gemTotal(S) - B.gems) + row('tix', S.tix - B.tix)
      + `<div class="mt-f"><span>${fmtT(LOG.t)}</span><button data-mtr="log">초기화</button></div>`;
  }
}
$('bMeter').addEventListener('click', () => meterOpen(!$('meter').classList.contains('on')));
$('mtX').addEventListener('click', () => meterOpen(false));
$('meter').addEventListener('click', e => {
  const t = e.target.closest('[data-mt]'); if (t) { mtTab = t.dataset.mt; meterDraw(); }
  const r = e.target.closest('[data-mtr]'); if (r) { if (r.dataset.mtr === 'dps') { DPS.d = {}; DPS.t = 0; } else logReset(); meterDraw(); }
});
setInterval(meterDraw, 500);
try { if (localStorage.getItem('aiu-meter') === '1') setTimeout(() => meterOpen(true), 500); } catch (e) {}

  ['0.18.0', '11월 28일', ['우편함, 스테이지 창, 스테이지 클리어, 새 기능 열림 알림, 호출 카드 뒤집기가 생겼어요', '요원 도감 레벨 달성 보상, 기술 설명, 전투력 변화 표시가 생겼어요', '수사 수첩, 프로필, 피해량 기록, 일괄 소탕이 생겼어요', '구역 근원체가 처음 나올 때 이야기가 나와요', '요원 창을 요원 관리, 편성, 도감으로 나눴어요', '요원 상세 화면과 승급 성공 연출이 생겼어요', '가이드 보상으로 블레이즈 첫 승급을 할 수 있어요', '근원체 출현 컷인, 요원 대사, 보상 획득 창이 생겼어요', '재화와 메뉴 아이콘을 새로 그렸어요', '절전 모드와 새 설정이 생겼어요']],
  ['0.17.0', '11월 27일', ['가이드 퀘스트가 생겼어요', '뒤로 가기 버튼을 누르면 종료를 묻도록 바꿨어요', '오프닝 연출을 새로 만들었어요']],
];
function newsHtml() {
  return `<div class="news"><h2>소식</h2>${NEWS.map(([v, d, L]) => `<h3>AIU ${v}<small>${d}</small></h3><ul>${L.map(x => `<li>${x}</li>`).join('')}</ul>`).join('')}<div class="mbtns"><button class="btn" data-close>닫기</button></div></div>`;
}
const newsSeen = () => { try { return localStorage.getItem('aiu-news') === NEWS[0][0]; } catch (e) { return true; } };
$('dotNews').classList.toggle('on', !newsSeen());
$('dotMail').classList.toggle('on', C.MAILS.some(m => !S.mail.includes(m.id)));
setInterval(() => { $('dotFp').classList.toggle('on', C.firstPayReady(S, new Date()) >= 0); $('dotRoad2').classList.toggle('on', C.roadReady(S).length > 0); $('dotHw').classList.toggle('on', runAlert()); $('dotPass').classList.toggle('on', C.passReady(S).length > 0 || ['level', 'summon', 'rift'].some(k => C.pxReady(S, k).length > 0)); $('dotAd').classList.toggle('on', !C.adBuffOn(S, Date.now())); $('dotBag').classList.toggle('on', Object.values(S.bag).some(n => n > 0)); $('dotMail').classList.toggle('on', C.MAILS.some(m => !S.mail.includes(m.id))); $('sideTg').classList.toggle('alert', $('side').classList.contains('fold') && [...$('side').querySelectorAll('.dot')].some(d => d.classList.contains('on') || d.style.display === 'block')); }, 1000);

/* ---------- 절전 모드: 화면은 검게, 전투와 보상은 계속 ---------- */
var sleeping = false, slBase = null, idleT = 0;   // var: 소리 함수가 먼저 읽어도 오류 없게
const TIPS = ['절전 중에도 전투는 계속되고 보상도 쌓여요.', '출전 칸은 구역이 오를수록 늘어나요.', '일일 작전은 매일 0시에 다시 채워져요.', '같은 요원을 또 뽑으면 조각이 쌓여 승급할 수 있어요.'];
function sleepOn() {
  if (sleeping) return; sleeping = true; slBase = { gold: S.gold, exp: S.exp, gems: C.gemTotal(S) };
  $('slTip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  $('sleep').classList.add('on'); slTick();
}
function sleepOff() { sleeping = false; idleT = 0; $('sleep').classList.remove('on'); $('slKnob').style.transform = ''; }
function slTick() {
  if (!sleeping) return;
  const d = new Date(), z = n => String(n).padStart(2, '0');
  $('slClock').textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
  $('slDate').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
  $('slSt').textContent = `${C.stageLabel ? C.stageLabel(S.stage) : S.stage + ' 단계'}  ${theme().name}`;
  $('slGain').innerHTML = `<span>${icon('gold')}+${C.formatNum(Math.max(0, S.gold - slBase.gold))}</span><span>${icon('exp')}+${C.formatNum(Math.max(0, S.exp - slBase.exp))}</span><span>${icon('gem')}+${C.formatNum(Math.max(0, C.gemTotal(S) - slBase.gems))}</span>`;
  setTimeout(slTick, 1000);
}
// 자물쇠를 위로 밀면 해제
(() => {
  let y0 = null; const k = $('slKnob');
  $('sleep').addEventListener('pointerdown', e => { y0 = e.clientY; });
  $('sleep').addEventListener('pointermove', e => { if (y0 === null) return; const dy = Math.max(-62, Math.min(0, e.clientY - y0)); k.style.transform = `translateY(${dy}px)`; });
  const end = e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null; if (dy < -50) sleepOff(); else k.style.transform = ''; };
  $('sleep').addEventListener('pointerup', end); $('sleep').addEventListener('pointercancel', end);
})();
// 자동 절전: 설정한 시간 동안 손대지 않으면 켜짐
['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, () => { idleT = 0; }, true));
setInterval(() => { if (sleeping || !GQ.autoSleep || paused) return; idleT += 5; if (idleT >= GQ.autoSleep * 60) sleepOn(); }, 5000);


/* ---------- 앱 자동 업데이트 (새 버전 받기) ----------
 * 앱에서만: 깃허브에 올라간 최신 버전(version.json)을 보고, 더 새것이면 게임 파일을 받아 둠.
 * 다시 시작하면 새 버전으로 열림. 앱(APK)을 다시 깔 필요 없음. */
const HOT_BASE = 'https://raw.githubusercontent.com/eifv013/AIU/main/dist/';
async function hotCheck(manual) {
  const app = location.protocol === 'https:' && location.hostname === 'localhost';
  if (!app || !window.caches) { if (manual) toast('웹에서는 항상 최신 버전이에요'); return; }
  try {
    const v = (await (await fetch(HOT_BASE + 'version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v;
    if (!v || !aiuVerGt(v, APP_VERSION)) { if (manual) toast(`최신 버전이에요 (${APP_VERSION})`); return; }
    if (manual) toast(`새 버전 ${v} 받는 중`);
    const h = await (await fetch(HOT_BASE + 'index.html?t=' + Date.now(), { cache: 'no-store' })).text();
    if (h.indexOf(`window.AIU_VER = '${v}'`) < 0) throw new Error('받은 파일이 올바르지 않아요');
    const c = await caches.open('aiu-hot');
    await c.put('/aiu-hot.html', new Response(h, { headers: { 'Content-Type': 'text/html' } }));
    localStorage.setItem('aiu-hotv', v);
    writeSave();
    openModal(`<h2>업데이트</h2><p>새 버전 <b>${v}</b> 을 받았어요.<br>다시 시작하면 바로 적용돼요.</p><div class="mbtns"><button class="btn ghost" data-close>나중에</button><button class="btn" id="hotGo">다시 시작</button></div>`);
    $('hotGo').addEventListener('click', () => { writeSave(); location.reload(); });
  } catch (e) { if (manual) toast('업데이트 확인 실패: 인터넷 연결을 확인해 주세요'); }
}
setTimeout(() => hotCheck(false), 4000);

$('spVer').textContent = window.AIU_VER;
/* ---------- 시작 ---------- */
const pending = firstRun ? null : C.offlineReward(S, (Date.now() - S.lastSeen) / 1000);
syncHeroes(true); renderPanel(); updateUI();
let started = false, splashReady = false;   // splashReady: 불러오기가 끝나야 화면을 눌러 접속할 수 있음
const opSeen = () => { try { return localStorage.getItem('aiu-op') === '1'; } catch (e) { return true; } };
function startGame() {
  if (started || !splashReady) return; started = true;
  $('splash').style.display = 'none'; paused = false; last = performance.now();
  if (S.migrated) { delete S.migrated; writeSave(); setTimeout(() => toast(`뽑기 개편 보상으로 보석 ${C.CONST.MIGRATE_GEMS.toLocaleString()}개를 받았어요`), 600); }
  if (pending && pending.gold > 0) showOffline(pending);
  else if (firstRun || !opSeen()) playOpening(() => banner(theme().name));   // 오프닝이 끝나면 첫 구역 이름   // 처음 시작: 오프닝 연출 뒤 출동
}
$('splash').addEventListener('click', startGame);
/* 시작 화면 배경: 요원 다섯 명 그림(key)을 화면 가로 폭에 맞춰 아래에 붙이고, 남는 위쪽은 그림 하늘색으로 이어 칠함.
 * 그 위에 비, 하늘 균열의 보랏빛 번쩍임, 글자가 잘 보이도록 위아래 어둡게 깔기. 그림이 없으면 하늘과 비만 그림 */
{
  // GPT로 만든 타이틀 로고(logo_title)가 있으면 SVG 로고, 도장, 영문, 한글 줄 대신 그 그림 한 장을 씀 (그림 안에 다 들어 있음)
  if (ART.logo_title) { const box = document.querySelector('.aiu'); if (box) box.innerHTML = `<img class="aiu-img" src="${ART.logo_title}" alt="AIU 이상현상 전담수사팀">`; }
  // 로고와 배경 그림이 풀리면(최대 1.5초) 한꺼번에 서서히 보여 줌
  { const ims = [document.querySelector('.aiu-img'), IMG.key].filter(Boolean);
    Promise.race([Promise.all(ims.map(im => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}))), new Promise(r => setTimeout(r, 1500))])
      .then(() => requestAnimationFrame(() => $('splash').classList.add('ready'))); }
  // 표어를 한 글자씩 나눠 차례로 나타나게 (0.6초 뒤 시작, 한 글자 0.07초)
  { const tg = $('spTag'); if (tg) tg.innerHTML = [...tg.dataset.text].map((c, i) => `<span style="animation-delay:${(0.6 + i * 0.07).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }
  const cvs = $('spbg'), q = cvs.getContext('2d'), key = IMG.key;
  const rnd = seeded(20261127);
  const drops = Array.from({ length: 120 }, () => ({ x: rnd(), y: rnd(), l: 10 + rnd() * 18, v: 0.8 + rnd() * 0.7, a: 0.07 + rnd() * 0.16 }));
  let flashNext = 1.2, flashT0 = -9;
  function spDraw(now) {
    if (started || !q) return;
    const W2 = cvs.clientWidth, H2 = cvs.clientHeight, d = Math.min(3, devicePixelRatio || 1);
    if (cvs.width !== Math.round(W2 * d) || cvs.height !== Math.round(H2 * d)) { cvs.width = Math.round(W2 * d); cvs.height = Math.round(H2 * d); }
    q.setTransform(d, 0, 0, d, 0, 0);
    const t = now / 1000;
    q.fillStyle = '#090d1b'; q.fillRect(0, 0, W2, H2);   // 그림 맨 위 하늘색과 같은 색
    let iw = 0, ih = 0, iy = 0, ix = 0;
    if (imgOk('key')) {
      // 가로 폭에 맞추고 아래에 붙임 (요원이 양옆으로 잘리지 않게). 화면이 그림보다 납작하면 위쪽 하늘이 잘림
      // 화면이 그림보다 길쭉하면 조금 키워서 위쪽 빈 하늘을 줄임 (양옆은 최대 7%씩만 잘림)
      const sc = Math.min(W2 / key.naturalWidth * 1.15, Math.max(W2 / key.naturalWidth, H2 * 0.96 / key.naturalHeight));
      iw = key.naturalWidth * sc; ih = key.naturalHeight * sc; ix = (W2 - iw) / 2; iy = H2 - ih;
      q.drawImage(key, ix, iy, iw, ih);
      // 그림 윗선이 보이지 않게 하늘색으로 부드럽게 이음
      if (iy > 0) { const fg = q.createLinearGradient(0, iy, 0, iy + ih * 0.12); fg.addColorStop(0, '#090d1b'); fg.addColorStop(1, 'rgba(9,13,27,0)'); q.fillStyle = fg; q.fillRect(0, iy, W2, ih * 0.12); }
    }
    // 하늘 균열 번쩍임: 3~6초마다 그림 속 균열(가운데 뒤) 자리가 잠깐 밝아짐
    if (t >= flashNext) { flashT0 = t; flashNext = t + 3 + rnd() * 3; }
    const age = t - flashT0;
    if (age < 0.8 && ih) {
      const fl = (1 - age / 0.8) * (Math.sin(age * 55) > -0.3 ? 1 : 0.4);
      const cx = ix + iw * 0.53, cy = iy + ih * 0.42, gl = q.createRadialGradient(cx, cy, 0, cx, cy, iw * 0.5);
      gl.addColorStop(0, `rgba(170,120,255,${0.32 * fl})`); gl.addColorStop(1, 'rgba(170,120,255,0)');
      q.fillStyle = gl; q.fillRect(0, 0, W2, H2);
    }
    // 위쪽 하늘: 천천히 흘러가는 먹구름 + 로고 뒤 보랏빛 균열 빛 (로고를 위로 올려 비던 하늘을 채움)
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 0.27 + t * 0.006 * (1 + i * 0.3)) % 1.4 - 0.2) * W2, cy = H2 * (0.04 + (i % 3) * 0.07), rr = W2 * (0.45 + (i % 2) * 0.2);
      const cg = q.createRadialGradient(cx, cy, 0, cx, cy, rr); cg.addColorStop(0, 'rgba(46,38,82,.55)'); cg.addColorStop(1, 'rgba(46,38,82,0)');
      q.fillStyle = cg; q.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    const lm = document.querySelector('.aiu-img') || document.querySelector('.aiu-mark');
    if (lm) {
      const r = lm.getBoundingClientRect(), cr = cvs.getBoundingClientRect(), lx = r.left + r.width / 2 - cr.left, ly = r.top + r.height / 2 - cr.top;
      const pulse = 0.22 + Math.sin(t * 1.6) * 0.05 + (age < 0.8 ? (1 - age / 0.8) * 0.25 : 0), lr = r.width * 0.9;
      const lg = q.createRadialGradient(lx, ly, 0, lx, ly, lr); lg.addColorStop(0, `rgba(150,100,255,${pulse.toFixed(3)})`); lg.addColorStop(1, 'rgba(150,100,255,0)');
      q.fillStyle = lg; q.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    }
    // 아래쪽 글자(불러오기 줄, 제작사)가 잘 보이게 바닥을 어둡게
    const bot = q.createLinearGradient(0, H2 * 0.72, 0, H2); bot.addColorStop(0, 'rgba(6,8,14,0)'); bot.addColorStop(1, 'rgba(6,8,14,.88)');
    q.fillStyle = bot; q.fillRect(0, H2 * 0.72, W2, H2 * 0.28);
    // 비
    q.lineWidth = 1;
    for (const r of drops) {
      const y = ((r.y + t * r.v) % 1.1 - 0.05) * H2, x = ((r.x - t * r.v * 0.1) % 1 + 1) % 1 * W2;
      q.strokeStyle = `rgba(185,200,240,${r.a})`; q.beginPath(); q.moveTo(x, y); q.lineTo(x - r.l * 0.2, y + r.l); q.stroke();
    }
    requestAnimationFrame(spDraw);
  }
  requestAnimationFrame(spDraw);
}
/* 로딩 바: 약 2.2초 동안 매 프레임 부드럽게 차오름. 지나는 지점마다 문구가 바뀌고, 다 차면 접속 안내 */
{
  const DUR = 2200, steps = [[0, '비 내리는 중'], [0.35, '요원 호출하는 중'], [0.7, '구역 지도 펼치는 중']];
  const fill = $('sp-fill'), msg = $('sp-msg');
  const ease = x => 1 - Math.pow(1 - x, 2.2);   // 처음엔 빠르게, 끝으로 갈수록 천천히
  let t0 = null, artDone = false;
  artReady.then(() => { artDone = true; });
  function loadTick(now) {
    if (started) return;
    if (t0 === null) t0 = now;
    const x = Math.min(1, (now - t0) / DUR), p = ease(x);
    fill.style.width = (p * 100).toFixed(2) + '%';
    let m = steps[0][1]; for (const [at, text] of steps) if (p >= at) m = text;
    if (msg.textContent !== m) msg.textContent = m;
    if (x < 1 || !artDone) { requestAnimationFrame(loadTick); return; }
    // 다 차면 자동으로 넘어가지 않고, 화면을 눌러야 접속
    splashReady = true; msg.textContent = 'READY'; msg.classList.add('ready');
    const tap = $('sp-tap'); tap.textContent = '터치하여 시작'; tap.classList.add('ready');
  }
  requestAnimationFrame(loadTick);
}
requestAnimationFrame(loop);
}
